    // =========================================================================
    // 7. M3 EXPRESSIVE WAVY PROGRESS BAR (60FPS SYNC + SEEK + CROSSFADE)
    // =========================================================================
    const wavyCtx = wavyProgressCanvas.getContext('2d');
    let isSeekingWavy = false;

    function resizeWavyCanvas() {
      const rect = wavyProgressContainer.getBoundingClientRect();
      if (rect.width === 0) return;
      const dpr = window.devicePixelRatio || 1;
      wavyProgressCanvas.width = Math.round(rect.width * dpr);
      wavyProgressCanvas.height = Math.round(rect.height * dpr);
      wavyCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeWavyCanvas);

    function animateWavyProgress(now) {
      // 1. Handle 60fps Equal-Power Dual-Deck Crossfade
      if (isCrossfading && state.stationPlaying) {
        const elapsed = now - crossfadeStartPerf;
        const p = Math.max(0, Math.min(1, elapsed / CROSSFADE_DURATION_MS));
        activeDeckFadeMultiplier = Math.sin(p * Math.PI * 0.5);
        inactiveDeckFadeMultiplier = Math.cos(p * Math.PI * 0.5);

        activeDeck.volume = computeDeckVolume(activeDeck, state.masterVolume, activeDeckFadeMultiplier);
        if (!inactiveDeck.paused) {
          inactiveDeck.volume = computeDeckVolume(inactiveDeck, state.masterVolume, inactiveDeckFadeMultiplier);
        }

        if (p >= 1) {
          isCrossfading = false;
          activeDeckFadeMultiplier = 1.0;
          inactiveDeckFadeMultiplier = 0.0;
          activeDeck.volume = computeDeckVolume(activeDeck, state.masterVolume, 1.0);
          try {
            inactiveDeck.pause();
            inactiveDeck.currentTime = 0;
          } catch (e) {}
        }
      }

      // 2. Sync progress from activeDeck (plays all the way to 100% natural 'ended' event without premature cut-off #2)
      if (state.stationPlaying && !isSeekingWavy && now > seekLockUntil) {
        const dur = activeDeck.duration;
        if (!activeDeck.paused && !activeDeck.seeking && dur > 5 && isFinite(dur)) {
          state.stationProgress = Math.max(0, Math.min(1, activeDeck.currentTime / dur));
        }
      }

      // 3. Render M3 Expressive Wavy Progress Bar using cached theme tokens (zero getComputedStyle thrashing)
      if (state.musicPopoverOpen) {
        const rect = wavyProgressContainer.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;
        if (w > 0 && h > 0) {
          const dpr = window.devicePixelRatio || 1;
          if (wavyProgressCanvas.width !== Math.round(w * dpr)) {
            resizeWavyCanvas();
          }
          wavyCtx.clearRect(0, 0, w, h);

          const targetAmp = state.stationPlaying ? 4.2 : 0;
          state.wavyAmp += (targetAmp - state.wavyAmp) * 0.14;
          if (state.stationPlaying) {
            state.wavyPhase += 0.10;
          }

          const tokens = getThemeTokens();
          const primaryColor = tokens.primary;
          const trackColor = tokens.track;

          const padX = 8;
          const usableW = w - padX * 2;
          const midY = h / 2;
          const clampedProg = Math.max(0, Math.min(1, state.stationProgress));
          const splitX = padX + usableW * clampedProg;

          wavyProgressContainer.setAttribute('aria-valuenow', String(Math.round(clampedProg * 100)));

          // Unplayed Flat Track
          if (splitX < w - padX) {
            wavyCtx.strokeStyle = trackColor;
            wavyCtx.lineWidth = 4;
            wavyCtx.lineCap = 'round';
            wavyCtx.beginPath();
            wavyCtx.moveTo(splitX + 6, midY);
            wavyCtx.lineTo(w - padX, midY);
            wavyCtx.stroke();
          }

          // Played M3 Expressive Sinusoidal Wave
          if (splitX > padX) {
            wavyCtx.strokeStyle = primaryColor;
            wavyCtx.lineWidth = 4;
            wavyCtx.lineCap = 'round';
            wavyCtx.beginPath();
            for (let x = padX; x <= splitX; x += 2) {
              const y = midY + Math.sin((x - padX) * 0.22 - state.wavyPhase) * state.wavyAmp;
              if (x === padX) wavyCtx.moveTo(x, y);
              else wavyCtx.lineTo(x, y);
            }
            wavyCtx.stroke();
          }

          // Expressive Squircle Thumb Indicator
          wavyCtx.fillStyle = primaryColor;
          const thumbW = isSeekingWavy ? 9 : 6;
          const thumbH = isSeekingWavy ? 22 : 16;
          wavyCtx.beginPath();
          wavyCtx.roundRect(splitX - thumbW / 2, midY - thumbH / 2, thumbW, thumbH, 4);
          wavyCtx.fill();
        }
      }
      requestAnimationFrame(animateWavyProgress);
    }
    requestAnimationFrame(animateWavyProgress);

    function updateVisualSeekFromPointer(e) {
      const rect = wavyProgressContainer.getBoundingClientRect();
      if (rect.width <= 0) return state.stationProgress;
      const padX = 8;
      const usableW = Math.max(1, rect.width - padX * 2);
      const rel = Math.max(0, Math.min(1, (e.clientX - rect.left - padX) / usableW));
      state.stationProgress = rel;
      return rel;
    }

    let endOfTrackHoldTimer = null;
    function commitSeekToActiveDeck(rel) {
      if (endOfTrackHoldTimer) {
        clearTimeout(endOfTrackHoldTimer);
        endOfTrackHoldTimer = null;
      }
      const clampedRel = Math.max(0, Math.min(1, rel));
      state.stationProgress = clampedRel;
      seekLockUntil = performance.now() + 850;
      const dur = activeDeck.duration;

      // Allow user to pull the progress bar all the way to the very end (100%):
      // Hold at 100% briefly so the full wave is visible, then advance cleanly if playing.
      if (clampedRel >= 0.995) {
        state.stationProgress = 1;
        if (state.stationPlaying) {
          try { activeDeck.pause(); } catch (e) {}
          endOfTrackHoldTimer = setTimeout(() => {
            endOfTrackHoldTimer = null;
            if (state.stationPlaying && !isSeekingWavy) {
              transitionToTrack(pickRandomNextTrackIndex());
            }
          }, 450);
        } else if (dur && isFinite(dur) && dur > 1) {
          try { activeDeck.currentTime = dur; } catch (e) {}
          pendingSeekRatio = 1;
        } else {
          pendingSeekRatio = 1;
        }
        return;
      }

      if (dur && isFinite(dur) && dur > 1) {
        try {
          activeDeck.currentTime = clampedRel * dur;
          pendingSeekRatio = null;
          if (state.stationPlaying && activeDeck.paused) {
            activeDeck.play().catch(() => {});
          }
        } catch (err) {
          pendingSeekRatio = clampedRel;
        }
      } else {
        pendingSeekRatio = clampedRel;
      }
    }

    wavyProgressContainer.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      isSeekingWavy = true;
      wavyProgressContainer.setPointerCapture(e.pointerId);
      updateVisualSeekFromPointer(e);
    });

    wavyProgressContainer.addEventListener('pointermove', (e) => {
      if (!isSeekingWavy) return;
      if (e.pointerType === 'mouse' && e.buttons !== 1) {
        isSeekingWavy = false;
        commitSeekToActiveDeck(state.stationProgress);
        return;
      }
      updateVisualSeekFromPointer(e);
    });

    function finishWavySeek() {
      if (!isSeekingWavy) return;
      isSeekingWavy = false;
      commitSeekToActiveDeck(state.stationProgress);
    }
    wavyProgressContainer.addEventListener('pointerup', finishWavySeek);
    wavyProgressContainer.addEventListener('pointercancel', finishWavySeek);

    // =========================================================================
    // 8. PIXEL VOLUME SLIDER (Simultaneously Controls Station & Ambient Volume)
    // =========================================================================
    let isDraggingVolume = false;

    function setMasterVolume(val) {
      const clamped = Math.max(0, Math.min(1, val));
      state.masterVolume = clamped;
      const pct = Math.round(clamped * 100);
      pixelVolumeLabel.textContent = `${pct}%`;
      pixelVolumeSlider.setAttribute('aria-valuenow', String(pct));
      pixelVolumeFill.style.width = `${Math.max(14, pct)}%`;

      if (pct === 0) {
        pixelVolumeIcon.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        `;
      } else if (pct < 50) {
        pixelVolumeIcon.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        `;
      } else {
        pixelVolumeIcon.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        `;
      }

      activeDeck.volume = computeDeckVolume(activeDeck, clamped, activeDeckFadeMultiplier);
      if (isCrossfading && !inactiveDeck.paused) {
        inactiveDeck.volume = computeDeckVolume(inactiveDeck, clamped, inactiveDeckFadeMultiplier);
      }
      Object.values(ambientPlayers).forEach(player => {
        player.updateVolume(clamped);
      });
    }

    function updateVolumeFromPointer(e) {
      const rect = pixelVolumeSlider.getBoundingClientRect();
      if (rect.width <= 0) return;
      const rel = (e.clientX - rect.left) / rect.width;
      setMasterVolume(rel);
    }

    pixelVolumeSlider.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      isDraggingVolume = true;
      pixelVolumeSlider.setPointerCapture(e.pointerId);
      updateVolumeFromPointer(e);
    });

    pixelVolumeSlider.addEventListener('pointermove', (e) => {
      if (!isDraggingVolume) return;
      if (e.pointerType === 'mouse' && e.buttons !== 1) {
        isDraggingVolume = false;
        return;
      }
      updateVolumeFromPointer(e);
    });

    function stopVolumeDrag() {
      isDraggingVolume = false;
    }
    pixelVolumeSlider.addEventListener('pointerup', stopVolumeDrag);
    pixelVolumeSlider.addEventListener('pointercancel', stopVolumeDrag);
    window.addEventListener('pointerup', () => {
      isDraggingVolume = false;
      if (isSeekingWavy) {
        isSeekingWavy = false;
        commitSeekToActiveDeck(state.stationProgress);
      }
    });

    // Floating Music Card Open/Close Logic
    registerSpringElement(musicPopoverCard, {
      radii: [32, 32, 32, 32],
      autoBind: false
    });

    function toggleMusicPopover() {
      state.musicPopoverOpen = !state.musicPopoverOpen;
      const cardSpring = springElements.get(musicPopoverCard);
      if (state.musicPopoverOpen) {
        musicPopoverCard.classList.remove('hidden');
        resizeWavyCanvas();
        if (cardSpring) {
          cardSpring.scaleX.current = 0.86;
          cardSpring.scaleY.current = 0.86;
          cardSpring.ty.current = 16;
          cardSpring.scaleX.setTarget(1, 0.04);
          cardSpring.scaleY.setTarget(1, 0.04);
          cardSpring.ty.setTarget(0);
          wakeSpringLoop();
        }
      } else {
        musicPopoverCard.classList.add('hidden');
      }
      syncMusicUIState();
    }

    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMusicPopover();
    });

    stationPlayPauseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleStationPlayPause();
    });

    stationNextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      transitionToTrack(pickRandomNextTrackIndex());
    });

    ambientBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleAmbientOption(btn.getAttribute('data-ambient'));
      });
    });

    document.addEventListener('pointerdown', (e) => {
      if (state.musicPopoverOpen && !musicPopoverCard.contains(e.target) && !musicBtn.contains(e.target)) {
        state.musicPopoverOpen = false;
        musicPopoverCard.classList.add('hidden');
        syncMusicUIState();
      }
    });

    // =========================================================================
    // 9. TIMER & PROGRESS RING LOGIC
    // =========================================================================
    function formatTime(totalSecs) {
      const mins = Math.floor(totalSecs / 60);
      const secs = totalSecs % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateClockUI() {
      timerDisplay.textContent = formatTime(state.timeLeftSeconds);

      const ratio = state.totalSecondsForSession > 0
        ? state.timeLeftSeconds / state.totalSecondsForSession
        : 0;
      const offset = RING_CIRCUMFERENCE * (1 - ratio);
      progressRing.style.strokeDasharray = `${RING_CIRCUMFERENCE}`;
      progressRing.style.strokeDashoffset = `${offset}`;

      if (state.isRunning) {
        startBtnLabel.textContent = '暂停';
        startBtnIcon.innerHTML = `
          <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"></rect>
        `;
      } else {
        const isStarted = state.timeLeftSeconds < state.totalSecondsForSession;
        startBtnLabel.textContent = isStarted ? '继续' : '开始';
        startBtnIcon.innerHTML = `<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"></polygon>`;
      }

      updateControlRowSprings();
    }

    function switchMode(newMode) {
      if (state.isRunning) {
        pauseTimer();
      }
      state.mode = newMode;
      document.body.setAttribute('data-mode', newMode);

      const mins = state.durations[newMode];
      state.totalSecondsForSession = mins * 60;
      state.timeLeftSeconds = mins * 60;
      state.timerEndTimestamp = null;

      const modeButtons = [
        { key: 'focus', btn: modeFocusBtn },
        { key: 'shortBreak', btn: modeShortBtn },
        { key: 'longBreak', btn: modeLongBtn }
      ];
      modeButtons.forEach(({ key, btn }) => {
        if (key === newMode) {
          btn.style.backgroundColor = 'var(--md-primary)';
          btn.style.color = 'var(--md-on-primary)';
        } else {
          btn.style.backgroundColor = 'transparent';
          btn.style.color = 'var(--md-text-muted)';
        }
      });

      pencilEditDurationBtn.style.display = newMode === 'focus' ? 'flex' : 'none';

      updateModeGroupSprings(null, null);
      updateClockUI();
    }

    function syncTimerFromWallClock() {
      if (!state.isRunning || !state.timerEndTimestamp) return;
      const remainingMs = state.timerEndTimestamp - Date.now();
      if (remainingMs <= 0) {
        state.timeLeftSeconds = 0;
        updateClockUI();
        handleSessionComplete();
      } else {
        const nextSecs = Math.max(0, Math.ceil(remainingMs / 1000));
        if (nextSecs !== state.timeLeftSeconds) {
          state.timeLeftSeconds = nextSecs;
          updateClockUI();
        }
      }
    }

    function startTimer() {
      if (state.isRunning) return;
      state.isRunning = true;
      state.timerEndTimestamp = Date.now() + (state.timeLeftSeconds * 1000);
      requestWakeLockAndKeepAlive();
      updateClockUI();

      if (state.timerInterval) clearInterval(state.timerInterval);
      state.timerInterval = setInterval(syncTimerFromWallClock, 250);
    }

    function pauseTimer() {
      if (state.isRunning && state.timerEndTimestamp) {
        state.timeLeftSeconds = Math.max(0, Math.ceil((state.timerEndTimestamp - Date.now()) / 1000));
      }
      state.isRunning = false;
      state.timerEndTimestamp = null;
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
      updateClockUI();
    }

    function resetTimer() {
      pauseTimer();
      const mins = state.durations[state.mode];
      state.totalSecondsForSession = mins * 60;
      state.timeLeftSeconds = mins * 60;
      state.timerEndTimestamp = null;
      updateClockUI();
    }

    function handleSessionComplete() {
      const completedMode = state.mode;
      pauseTimer();
      playSessionCompletionRingtone(completedMode);

      // Requirement #4: ONLY when a Focus countdown finishes does it record +1 in 「专注次数」
      // and add the completed focus countdown duration to 「专注时长」!
      if (completedMode === 'focus') {
        state.completedFocusSessions += 1;
        state.completedFocusMinutes += state.durations.focus;
        saveDailyDataToStorage();
        renderTasksAndOverview('sessionComplete');
      }

      const mins = state.durations[state.mode];
      state.totalSecondsForSession = mins * 60;
      state.timeLeftSeconds = mins * 60;
      state.timerEndTimestamp = null;
      updateClockUI();
    }

    // =========================================================================
    // 10. TASKS & OVERVIEW DYNAMIC SYNCHRONIZATION (#3, #4)
    //     - Task's `focusedMinutes` in 「今日任务」 is strictly the user's estimated
    //       completion time (预计完成时间) and is NEVER mixed into 「专注时长」 or 「专注次数」.
    //     - 「专注次数」 only counts completed Focus timer countdowns.
    //     - 「专注时长」 only counts actual minutes from completed Focus timer countdowns.
    //     - 「完成任务」 only counts tasks marked as completed by the user.
    // =========================================================================
    function renderTasksAndOverview(changedType = null) {
      if (state.tasks.length === 0) {
        taskListContainer.innerHTML = `
          <div class="h-full min-h-[120px] flex items-center justify-center text-sm font-semibold" style="color: var(--md-text-muted);">
            暂无任务
          </div>
        `;
      } else {
        taskListContainer.innerHTML = state.tasks.map(task => {
          return `
            <div class="py-3.5 px-2 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3.5 min-w-0 flex-1">
                <button type="button" data-action="toggle-complete" data-id="${task.id}"
                        class="task-check-btn w-6 h-6 flex items-center justify-center border-2 shrink-0 m3-Interactive"
                        style="border-radius: ${task.completed ? '12px' : '8px'}; border-color: var(--md-primary); background-color: ${task.completed ? 'var(--md-primary)' : 'transparent'}; color: var(--md-on-primary);">
                  ${task.completed ? `
                    <svg class="w-3.5 h-3.5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  ` : ''}
                </button>

                <span class="font-bold text-sm sm:text-base truncate ${task.completed ? 'line-through opacity-55' : ''}">
                  ${escapeHtml(task.name)}
                </span>
              </div>

              <div class="flex items-center gap-3 shrink-0">
                <span class="text-sm font-extrabold clock-digits" style="color: var(--md-primary);">
                  ${task.focusedMinutes} 分钟
                </span>

                <button type="button" data-action="delete-task" data-id="${task.id}"
                        class="task-del-btn w-8 h-8 flex items-center justify-center m3-Interactive"
                        style="border-radius: 12px; background-color: var(--md-surface); color: var(--md-text-muted);"
                        aria-label="删除任务">
                  <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              </div>
            </div>
          `;
        }).join('');

        taskListContainer.querySelectorAll('.task-check-btn').forEach(btn => {
          const isDone = btn.querySelector('svg') !== null;
          registerSpringElement(btn, {
            radii: isDone ? [12, 12, 12, 12] : [8, 8, 8, 8],
            hoverRadii: [12, 12, 12, 12],
            activeRadii: [6, 6, 6, 6],
            hoverScale: 1.12,
            activeScaleX: 1.2,
            activeScaleY: 0.85,
            magnetic: 0.08
          });
        });
        taskListContainer.querySelectorAll('.task-del-btn').forEach(btn => {
          registerSpringElement(btn, {
            radii: [12, 12, 12, 12],
            hoverRadii: [16, 16, 16, 16],
            activeRadii: [9, 9, 9, 9],
            hoverScale: 1.1,
            activeScaleX: 1.15,
            activeScaleY: 0.88,
            magnetic: 0.08
          });
        });
      }

      const completedTasksCount = state.tasks.filter(t => t.completed).length;

      statCompletedSessions.textContent = String(state.completedFocusSessions);
      statFocusMinutes.textContent = String(state.completedFocusMinutes);
      statCompletedTasks.textContent = String(completedTasksCount);

      if (changedType === 'sessionComplete') {
        pulseElementSpring(overviewCardSessions, 0.07, 0.07);
        pulseElementSpring(overviewCardMinutes, 0.07, 0.07);
      } else if (changedType === 'complete' || changedType === 'delete') {
        pulseElementSpring(overviewCardTasks, 0.07, 0.07);
      } else if (changedType === 'all') {
        pulseElementSpring(overviewCardSessions, 0.06, 0.06);
        pulseElementSpring(overviewCardMinutes, 0.06, 0.06);
        pulseElementSpring(overviewCardTasks, 0.06, 0.06);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // =========================================================================
    // 11. MODAL SCROLL LOCK & SPRING DIALOG ANIMATIONS
    // =========================================================================
    registerSpringElement(customDurationDialog, { radii: [32, 32, 32, 32], autoBind: false });
    registerSpringElement(addTaskDialog, { radii: [32, 32, 32, 32], autoBind: false });

    function lockBodyScroll() {
      document.body.classList.add('modal-open');
    }

    function unlockBodyScroll() {
      document.body.classList.remove('modal-open');
    }

    function highlightPresetButtons(val) {
      presetBtns.forEach(btn => {
        const presetVal = parseInt(btn.getAttribute('data-preset-min'), 10);
        if (presetVal === val) {
          btn.style.backgroundColor = 'var(--md-primary-container)';
          btn.style.color = 'var(--md-on-primary-container)';
        } else {
          btn.style.backgroundColor = 'var(--md-surface)';
          btn.style.color = 'var(--md-text-main)';
        }
      });
      updatePresetGroupSprings(null, null);
    }

    function openCustomDurationModal() {
      customFocusInput.value = state.durations.focus;
      highlightPresetButtons(state.durations.focus);
      customDurationModal.classList.remove('hidden');
      customDurationModal.classList.add('flex');
      lockBodyScroll();

      const dSpring = springElements.get(customDurationDialog);
      if (dSpring) {
        dSpring.scaleX.current = 0.88;
        dSpring.scaleY.current = 0.88;
        dSpring.scaleX.setTarget(1, 0.04);
        dSpring.scaleY.setTarget(1, 0.04);
        wakeSpringLoop();
      }
      setTimeout(() => customFocusInput.focus(), 40);
    }

    function hideCustomDurationModal() {
      customDurationModal.classList.add('hidden');
      customDurationModal.classList.remove('flex');
      unlockBodyScroll();
    }

    function openAddTaskModal() {
      modalTaskTitle.value = '';
      modalTaskFocused.value = String(state.durations.focus);
      addTaskModal.classList.remove('hidden');
      addTaskModal.classList.add('flex');
      lockBodyScroll();

      const dSpring = springElements.get(addTaskDialog);
      if (dSpring) {
        dSpring.scaleX.current = 0.88;
        dSpring.scaleY.current = 0.88;
        dSpring.scaleX.setTarget(1, 0.04);
        dSpring.scaleY.setTarget(1, 0.04);
        wakeSpringLoop();
      }
      setTimeout(() => modalTaskTitle.focus(), 40);
    }

    function hideAddTaskModal() {
      addTaskModal.classList.add('hidden');
      addTaskModal.classList.remove('flex');
      unlockBodyScroll();
    }

    // =========================================================================
    // 12. EVENT LISTENERS & INITIALIZATION
    // =========================================================================
    modeFocusBtn.addEventListener('click', () => switchMode('focus'));
    modeShortBtn.addEventListener('click', () => switchMode('shortBreak'));
    modeLongBtn.addEventListener('click', () => switchMode('longBreak'));

    startBtn.addEventListener('click', () => {
      if (state.isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    resetBtn.addEventListener('click', resetTimer);

    pencilEditDurationBtn.addEventListener('click', openCustomDurationModal);
    closeDurationModal.addEventListener('click', hideCustomDurationModal);
    cancelDurationBtn.addEventListener('click', hideCustomDurationModal);

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const minVal = parseInt(btn.getAttribute('data-preset-min'), 10);
        customFocusInput.value = minVal;
        highlightPresetButtons(minVal);
      });
    });

    customFocusInput.addEventListener('input', () => {
      highlightPresetButtons(parseInt(customFocusInput.value, 10));
    });

    saveDurationBtn.addEventListener('click', () => {
      const val = Math.min(180, Math.max(1, parseInt(customFocusInput.value, 10) || 25));
      state.durations.focus = val;
      saveDailyDataToStorage();
      hideCustomDurationModal();
      switchMode('focus');
    });

    addTaskTopBtn.addEventListener('click', openAddTaskModal);
    closeTaskModal.addEventListener('click', hideAddTaskModal);
    cancelTaskModalBtn.addEventListener('click', hideAddTaskModal);

    modalTaskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = modalTaskTitle.value.trim();
      if (!name) return;
      const focusedMinutes = Math.max(1, parseInt(modalTaskFocused.value, 10) || state.durations.focus);
      const newTask = {
        id: 'task-' + Date.now(),
        name,
        focusedMinutes,
        completed: false
      };
      state.tasks.unshift(newTask);
      saveDailyDataToStorage();
      hideAddTaskModal();
      renderTasksAndOverview('add');
    });

    taskListContainer.addEventListener('click', (e) => {
      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.getAttribute('data-action');
      const taskId = actionEl.getAttribute('data-id');
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;

      if (action === 'toggle-complete') {
        task.completed = !task.completed;
        saveDailyDataToStorage();
        renderTasksAndOverview('complete');
      } else if (action === 'delete-task') {
        state.tasks = state.tasks.filter(t => t.id !== taskId);
        saveDailyDataToStorage();
        renderTasksAndOverview('delete');
      }
    });

    [customDurationModal, addTaskModal].forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          hideCustomDurationModal();
          hideAddTaskModal();
        }
      });
      modal.addEventListener('wheel', (e) => {
        e.preventDefault();
      }, { passive: false });
      modal.addEventListener('touchmove', (e) => {
        e.preventDefault();
      }, { passive: false });
    });

    // =========================================================================
    // 13. ALWAYS-ONLINE CAMPUS WI-FI KEEP-ALIVE & SCREEN WAKE LOCK DAEMON (#6):
    //     Prevents MacBook / campus Wi-Fi from dropping connection or suspending
    //     the web app when the screen dims or locks:
    //     1. Screen Wake Lock API (`navigator.wakeLock.request('screen')`)
    //     2. Sub-audible Web Audio keep-alive node to prevent macOS App Nap
    //     3. Periodic 18s HTTP keep-alive heartbeat ping (`keepalive: true`)
    //     4. Instant audio stream & wall-clock timer recovery on `online` / `visibilitychange`
    // =========================================================================
    let wakeLockSentinel = null;
    let keepAliveAudioStarted = false;

    async function requestWakeLockAndKeepAlive() {
      // 1. Request Screen Wake Lock so MacBook screen stays awake
      if ('wakeLock' in navigator && document.visibilityState === 'visible') {
        try {
          if (!wakeLockSentinel || wakeLockSentinel.released) {
            wakeLockSentinel = await navigator.wakeLock.request('screen');
          }
        } catch (e) {}
      }

      // 2. Start ultra-quiet (-90 dBFS) Web Audio keep-alive oscillator so macOS never puts tab or Wi-Fi socket into App Nap
      try {
        ensureAudioCtx();
        if (audioCtx && !keepAliveAudioStarted) {
          const osc = audioCtx.createOscillator();
          const silentGain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 30;
          silentGain.gain.value = 0.00001;
          osc.connect(silentGain);
          silentGain.connect(audioCtx.destination);
          osc.start();
          keepAliveAudioStarted = true;
        }
      } catch (e) {}
    }

    function recoverAudioAndTimerAfterWakeOrReconnect() {
      syncTimerFromWallClock();
      requestWakeLockAndKeepAlive();

      // Resume Station music if it was playing and got interrupted by network blip
      if (state.stationPlaying && activeDeck && activeDeck.paused) {
        activeDeck.play().catch(() => {
          transitionToTrack(pickRandomNextTrackIndex());
        });
      }

      // Resume all active Ambient sounds if any got paused
      state.activeAmbients.forEach(type => {
        if (!ambientPlayers[type]) {
          startAmbientSound(type);
        } else if (ambientPlayers[type].resume) {
          ambientPlayers[type].resume();
        }
      });

      // Top up live music pool if needed
      if (state.onlineTracks.length < 15) {
        replenishLiveMusicPool();
      }
    }

    // Periodic 18-second Campus Wi-Fi Keep-Alive Heartbeat Ping
    // Keeps NAT states and campus Wi-Fi 802.1X sessions active continuously
    setInterval(() => {
      syncTimerFromWallClock();
      const pingUrl = `https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg?keepalive=${Date.now()}`;
      fetch(pingUrl, {
        method: 'HEAD',
        mode: 'no-cors',
        cache: 'no-store',
        keepalive: true
      }).catch(() => {});
    }, 18000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        recoverAudioAndTimerAfterWakeOrReconnect();
      }
    });

    window.addEventListener('online', () => {
      recoverAudioAndTimerAfterWakeOrReconnect();
    });

    window.addEventListener('focus', () => {
      recoverAudioAndTimerAfterWakeOrReconnect();
    });

    ['pointerdown', 'keydown'].forEach(evt => {
      document.addEventListener(evt, () => {
        requestWakeLockAndKeepAlive();
      }, { once: false, passive: true });
    });

    // Load Today's Persisted Data (or auto-reset if past 00:00) and Render
    loadDailyDataFromStorage();
    updateThemeSwitchTargets();
    requestAnimationFrame(animateThemeSwitch);
    renderTasksAndOverview();
    updateClockUI();
  </script>
</body>
