<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoflow</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='11' fill='%23B3261E'/%3E%3Cpath d='M16 9.5C10.2 9.5 6.5 13.1 6.5 18.2C6.5 23.3 10.6 26.8 16 26.8C21.4 26.8 25.5 23.3 25.5 18.2C25.5 13.1 21.8 9.5 16 9.5Z' fill='%23FFFFFF'/%3E%3Cpath d='M16 9.8C13.2 6.2 9.2 6.8 8.2 9.0C11.2 10.2 13.8 10.0 16 9.8Z' fill='%23FFDDB3'/%3E%3Cpath d='M16 9.8C18.8 6.2 22.8 6.8 23.8 9.0C20.8 10.2 18.2 10.0 16 9.8Z' fill='%23FFDDB3'/%3E%3Cpath d='M16 5.2V9.8' stroke='%23FFDDB3' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='18.2' r='5.2' fill='none' stroke='%23B3261E' stroke-width='2.1' stroke-dasharray='22 12' stroke-linecap='round'/%3E%3Cpath d='M16 15.2V18.2L18.4 19.8' fill='none' stroke='%23B3261E' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
       MATERIAL 3 EXPRESSIVE DYNAMIC COLOR TOKENS (LIGHT & DARK × 3 MODES)
       ========================================================================= */
    :root {
      color-scheme: light;
      /* Focus Mode - Light (Warm Terracotta) */
      --md-bg: #FFF8F6;
      --md-surface: #FCEAE5;
      --md-surface-high: #F5DDD7;
      --md-surface-card: #FFFFFF;
      --md-primary: #B3261E;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #FFDAD4;
      --md-on-primary-container: #410001;
      --md-secondary-container: #F9DEDC;
      --md-on-secondary-container: #410E0B;
      --md-tertiary-container: #FFDDB3;
      --md-on-tertiary-container: #291800;
      --md-outline: #E0BDBA;
      --md-text-main: #231917;
      --md-text-muted: #5C403C;
      --md-ring-track: #F2D3CD;
      --md-switch-off-rgb: 216, 194, 190;
      --md-switch-on-rgb: 179, 38, 30;
      --md-shadow: rgba(179, 38, 30, 0.08);
    }

    body[data-mode="shortBreak"] {
      --md-bg: #F4FBF8;
      --md-surface: #E2F3EC;
      --md-surface-high: #D3EAE1;
      --md-surface-card: #FFFFFF;
      --md-primary: #006B58;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #A1F2DC;
      --md-on-primary-container: #002019;
      --md-secondary-container: #CFE9DF;
      --md-on-secondary-container: #072019;
      --md-tertiary-container: #C4E7FF;
      --md-on-tertiary-container: #001E2C;
      --md-outline: #B4D2C7;
      --md-text-main: #171D1B;
      --md-text-muted: #3F4945;
      --md-ring-track: #CBE6DC;
      --md-switch-off-rgb: 180, 210, 199;
      --md-switch-on-rgb: 0, 107, 88;
      --md-shadow: rgba(0, 107, 88, 0.08);
    }

    body[data-mode="longBreak"] {
      --md-bg: #FBF8FF;
      --md-surface: #EFEBF9;
      --md-surface-high: #E4DFF3;
      --md-surface-card: #FFFFFF;
      --md-primary: #5754A8;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #E2DFFF;
      --md-on-primary-container: #130E63;
      --md-secondary-container: #E3E0F9;
      --md-on-secondary-container: #19182C;
      --md-tertiary-container: #FFD8EC;
      --md-on-tertiary-container: #370726;
      --md-outline: #C8C4DC;
      --md-text-main: #1C1B22;
      --md-text-muted: #474654;
      --md-ring-track: #DCD8EE;
      --md-switch-off-rgb: 200, 196, 220;
      --md-switch-on-rgb: 87, 84, 168;
      --md-shadow: rgba(87, 84, 168, 0.08);
    }

    /* Dark Mode Overrides across all 3 modes */
    body.dark-mode {
      color-scheme: dark;
    }

    body.dark-mode[data-mode="focus"] {
      --md-bg: #16100F;
      --md-surface: #251B19;
      --md-surface-high: #322523;
      --md-surface-card: #1E1514;
      --md-primary: #FFB4A8;
      --md-on-primary: #690005;
      --md-primary-container: #7D1D16;
      --md-on-primary-container: #FFDAD4;
      --md-secondary-container: #4A3330;
      --md-on-secondary-container: #FFDAD4;
      --md-tertiary-container: #554017;
      --md-on-tertiary-container: #FFDDB3;
      --md-outline: #4E3D3A;
      --md-text-main: #F5E2DF;
      --md-text-muted: #CBB2AE;
      --md-ring-track: #362624;
      --md-switch-off-rgb: 78, 61, 58;
      --md-switch-on-rgb: 224, 102, 90;
      --md-shadow: rgba(0, 0, 0, 0.45);
    }

    body.dark-mode[data-mode="shortBreak"] {
      --md-bg: #0E1513;
      --md-surface: #182420;
      --md-surface-high: #22312C;
      --md-surface-card: #141E1B;
      --md-primary: #85D6C0;
      --md-on-primary: #00382D;
      --md-primary-container: #005142;
      --md-on-primary-container: #A1F2DC;
      --md-secondary-container: #2B423B;
      --md-on-secondary-container: #CFE9DF;
      --md-tertiary-container: #1F4456;
      --md-on-tertiary-container: #C4E7FF;
      --md-outline: #384944;
      --md-text-main: #E0EAE6;
      --md-text-muted: #B2C4BE;
      --md-ring-track: #22332E;
      --md-switch-off-rgb: 56, 73, 68;
      --md-switch-on-rgb: 46, 158, 133;
      --md-shadow: rgba(0, 0, 0, 0.45);
    }

    body.dark-mode[data-mode="longBreak"] {
      --md-bg: #121218;
      --md-surface: #1E1E28;
      --md-surface-high: #282836;
      --md-surface-card: #181821;
      --md-primary: #C3C0FF;
      --md-on-primary: #282377;
      --md-primary-container: #3F3C8F;
      --md-on-primary-container: #E2DFFF;
      --md-secondary-container: #38384C;
      --md-on-secondary-container: #E3E0F9;
      --md-tertiary-container: #543247;
      --md-on-tertiary-container: #FFD8EC;
      --md-outline: #434254;
      --md-text-main: #E6E3F0;
      --md-text-muted: #BEBBD0;
      --md-ring-track: #2A293A;
      --md-switch-off-rgb: 67, 66, 84;
      --md-switch-on-rgb: 118, 114, 212;
      --md-shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Unified Theme Transition: Eliminates full-page flash when switching Light <-> Dark (#3) */
    body,
    .m3-SurfaceTransition,
    #mode-group,
    #clock-card,
    #today-tasks-section,
    #focus-overview-section,
    #music-popover-card,
    #custom-duration-dialog,
    #add-task-dialog,
    #reminder-confirm-dialog,
    #pixel-volume-slider,
    #pixel-volume-fill {
      transition: background-color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background-color: var(--md-bg);
      color: var(--md-text-main);
      overflow-x: hidden;
    }

    body.modal-open {
      overflow: hidden !important;
      height: 100vh;
    }

    .clock-digits {
      font-family: 'Inter', 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }

    .progress-ring-circle {
      transition: stroke-dashoffset 0.65s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    .progress-ring-track {
      transition: stroke 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Fixed GPU-Composited Ambient Blob: Uses solid background-color instead of radial-gradient
       so CSS transitions smoothly interpolate without destroying/flashing the blur texture (#3) */
    .ambient-blob {
      background-color: var(--md-primary-container);
      filter: blur(88px);
      opacity: 0.38;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      will-change: background-color, opacity;
      transition: background-color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.dark-mode .ambient-blob {
      opacity: 0.20;
    }

    /* Universal M3 Expressive Interactive Element */
    .m3-Interactive {
      will-change: transform, border-radius, flex-grow;
      user-select: none;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
      transition: background-color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .m3-Interactive::after {
      content: '';
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      pointer-events: none;
      border-radius: inherit;
      transition: opacity 0.2s ease;
    }
    .m3-Interactive:hover::after {
      opacity: 0.06;
    }
    .m3-Interactive:active::after {
      opacity: 0.12;
    }

    /* M3 Expressive Input Interactive Styling */
    .m3-Input {
      will-change: transform, border-radius;
      transition: background-color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.28s ease;
    }
    .m3-Input:focus {
      border-color: var(--md-primary) !important;
      box-shadow: 0 0 0 3px var(--md-primary-container);
    }

    /* =========================================================================
       TOP-RIGHT M3 EXPRESSIVE SWITCH (1:1 Reference from m3_expressive.html)
       ========================================================================= */
    .m3e-switch-scale-box {
      width: 68px;
      height: 39px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .m3e-switch-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      outline: none;
      transform: scale(0.607);
      transform-origin: center center;
    }

    .m3e-switch-wrapper:active {
      cursor: grabbing;
    }

    .m3e-switch-track {
      position: relative;
      width: 112px;
      height: 64px;
      border-radius: 32px;
      transition: box-shadow 0.2s ease;
      will-change: transform, background-color;
    }

    .m3e-thumb-halo {
      position: absolute;
      top: 50%;
      left: 0;
      width: 76px;
      height: 76px;
      border-radius: 26px;
      background-color: rgba(128, 128, 128, 0.18);
      pointer-events: none;
      transform: translate3d(0, -50%, 0) scale(0.5);
      opacity: 0;
      transition: opacity 0.2s ease;
      will-change: transform, opacity;
    }

    .m3e-switch-thumb {
      position: absolute;
      top: 50%;
      left: 0;
      width: 42px;
      height: 46px;
      border-radius: 14px;
      background-color: #FFFFFF;
      box-shadow: 0 4px 9px rgba(25, 20, 35, 0.20), 0 1.5px 3px rgba(25, 20, 35, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      will-change: transform, width, height, border-radius, box-shadow;
    }

    /* Music Equalizer Animation */
    @keyframes eqBar1 {
      0%, 100% { height: 5px; }
      50% { height: 15px; }
    }
    @keyframes eqBar2 {
      0%, 100% { height: 14px; }
      33% { height: 5px; }
      66% { height: 16px; }
    }
    @keyframes eqBar3 {
      0%, 100% { height: 7px; }
      40% { height: 15px; }
      80% { height: 5px; }
    }
    .eq-playing .eq-1 { animation: eqBar1 0.7s ease-in-out infinite; }
    .eq-playing .eq-2 { animation: eqBar2 0.6s ease-in-out infinite; }
    .eq-playing .eq-3 { animation: eqBar3 0.8s ease-in-out infinite; }

    /* Station Track Title Infinite Right-to-Left Marquee (Strictly Clipped to Display Bounds) */
    .station-marquee-viewport {
      position: relative;
      overflow: hidden !important;
      white-space: nowrap;
      min-width: 0;
      max-width: 100%;
      width: 100%;
      contain: paint;
      -webkit-mask-image: linear-gradient(to right, transparent 0px, #000 6px, #000 calc(100% - 6px), transparent 100%);
      mask-image: linear-gradient(to right, transparent 0px, #000 6px, #000 calc(100% - 6px), transparent 100%);
    }

    .station-marquee-track {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation: stationMarqueeRTL var(--marquee-duration, 11s) linear infinite;
    }

    .station-marquee-item {
      display: inline-block;
      white-space: nowrap;
      padding-right: 44px;
    }

    @keyframes stationMarqueeRTL {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--md-outline);
      border-radius: 9999px;
    }
  </style>
</head>
<body data-mode="focus" class="min-h-screen lg:h-screen lg:overflow-hidden relative flex flex-col">

  <!-- Expressive Ambient Background Blobs -->
  <div class="ambient-blob fixed -top-24 -left-24 w-96 h-96 rounded-full z-0"></div>
  <div class="ambient-blob fixed bottom-0 -right-28 w-[26rem] h-[26rem] rounded-full z-0"></div>

  <!-- ========================================================================= -->
  <!-- TOP NAVIGATION BAR: Left Brand + Right M3 Expressive Light/Dark Switch   -->
  <!-- ========================================================================= -->
  <header class="relative z-20 w-full max-w-[1360px] mx-auto px-5 sm:px-8 pt-4 pb-2 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <!-- Redesigned M3 Expressive Pomodoro Tomato Icon (#4) -->
      <div id="brand-logo"
           class="w-11 h-11 flex items-center justify-center shadow-sm m3-Interactive"
           style="background-color: var(--md-primary); color: var(--md-on-primary); border-radius: 16px;">
        <svg class="w-7 h-7 pointer-events-none" viewBox="0 0 32 32" fill="none">
          <!-- Plump M3 Expressive Tomato Silhouette -->
          <path d="M16 9.6C10.1 9.6 6.2 13.1 6.2 18.3C6.2 23.5 10.4 27.0 16 27.0C21.6 27.0 25.8 23.5 25.8 18.3C25.8 13.1 21.9 9.6 16 9.6Z"
                fill="currentColor" />
          <!-- Expressive Three-Leaf Tomato Crown / Calyx -->
          <path d="M16 9.8C13.0 5.8 8.6 6.4 7.6 8.8C10.8 10.2 13.6 10.1 16 9.8Z"
                fill="var(--md-tertiary-container)" />
          <path d="M16 9.8C19.0 5.8 23.4 6.4 24.4 8.8C21.2 10.2 18.4 10.1 16 9.8Z"
                fill="var(--md-tertiary-container)" />
          <path d="M16 4.6V9.8"
                stroke="var(--md-tertiary-container)" stroke-width="2.5" stroke-linecap="round" />
          <!-- Embedded Pomodoro Focus Progress Ring & 25-Min Timer Hand inside Tomato -->
          <circle cx="16" cy="18.4" r="5.3"
                  stroke="var(--md-primary)" stroke-width="2.2" stroke-dasharray="23 11" stroke-linecap="round" />
          <path d="M16 15.2V18.4L18.5 20.0"
                stroke="var(--md-primary)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight" style="color: var(--md-text-main);">Pomodoflow</h1>
    </div>

    <!-- Right: M3 Expressive Squircle Switch (Sun <-> Moon Icon Evolution) -->
    <div class="m3e-switch-scale-box">
      <div id="themeSwitch"
           role="switch"
           aria-checked="false"
           aria-label="切换浅色或深色模式"
           tabindex="0"
           class="m3e-switch-wrapper">
        <div id="themeTrack" class="m3e-switch-track">
          <div id="themeHalo" class="m3e-thumb-halo"></div>
          <div id="themeThumb" class="m3e-switch-thumb">
            <svg id="themeThumbSvg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <g id="themeSunGroup">
                <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
                <path d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56"></path>
              </g>
              <g id="themeMoonGroup" class="hidden">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"></path>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- SINGLE-PAGE SPLIT SCREEN: Left Main Area | Right Secondary Area          -->
  <!-- ========================================================================= -->
  <main class="relative z-10 flex-1 w-full max-w-[1360px] mx-auto px-5 sm:px-8 pb-5 pt-1 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-center min-h-0">

    <!-- ======================================================================= -->
    <!-- LEFT SCREEN (6 cols): MAIN POMODORO TIMER & CONTROLS                    -->
    <!-- ======================================================================= -->
    <section class="lg:col-span-6 h-full flex flex-col items-center justify-center min-h-0 py-2">

      <!-- 1. Mode Switcher Above the Clock: 「专注」、「短歇」、「长歇」 -->
      <div class="w-full max-w-md mb-5 shrink-0">
        <div id="mode-group"
             class="p-1.5 flex items-stretch gap-1.5 shadow-sm border h-13 sm:h-14"
             style="background-color: var(--md-surface); border-color: var(--md-outline); border-radius: 28px;">
          <button id="mode-focus-btn" type="button" data-mode-btn="focus"
                  class="m3-Interactive font-bold text-sm sm:text-base flex items-center justify-center px-3"
                  style="flex: 1.14 1 0%; border-radius: 22px; background-color: var(--md-primary); color: var(--md-on-primary);">
            <span>专注</span>
          </button>

          <button id="mode-short-btn" type="button" data-mode-btn="shortBreak"
                  class="m3-Interactive font-bold text-sm sm:text-base flex items-center justify-center px-3"
                  style="flex: 0.93 1 0%; border-radius: 16px; background-color: transparent; color: var(--md-text-muted);">
            <span>短歇</span>
          </button>

          <button id="mode-long-btn" type="button" data-mode-btn="longBreak"
                  class="m3-Interactive font-bold text-sm sm:text-base flex items-center justify-center px-3"
                  style="flex: 0.93 1 0%; border-radius: 16px; background-color: transparent; color: var(--md-text-muted);">
            <span>长歇</span>
          </button>
        </div>
      </div>

      <!-- 2. Center Circular Progress Pomodoro Clock -->
      <div class="relative flex items-center justify-center my-1 shrink-0">
        <div id="clock-card"
             class="relative w-[276px] h-[276px] sm:w-[316px] sm:h-[316px] flex items-center justify-center border m3-Interactive"
             style="background-color: var(--md-surface-card); border-color: var(--md-outline); border-radius: 56px; box-shadow: 0 18px 40px -12px var(--md-shadow);">

          <svg class="w-[244px] h-[244px] sm:w-[284px] sm:h-[284px] pointer-events-none" viewBox="0 0 260 260">
            <circle
              class="progress-ring-track"
              cx="130" cy="130" r="112"
              fill="none"
              stroke="var(--md-ring-track)"
              stroke-width="16"
              stroke-linecap="round"
            />
            <circle
              id="progress-ring"
              class="progress-ring-circle"
              cx="130" cy="130" r="112"
              fill="none"
              stroke="var(--md-primary)"
              stroke-width="16"
              stroke-linecap="round"
              stroke-dasharray="703.72"
              stroke-dashoffset="0"
            />
          </svg>

          <!-- Dead-Center Fixed Time Readout -->
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div id="timer-display"
                 class="clock-digits text-6xl sm:text-7xl font-extrabold tracking-tight select-none leading-none"
                 style="color: var(--md-text-main);">
              25:00
            </div>
          </div>

          <!-- Pencil Icon Positioned in the Clean Inner Space Below Time -->
          <button id="pencil-edit-duration-btn" type="button"
                  aria-label="自定义专注时间"
                  class="absolute left-1/2 -translate-x-1/2 w-9 h-9 flex items-center justify-center m3-Interactive z-10"
                  style="top: calc(50% + 44px); background-color: var(--md-surface); color: var(--md-primary); border-radius: 14px;">
            <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- 3. Control Row Below the Clock + Floating Music Card Anchor -->
      <div class="w-full max-w-xl mt-6 shrink-0 relative">

        <!-- =================================================================== -->

        <div id="music-popover-card"

          <div class="mb-4">
            <div class="text-xs font-extrabold tracking-wide mb-2" style="color: var(--md-text-muted);">站台</div>
            <div class="p-3.5 rounded-[22px] border m3-SurfaceTransition"

                <div id="station-title-viewport" class="station-marquee-viewport flex-1 min-w-0">
                  <div id="station-marquee-track" class="station-marquee-track text-sm font-extrabold" style="color: var(--md-text-main);">

                  </div>
                </div>
                <div id="station-controls-group" class="flex items-stretch gap-1.5 shrink-0 w-[82px] h-9">
                  <button id="station-play-pause-btn" type="button"
                          aria-label="播放或暂停站台音乐"
                          class="h-full flex items-center justify-center m3-Interactive"
                          style="flex: 1 1 0%; background-color: var(--md-primary); color: var(--md-on-primary); border-radius: 17px;">
                    <svg id="station-play-icon" class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="currentColor">
                      <polygon points="6 3 20 12 6 21 6 3"></polygon>
                    </svg>
                  </button>
                  <button id="station-next-btn" type="button"
                          aria-label="切歌"
                          class="h-full flex items-center justify-center border m3-Interactive"
                          style="flex: 1 1 0%; background-color: var(--md-surface); color: var(--md-text-main); border-color: var(--md-outline); border-radius: 13px;">
                    <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                      <polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon>
                      <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- M3 Expressive Wavy Progress Bar -->
              <div id="wavy-progress-container"
                   role="slider"
                   aria-label="歌曲播放进度"
                   aria-valuemin="0"
                   aria-valuemax="100"
                   aria-valuenow="0"
                   class="relative w-full h-7 flex items-center cursor-pointer select-none touch-none">
                <canvas id="wavy-progress-canvas" class="w-full h-7 block pointer-events-none"></canvas>
              </div>
            </div>
          </div>

          <!-- LAYER 2: 「背景音」 (雨天、壁炉、海浪、森林 in 1 row; 0, 1, or multi-select) -->
          <div class="mb-4">
            <div class="text-xs font-extrabold tracking-wide mb-2" style="color: var(--md-text-muted);">背景音</div>
            <div id="ambient-group" class="flex items-stretch gap-1.5 h-11">
              <button type="button" data-ambient="rain"
                      class="ambient-chip m3-Interactive font-bold text-xs sm:text-sm flex items-center justify-center border"
                      style="flex: 1 1 0%; border-radius: 14px; background-color: var(--md-surface); color: var(--md-text-main); border-color: var(--md-outline);">
                <span>雨天</span>
              </button>
              <button type="button" data-ambient="fireplace"
                      class="ambient-chip m3-Interactive font-bold text-xs sm:text-sm flex items-center justify-center border"
                      style="flex: 1 1 0%; border-radius: 14px; background-color: var(--md-surface); color: var(--md-text-main); border-color: var(--md-outline);">
                <span>壁炉</span>
              </button>
              <button type="button" data-ambient="waves"
                      class="ambient-chip m3-Interactive font-bold text-xs sm:text-sm flex items-center justify-center border"
                      style="flex: 1 1 0%; border-radius: 14px; background-color: var(--md-surface); color: var(--md-text-main); border-color: var(--md-outline);">
                <span>海浪</span>
              </button>
              <button type="button" data-ambient="forest"
                      class="ambient-chip m3-Interactive font-bold text-xs sm:text-sm flex items-center justify-center border"
                      style="flex: 1 1 0%; border-radius: 14px; background-color: var(--md-surface); color: var(--md-text-main); border-color: var(--md-outline);">
                <span>森林</span>
              </button>
            </div>
          </div>

          <!-- LAYER 3: Pixel 手机同款音量调 -->
          <div>
            <div class="flex items-center justify-between text-xs font-extrabold tracking-wide mb-2" style="color: var(--md-text-muted);">
              <span>音量</span>
              <span id="pixel-volume-label" class="clock-digits">75%</span>
            </div>
            <div id="pixel-volume-slider"
                 role="slider"
                 aria-valuemin="0"
                 aria-valuemax="100"
                 aria-valuenow="75"
                 tabindex="0"
                 class="relative w-full h-11 rounded-[22px] overflow-hidden cursor-pointer select-none touch-none flex items-center"
                 style="background-color: var(--md-surface-high);">
              <div id="pixel-volume-fill"
                   class="h-full rounded-[22px] flex items-center justify-between px-3.5 pointer-events-none"
                   style="width: 75%; min-width: 44px; background-color: var(--md-primary); color: var(--md-on-primary);">
                <svg id="pixel-volume-icon" class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
                <span class="w-1.5 h-5 rounded-full bg-current opacity-85"></span>
              </div>
            </div>
          </div>

        </div>

        <!-- MAIN 3-SLOT CONTROL BAR -->
        <div id="control-bar" class="flex items-stretch gap-3 sm:gap-4 h-16 sm:h-[68px] w-full">

          <!-- LEFT SLOT: 「音乐」按钮 -->
          <button id="music-btn" type="button"
                  class="m3-Interactive h-full px-4 flex items-center justify-center gap-2 shadow-sm border font-bold text-base sm:text-lg"
                  style="flex: 1 1 0%; border-radius: 34px; background-color: var(--md-secondary-container); color: var(--md-on-secondary-container); border-color: var(--md-outline);">
            <svg class="w-5 h-5 shrink-0 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
            <span class="whitespace-nowrap">音乐</span>
            <div id="music-eq" class="hidden items-end gap-0.5 h-4 ml-0.5 pointer-events-none">
              <span class="eq-1 w-0.5 bg-current rounded-full h-2"></span>
              <span class="eq-2 w-0.5 bg-current rounded-full h-3"></span>
              <span class="eq-3 w-0.5 bg-current rounded-full h-1.5"></span>
            </div>
          </button>

          <!-- CENTER SLOT: 「开始」按钮 -->
          <button id="start-btn" type="button"
                  class="m3-Interactive h-full px-4 flex items-center justify-center gap-2 shadow-md font-extrabold text-base sm:text-lg tracking-wide"
                  style="flex: 1 1 0%; border-radius: 34px; background-color: var(--md-primary); color: var(--md-on-primary);">
            <svg id="start-btn-icon" class="w-5 h-5 shrink-0 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="6 3 20 12 6 21 6 3" fill="currentColor"></polygon>
            </svg>
            <span id="start-btn-label" class="whitespace-nowrap">开始</span>
          </button>

          <!-- RIGHT SLOT: 「重置」 + 「任务」 -->
          <div id="right-split-slot" class="h-full flex items-stretch gap-1.5" style="flex: 1 1 0%;">
            <button id="reset-btn" type="button"
                    class="m3-Interactive h-full px-2 flex items-center justify-center gap-1 shadow-sm border font-bold text-sm sm:text-base whitespace-nowrap"
                    style="flex: 1 1 0%; border-radius: 28px 14px 14px 28px; background-color: var(--md-surface); color: var(--md-text-main); border-color: var(--md-outline);">
              <svg class="w-4 h-4 shrink-0 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
              </svg>
              <span class="whitespace-nowrap">重置</span>
            </button>

            <button id="add-task-top-btn" type="button"
                    class="m3-Interactive h-full px-2 flex items-center justify-center gap-1 shadow-sm border font-bold text-sm sm:text-base whitespace-nowrap"
                    style="flex: 1 1 0%; border-radius: 14px 28px 28px 14px; background-color: var(--md-tertiary-container); color: var(--md-on-tertiary-container); border-color: var(--md-outline);">
              <svg class="w-4 h-4 shrink-0 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
              <span class="whitespace-nowrap">任务</span>
            </button>
          </div>

        </div>
      </div>

    </section>

    <!-- ======================================================================= -->
    <!-- RIGHT SCREEN (6 cols): SECONDARY AREA (「今日任务」 & 「专注概览」)      -->
    <!-- ======================================================================= -->
    <section class="lg:col-span-6 h-full flex flex-col justify-center gap-5 min-h-0 py-2">

      <!-- MODULE 1: 「今日任务」模块 -->
      <div id="today-tasks-section"
           class="rounded-[36px] p-6 sm:p-7 border flex flex-col max-h-[44vh] min-h-[210px]"
           style="background-color: var(--md-surface-card); border-color: var(--md-outline); box-shadow: 0 14px 32px -12px var(--md-shadow);">
        <div class="flex items-center gap-2.5 mb-3 shrink-0">
          <span class="w-3 h-7 rounded-full m3-SurfaceTransition" style="background-color: var(--md-primary);"></span>
          <h2 class="text-xl sm:text-2xl font-extrabold tracking-tight">今日任务</h2>
        </div>

        <div id="task-list-container" class="divide-y overflow-y-auto pr-1 flex-1" style="border-color: var(--md-outline);">
          <!-- Populated dynamically via JS -->
        </div>
      </div>

      <!-- MODULE 2: 「专注概览」模块 -->
      <div id="focus-overview-section"
           class="rounded-[36px] p-6 sm:p-7 border shrink-0"
           style="background-color: var(--md-surface-card); border-color: var(--md-outline); box-shadow: 0 14px 32px -12px var(--md-shadow);">
        <div class="flex items-center gap-2.5 mb-5">
          <span class="w-3 h-7 rounded-full m3-SurfaceTransition" style="background-color: var(--md-primary);"></span>
          <h2 class="text-xl sm:text-2xl font-extrabold tracking-tight">专注概览</h2>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

          <!-- Card 1: 专注次数 -->
          <div id="overview-card-sessions"
               class="p-5 rounded-[28px] flex flex-col justify-between relative overflow-hidden m3-Interactive"
               style="background-color: var(--md-primary-container); color: var(--md-on-primary-container);">
            <div class="flex items-center justify-between gap-2">
              <span class="text-lg sm:text-xl font-extrabold tracking-tight">专注次数</span>
              <div class="w-9 h-9 rounded-2xl flex items-center justify-center bg-white/35 shrink-0">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2v4"></path>
                  <path d="M12 18v4"></path>
                  <path d="M4.93 4.93l2.83 2.83"></path>
                  <path d="M16.24 16.24l2.83 2.83"></path>
                  <path d="M2 12h4"></path>
                  <path d="M18 12h4"></path>
                  <circle cx="12" cy="12" r="4"></circle>
                </svg>
              </div>
            </div>
            <div class="mt-4 flex items-baseline gap-1.5">
              <span id="stat-completed-sessions" class="clock-digits text-4xl sm:text-5xl font-extrabold">0</span>
              <span class="text-sm font-extrabold opacity-85">次</span>
            </div>
          </div>

          <!-- Card 2: 专注时长 -->
          <div id="overview-card-minutes"
               class="p-5 rounded-[28px] flex flex-col justify-between relative overflow-hidden m3-Interactive"
               style="background-color: var(--md-secondary-container); color: var(--md-on-secondary-container);">
            <div class="flex items-center justify-between gap-2">
              <span class="text-lg sm:text-xl font-extrabold tracking-tight">专注时长</span>
              <div class="w-9 h-9 rounded-2xl flex items-center justify-center bg-white/35 shrink-0">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
              </div>
            </div>
            <div class="mt-4 flex items-baseline gap-1.5">
              <span id="stat-focus-minutes" class="clock-digits text-4xl sm:text-5xl font-extrabold">0</span>
              <span class="text-sm font-extrabold opacity-85">分钟</span>
            </div>
          </div>

          <!-- Card 3: 完成任务 -->
          <div id="overview-card-tasks"
               class="p-5 rounded-[28px] flex flex-col justify-between relative overflow-hidden m3-Interactive"
               style="background-color: var(--md-tertiary-container); color: var(--md-on-tertiary-container);">
            <div class="flex items-center justify-between gap-2">
              <span class="text-lg sm:text-xl font-extrabold tracking-tight">完成任务</span>
              <div class="w-9 h-9 rounded-2xl flex items-center justify-center bg-white/35 shrink-0">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
              </div>
            </div>
            <div class="mt-4 flex items-baseline gap-1.5">
              <span id="stat-completed-tasks" class="clock-digits text-4xl sm:text-5xl font-extrabold">0</span>
              <span class="text-sm font-extrabold opacity-85">次</span>
            </div>
          </div>

        </div>
      </div>

    </section>

  </main>

  <!-- ========================================================================= -->
  <!-- MODAL 1: 自定义「专注」时间弹窗                                             -->
  <!-- ========================================================================= -->
  <div id="custom-duration-modal"
       class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div id="custom-duration-dialog"
         class="w-full max-w-sm rounded-[32px] p-6 shadow-2xl border"
         style="background-color: var(--md-surface-card); border-color: var(--md-outline);">
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-xl font-extrabold">自定义时间</h3>
        <button id="close-duration-modal" type="button"
                class="w-9 h-9 rounded-2xl flex items-center justify-center m3-Interactive"
                style="background-color: var(--md-surface); color: var(--md-text-main);">
          ✕
        </button>
      </div>

      <div id="duration-preset-group" class="flex items-stretch gap-2 mb-5 h-11">
        <button type="button" data-preset-min="25"
                class="duration-preset-btn text-sm font-bold border m3-Interactive flex items-center justify-center"
                style="flex: 1 1 0%; border-radius: 16px; background-color: var(--md-primary-container); color: var(--md-on-primary-container); border-color: var(--md-outline);">
          25
        </button>
        <button type="button" data-preset-min="35"
                class="duration-preset-btn text-sm font-bold border m3-Interactive flex items-center justify-center"
                style="flex: 1 1 0%; border-radius: 16px; background-color: var(--md-surface); color: var(--md-text-main); border-color: var(--md-outline);">
          35
        </button>
        <button type="button" data-preset-min="45"
                class="duration-preset-btn text-sm font-bold border m3-Interactive flex items-center justify-center"
                style="flex: 1 1 0%; border-radius: 16px; background-color: var(--md-surface); color: var(--md-text-main); border-color: var(--md-outline);">
          45
        </button>
        <button type="button" data-preset-min="60"
                class="duration-preset-btn text-sm font-bold border m3-Interactive flex items-center justify-center"
                style="flex: 1 1 0%; border-radius: 16px; background-color: var(--md-surface); color: var(--md-text-main); border-color: var(--md-outline);">
          60
        </button>
      </div>

      <div class="mb-6">
        <label for="custom-focus-input" class="block text-xs font-bold mb-1.5" style="color: var(--md-text-muted);">
          自定义分钟数
        </label>
        <input id="custom-focus-input" type="number" min="1" max="180" value="25"
               class="m3-Input w-full px-4 py-3 rounded-2xl text-lg font-extrabold border focus:outline-none"
               style="background-color: var(--md-bg); border-color: var(--md-outline); color: var(--md-text-main);" />
      </div>

      <div class="flex items-center justify-end gap-2.5">
        <button id="cancel-duration-btn" type="button"
                class="px-5 py-2.5 rounded-2xl text-xs font-bold m3-Interactive"
                style="background-color: var(--md-surface); color: var(--md-text-muted);">
          取消
        </button>
        <button id="save-duration-btn" type="button"
                class="px-6 py-2.5 rounded-2xl text-xs font-bold shadow-sm m3-Interactive"
                style="background-color: var(--md-primary); color: var(--md-on-primary);">
          确定
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- MODAL 2: 单击「任务」按钮弹出的添加任务弹窗                                 -->
  <!-- ========================================================================= -->
  <div id="add-task-modal"
       class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div id="add-task-dialog"
         class="w-full max-w-md rounded-[32px] p-6 shadow-2xl border"
         style="background-color: var(--md-surface-card); border-color: var(--md-outline);">
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-xl font-extrabold">添加任务</h3>
        <button id="close-task-modal" type="button"
                class="w-9 h-9 rounded-2xl flex items-center justify-center m3-Interactive"
                style="background-color: var(--md-surface); color: var(--md-text-main);">
          ✕
        </button>
      </div>

      <form id="modal-task-form" class="space-y-4">
        <div>
          <label for="modal-task-title" class="block text-xs font-bold mb-1.5" style="color: var(--md-text-muted);">
            任务名称
          </label>
          <input id="modal-task-title" type="text" required
                 class="m3-Input w-full px-4 py-3 rounded-2xl text-sm font-semibold border focus:outline-none"
                 style="background-color: var(--md-bg); border-color: var(--md-outline); color: var(--md-text-main);" />
        </div>

        <div>
          <label for="modal-task-focused" class="block text-xs font-bold mb-1.5" style="color: var(--md-text-muted);">
            专注时间 (分钟)
          </label>
          <input id="modal-task-focused" type="number" min="5" max="600" step="5" value="25"
                 class="m3-Input w-full px-4 py-2.5 rounded-2xl text-sm font-bold border focus:outline-none"
                 style="background-color: var(--md-bg); border-color: var(--md-outline); color: var(--md-text-main);" />
        </div>

        <div class="flex items-center justify-end gap-2.5 pt-2">
          <button id="cancel-task-modal-btn" type="button"
                  class="px-5 py-2.5 rounded-2xl text-xs font-bold m3-Interactive"
                  style="background-color: var(--md-surface); color: var(--md-text-muted);">
            取消
          </button>
          <button id="submit-task-modal-btn" type="submit"
                  class="px-6 py-2.5 rounded-2xl text-xs font-bold shadow-sm m3-Interactive"
                  style="background-color: var(--md-primary); color: var(--md-on-primary);">
            添加
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- MODAL 3: 番茄钟运行切换 / 重置 / 劳逸结合提醒弹窗 (主题色自适应)            -->
  <!-- ========================================================================= -->
  <div id="reminder-confirm-modal"
       role="dialog"
       aria-modal="true"
       aria-labelledby="reminder-modal-title"
       aria-describedby="reminder-modal-desc"
       class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div id="reminder-confirm-dialog"
         class="w-full max-w-sm rounded-[32px] p-6 shadow-2xl border"
         style="background-color: var(--md-surface-card); border-color: var(--md-outline); color: var(--md-text-main); box-shadow: 0 20px 44px -12px var(--md-shadow);">
      <div class="flex items-start justify-between gap-3 mb-3">
        <div class="flex items-center gap-3">
