    };

    // Preload & Pre-Decode Google Sound Library files in the background during idle frames (#2):
    // Eliminates synchronous 18x `new Audio()` creation and `decodeAudioData()` main-thread spikes
    // when clicking ambient buttons, so the Station wavy progress bar NEVER stutters!
    const preloadedGoogleSounds = new Map();
    const decodedAmbientBufferCache = new Map();
    const pendingAmbientDecodePromises = new Map();

    const PREAMP_BOOST_MAP = {
      rain: [
        { url: 'https://actions.google.com/sounds/v1/weather/light_rain.ogg', boost: 1.35, offset: 0.0 },
        { url: 'https://actions.google.com/sounds/v1/weather/light_rain.ogg', boost: 1.05, offset: 4.5 },
        { url: 'https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg', boost: 0.25, offset: 1.8 }
      ],
      fireplace: [
        { url: 'https://actions.google.com/sounds/v1/ambiences/fire.ogg', boost: 8.5, offset: 0.0 },
        { url: 'https://actions.google.com/sounds/v1/ambiences/fire.ogg', boost: 7.5, offset: 3.5 },
        { url: 'https://actions.google.com/sounds/v1/household/wind_drawn_into_fire.ogg', boost: 4.5, offset: 1.2 }
      ],
      waves: [
        { url: 'https://actions.google.com/sounds/v1/water/waves_crashing_on_rock_beach.ogg', boost: 2.6, offset: 0.0 },
        { url: 'https://actions.google.com/sounds/v1/water/water_lapping_wind.ogg', boost: 4.2, offset: 1.5 }
      ],
      forest: [
        { url: 'https://actions.google.com/sounds/v1/animals/june_songbirds.ogg', boost: 7.5, offset: 0.0 },
        { url: 'https://actions.google.com/sounds/v1/water/small_stream_flowing.ogg', boost: 4.5, offset: 1.2 },
        { url: 'https://actions.google.com/sounds/v1/weather/wind_in_leaves_on_porch.ogg', boost: 5.5, offset: 2.4 },
        { url: 'https://actions.google.com/sounds/v1/ambiences/spring_day_forest.ogg', boost: 9.5, offset: 0.5 }
      ]
    };

    function fetchAndDecodeAmbientUrl(url) {
      if (decodedAmbientBufferCache.has(url)) {
        return Promise.resolve(decodedAmbientBufferCache.get(url));
      }
      if (pendingAmbientDecodePromises.has(url)) {
        return pendingAmbientDecodePromises.get(url);
      }
      const p = fetch(url)
        .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
        .then(buf => {
          ensureAudioCtx();
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          const ctxToUse = audioCtx || (AudioContextClass ? new AudioContextClass() : null);
          if (!ctxToUse) return null;
          return ctxToUse.decodeAudioData(buf);
        })
        .then(decoded => {
          if (decoded) decodedAmbientBufferCache.set(url, decoded);
          return decoded;
        })
        .catch(() => null)
        .finally(() => {
          pendingAmbientDecodePromises.delete(url);
        });
      pendingAmbientDecodePromises.set(url, p);
      return p;
    }

    function preloadGoogleSoundLibrary() {
      const uniqueUrls = new Set();
      Object.values(BUILTIN_GOOGLE_AMBIENT_LIBRARY).forEach(group => {
        group.voices.forEach(v => uniqueUrls.add(v.url));
      });
      let delayMs = 80;
      uniqueUrls.forEach(url => {
        setTimeout(() => {
          if (!preloadedGoogleSounds.has(url)) {
            const a = new Audio();
            a.preload = 'auto';
            a.src = url;
            preloadedGoogleSounds.set(url, a);
          }
          fetchAndDecodeAmbientUrl(url);
        }, delayMs);
        delayMs += 180;
      });
    }
    setTimeout(preloadGoogleSoundLibrary, 250);

    const ambientPlayers = {};

    function startAmbientSound(type) {
      if (ambientPlayers[type]) return;
      const spec = BUILTIN_GOOGLE_AMBIENT_LIBRARY[type];
      if (!spec) return;

      let stopped = false;
      const activeElements = [];
      const webAudioNodes = [];
      const staggerTimers = [];

      function attachDecodedVoiceNode(decoded, gainBoost, rate, offsetSec) {
        if (!decoded || stopped) return;
        ensureAudioCtx();
        if (!audioCtx) return;
        const srcNode = audioCtx.createBufferSource();
        const gainNode = audioCtx.createGain();
        srcNode.buffer = decoded;
        srcNode.loop = true;
        srcNode.playbackRate.value = rate || 1.0;
        const startOffset = (offsetSec || 0) % Math.max(0.5, decoded.duration - 0.2);
        srcNode.loopStart = Math.min(0.15, decoded.duration * 0.05);
        srcNode.loopEnd = Math.max(srcNode.loopStart + 0.4, decoded.duration - 0.15);
        gainNode.gain.value = state.masterVolume * gainBoost;
        srcNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        srcNode.start(0, startOffset);
        webAudioNodes.push({ srcNode, gainNode, boost: gainBoost });
      }

      // 1. Start Pre-Amp Boosted Web Audio voices (zero-stutter instant buffer playback if cached)
      if (PREAMP_BOOST_MAP[type]) {
        PREAMP_BOOST_MAP[type].forEach((item, idx) => {
          const cached = decodedAmbientBufferCache.get(item.url);
          if (cached) {
            attachDecodedVoiceNode(cached, item.boost, 1.0, item.offset || 0);
          } else {
            const tid = setTimeout(() => {
              if (!stopped) {
                fetchAndDecodeAmbientUrl(item.url).then(dec => {
                  attachDecodedVoiceNode(dec, item.boost, 1.0, item.offset || 0);
                });
              }
            }, idx * 16);
            staggerTimers.push(tid);
          }
        });
      }

      // 2. Stagger multi-voice texture layers across micro-frames (16ms apart) using Web Audio BufferSource
      //    when decoded (0 DOM overhead!), falling back to lightweight <audio> only if needed (#2)
      spec.voices.forEach((vCfg, idx) => {
        const tid = setTimeout(() => {
          if (stopped) return;
          const cachedBuf = decodedAmbientBufferCache.get(vCfg.url);
          if (cachedBuf) {
            attachDecodedVoiceNode(cachedBuf, vCfg.gain, vCfg.rate || 1.0, vCfg.startOffset || 0);
            return;
          }
          // Lightweight fallback <audio> while buffer finishes downloading
          const audio = new Audio(vCfg.url);
          audio.preload = 'auto';
          audio.loop = true;
          audio.playbackRate = vCfg.rate || 1.0;
          audio.preservesPitch = false;

          const voiceObj = { audio, cfg: vCfg, envelope: 1.0 };
          activeElements.push(voiceObj);

          audio.addEventListener('loadedmetadata', () => {
            if (stopped) return;
            const dur = audio.duration;
            if (dur && isFinite(dur) && dur > 1) {
              const maxEnd = vCfg.activeEnd ? Math.min(dur - 0.1, vCfg.activeEnd) : (dur - 0.2);
              const targetStart = (vCfg.startOffset || 0) % Math.max(0.5, maxEnd);
              try {
                audio.currentTime = Math.max(vCfg.activeStart || 0, targetStart);
              } catch (e) {}
              if (!stopped && audio.paused) {
                audio.play().catch(() => {});
              }
            }
          }, { once: true });

          audio.volume = Math.min(1, Math.max(0, state.masterVolume * vCfg.gain));
          audio.play().catch(() => {});
        }, idx * 14);
        staggerTimers.push(tid);
      });

      // Seamless Active-Window & Boundary Crossfade Loop Monitor (runs every 60ms)
      // Prevents dead silent tails (e.g. in wind_chimes_of_shells.ogg) and smooths loop boundaries
      // so the user can NEVER tell a clip is looping (#2)
      const loopWatchTimer = setInterval(() => {
        if (stopped) return;
        activeElements.forEach(v => {
          const { audio, cfg } = v;
          if (audio.paused) return;
          const dur = audio.duration;
          if (!dur || !isFinite(dur) || dur <= 0.5) return;

          const startBound = cfg.activeStart || 0.08;
          const endBound = cfg.activeEnd ? Math.min(dur - 0.12, cfg.activeEnd) : (dur - 0.25);
          const span = Math.max(0.6, endBound - startBound);
          const cur = audio.currentTime;

          // Smooth cosine fade window near loop boundaries so wrapping back to startBound is 100% click-free
          const fadeWindow = Math.min(0.45, span * 0.22);
          let env = 1.0;
          if (cur < startBound + fadeWindow) {
            const p = Math.max(0, (cur - startBound) / fadeWindow);
            env = 0.35 + 0.65 * Math.sin(p * Math.PI * 0.5);
          } else if (cur > endBound - fadeWindow) {
            const p = Math.max(0, (endBound - cur) / fadeWindow);
            env = 0.35 + 0.65 * Math.sin(p * Math.PI * 0.5);
          }
          v.envelope = env;
          audio.volume = Math.min(1, Math.max(0, state.masterVolume * cfg.gain * env));

          if (cur >= endBound) {
            try {
              audio.currentTime = startBound + Math.random() * 0.12;
            } catch (e) {}
          }
        });
      }, 60);

      ambientPlayers[type] = {
        updateVolume(masterV) {
          activeElements.forEach(v => {
            v.audio.volume = Math.min(1, Math.max(0, masterV * v.cfg.gain * v.envelope));
          });
          webAudioNodes.forEach(n => {
            try { n.gainNode.gain.value = masterV * n.boost; } catch (e) {}
          });
        },
        resume() {
          ensureAudioCtx();
          activeElements.forEach(v => {
            if (!stopped && v.audio.paused) {
              v.audio.play().catch(() => {});
            }
          });
        },
        stop() {
          stopped = true;
          staggerTimers.forEach(t => clearTimeout(t));
          clearInterval(loopWatchTimer);
          activeElements.forEach(v => {
            try {
              v.audio.pause();
              v.audio.src = '';
            } catch (e) {}
          });
          webAudioNodes.forEach(n => {
            try {
              n.srcNode.stop();
              n.srcNode.disconnect();
              n.gainNode.disconnect();
            } catch (e) {}
          });
        }
      };
    }

    function stopAmbientSound(type) {
      if (ambientPlayers[type]) {
        ambientPlayers[type].stop();
        delete ambientPlayers[type];
      }
    }

    function toggleAmbientOption(type) {
      if (state.activeAmbients.has(type)) {
        state.activeAmbients.delete(type);
        stopAmbientSound(type);
      } else {
        state.activeAmbients.add(type);
        startAmbientSound(type);
      }
      syncMusicUIState();
      updateAmbientGroupSprings(null, null);
    }

    function syncMusicUIState() {
      const anyAudioActive = state.stationPlaying || state.activeAmbients.size > 0;
      if (anyAudioActive) {
        musicBtn.style.backgroundColor = 'var(--md-primary-container)';
        musicBtn.style.color = 'var(--md-on-primary-container)';
        musicEq.classList.remove('hidden');
        musicEq.classList.add('flex', 'eq-playing');
      } else {
        musicBtn.style.backgroundColor = 'var(--md-secondary-container)';
        musicBtn.style.color = 'var(--md-on-secondary-container)';
        musicEq.classList.add('hidden');
        musicEq.classList.remove('flex', 'eq-playing');
      }

      if (state.stationPlaying) {
        stationPlayIcon.innerHTML = `
          <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"></rect>
        `;
      } else {
        stationPlayIcon.innerHTML = `<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"></polygon>`;
      }
      updateStationControlsSprings();

      ambientBtns.forEach(btn => {
        const key = btn.getAttribute('data-ambient');
        if (state.activeAmbients.has(key)) {
          btn.style.backgroundColor = 'var(--md-primary)';
          btn.style.color = 'var(--md-on-primary)';
          btn.style.borderColor = 'var(--md-primary)';
        } else {
          btn.style.backgroundColor = 'var(--md-surface)';
          btn.style.color = 'var(--md-text-main)';
          btn.style.borderColor = 'var(--md-outline)';
        }
      });

      updateControlRowSprings();
      wakeSpringLoop();
    }

    // =========================================================================
    // 7. M3 EXPRESSIVE WAVY PROGRESS BAR (60FPS SYNC + SEEK + CROSSFADE)
    // =========================================================================
    const wavyCtx = wavyProgressCanvas.getContext('2d');
    let isSeekingWavy = false;
    let cachedWavyWidth = 0;
    let cachedWavyHeight = 0;
    let lastWavyFramePerf = performance.now();

    function resizeWavyCanvas() {
      const rect = wavyProgressContainer.getBoundingClientRect();
      if (rect.width === 0) return;
      cachedWavyWidth = rect.width;
      cachedWavyHeight = rect.height;
      const dpr = window.devicePixelRatio || 1;
      wavyProgressCanvas.width = Math.round(rect.width * dpr);
      wavyProgressCanvas.height = Math.round(rect.height * dpr);
      wavyCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeWavyCanvas);

    function animateWavyProgress() {
      const nowPerf = performance.now();
      let dt = (nowPerf - lastWavyFramePerf) / 1000;
      lastWavyFramePerf = nowPerf;
      if (dt <= 0 || dt > 0.1) dt = 0.016;

      // 1. Step crossfade & sync playback progress
      stepBackgroundSafeCrossfade();
      syncStationProgressFromActiveDeck();

      // 2. Render M3 Expressive Wavy Progress Bar using cached dimensions (ZERO layout reflow when clicking ambient chips #2)
      if (state.musicPopoverOpen) {
        if (cachedWavyWidth === 0 || cachedWavyHeight === 0) {
          resizeWavyCanvas();
        }
        const w = cachedWavyWidth;
        const h = cachedWavyHeight;
        if (w > 0 && h > 0) {
          wavyCtx.clearRect(0, 0, w, h);

          const realPlaying = isStationAudioActuallyOutputting();
          const targetAmp = realPlaying ? 4.2 : 0;
          state.wavyAmp += (targetAmp - state.wavyAmp) * Math.min(1, dt * 10);
          if (realPlaying) {
            state.wavyPhase += dt * 6.2;
          }

          const tokens = getThemeTokens();
          const primaryColor = tokens.primary;
          const trackColor = tokens.track;

          const padX = 4;
          const usableW = w - padX * 2;
          const midY = h / 2;
          const clampedProg = Math.max(0, Math.min(1, state.stationProgress));
          const splitX = padX + usableW * clampedProg;

          wavyProgressContainer.setAttribute('aria-valuenow', String(Math.round(clampedProg * 100)));

          // Unplayed Flat Track (only draw when thumb hasn't reached the right end)
          if (splitX + 5 < w - padX) {
            wavyCtx.strokeStyle = trackColor;
            wavyCtx.lineWidth = 4;
            wavyCtx.lineCap = 'round';
            wavyCtx.beginPath();
            wavyCtx.moveTo(splitX + 5, midY);
            wavyCtx.lineTo(w - padX, midY);
            wavyCtx.stroke();
          }

          // Played M3 Expressive Sinusoidal Wave
          if (splitX > padX) {
            wavyCtx.strokeStyle = primaryColor;
            wavyCtx.lineWidth = 4;
            wavyCtx.lineCap = 'round';
            wavyCtx.beginPath();
            for (let x = padX; x <= splitX; x += 2) {
              const y = midY + Math.sin((x - padX) * 0.22 - state.wavyPhase) * state.wavyAmp;
              if (x === padX) wavyCtx.moveTo(x, y);
              else wavyCtx.lineTo(x, y);
            }
            wavyCtx.stroke();
          }

          // Expressive Squircle Thumb Indicator
          wavyCtx.fillStyle = primaryColor;
          const thumbW = isSeekingWavy ? 9 : 6;
          const thumbH = isSeekingWavy ? 22 : 16;
          wavyCtx.beginPath();
          wavyCtx.roundRect(splitX - thumbW / 2, midY - thumbH / 2, thumbW, thumbH, 4);
          wavyCtx.fill();
        }
      }
      requestAnimationFrame(animateWavyProgress);
    }
    requestAnimationFrame(animateWavyProgress);

    function updateVisualSeekFromPointer(e) {
      cancelTrackEndGlide();
      const rect = wavyProgressContainer.getBoundingClientRect();
      if (rect.width <= 0) return state.stationProgress;
      const padX = 4;
      const usableW = Math.max(1, rect.width - padX * 2);
      const rel = Math.max(0, Math.min(1, (e.clientX - rect.left - padX) / usableW));
      state.stationProgress = rel;
      return rel;
    }

    let endOfTrackHoldTimer = null;
    function commitSeekToActiveDeck(rel) {
      if (endOfTrackHoldTimer) {
        clearTimeout(endOfTrackHoldTimer);
        endOfTrackHoldTimer = null;
      }
      const clampedRel = Math.max(0, Math.min(1, rel));
      state.stationProgress = clampedRel;
      seekLockUntil = performance.now() + 850;
      const dur = getEffectiveTrackDuration(activeDeck);

      // Allow user to pull the progress bar all the way to the very end (100%):
      // Hold at 100% briefly so the full wave is visible, then advance cleanly if playing.
      if (clampedRel >= 0.995) {
        state.stationProgress = 1;
        if (state.stationPlaying) {
          try { activeDeck.pause(); } catch (e) {}
          endOfTrackHoldTimer = setTimeout(() => {
            endOfTrackHoldTimer = null;
            if (state.stationPlaying && !isSeekingWavy) {
              transitionToTrack(pickRandomNextTrackIndex());
            }
          }, 450);
        } else if (dur && isFinite(dur) && dur > 1) {
          try { activeDeck.currentTime = dur; } catch (e) {}
          pendingSeekRatio = 1;
        } else {
          pendingSeekRatio = 1;
        }
        return;
      }

      if (dur && isFinite(dur) && dur > 1) {
        try {
          activeDeck.currentTime = clampedRel * dur;
          pendingSeekRatio = null;
          if (state.stationPlaying && activeDeck.paused) {
            activeDeck.play().catch(() => {});
          }
        } catch (err) {
          pendingSeekRatio = clampedRel;
        }
      } else {
        pendingSeekRatio = clampedRel;
      }
    }

    wavyProgressContainer.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      isSeekingWavy = true;
      wavyProgressContainer.setPointerCapture(e.pointerId);
      updateVisualSeekFromPointer(e);
    });

    wavyProgressContainer.addEventListener('pointermove', (e) => {
      if (!isSeekingWavy) return;
      if (e.pointerType === 'mouse' && e.buttons !== 1) {
        isSeekingWavy = false;
        commitSeekToActiveDeck(state.stationProgress);
        return;
      }
      updateVisualSeekFromPointer(e);
    });

    function finishWavySeek() {
      if (!isSeekingWavy) return;
      isSeekingWavy = false;
      commitSeekToActiveDeck(state.stationProgress);
    }
    wavyProgressContainer.addEventListener('pointerup', finishWavySeek);
    wavyProgressContainer.addEventListener('pointercancel', finishWavySeek);

    // =========================================================================
    // 8. PIXEL VOLUME SLIDER (Simultaneously Controls Station & Ambient Volume)
    // =========================================================================
    let isDraggingVolume = false;

    function setMasterVolume(val) {
      const clamped = Math.max(0, Math.min(1, val));
      state.masterVolume = clamped;
      const pct = Math.round(clamped * 100);
      pixelVolumeLabel.textContent = `${pct}%`;
      pixelVolumeSlider.setAttribute('aria-valuenow', String(pct));
      pixelVolumeFill.style.width = `${Math.max(14, pct)}%`;

      if (pct === 0) {
        pixelVolumeIcon.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        `;
      } else if (pct < 50) {
        pixelVolumeIcon.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        `;
      } else {
        pixelVolumeIcon.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        `;
      }

      activeDeck.volume = computeDeckVolume(activeDeck, clamped, activeDeckFadeMultiplier);
      if (isCrossfading && !inactiveDeck.paused) {
        inactiveDeck.volume = computeDeckVolume(inactiveDeck, clamped, inactiveDeckFadeMultiplier);
      }
      Object.values(ambientPlayers).forEach(player => {
        player.updateVolume(clamped);
      });
    }

    function updateVolumeFromPointer(e) {
      const rect = pixelVolumeSlider.getBoundingClientRect();
      if (rect.width <= 0) return;
      const rel = (e.clientX - rect.left) / rect.width;
      setMasterVolume(rel);
    }

    pixelVolumeSlider.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      isDraggingVolume = true;
      pixelVolumeSlider.setPointerCapture(e.pointerId);
      updateVolumeFromPointer(e);
    });

    pixelVolumeSlider.addEventListener('pointermove', (e) => {
      if (!isDraggingVolume) return;
      if (e.pointerType === 'mouse' && e.buttons !== 1) {
        isDraggingVolume = false;
        return;
      }
      updateVolumeFromPointer(e);
    });

    function stopVolumeDrag() {
      isDraggingVolume = false;
    }
    pixelVolumeSlider.addEventListener('pointerup', stopVolumeDrag);
    pixelVolumeSlider.addEventListener('pointercancel', stopVolumeDrag);
    window.addEventListener('pointerup', () => {
      isDraggingVolume = false;
      if (isSeekingWavy) {
        isSeekingWavy = false;
        commitSeekToActiveDeck(state.stationProgress);
      }
    });

    // Floating Music Card Open/Close Logic
    registerSpringElement(musicPopoverCard, {
      radii: [32, 32, 32, 32],
      autoBind: false
    });

    function toggleMusicPopover() {
      state.musicPopoverOpen = !state.musicPopoverOpen;
      const cardSpring = springElements.get(musicPopoverCard);
      if (state.musicPopoverOpen) {
        musicPopoverCard.classList.remove('hidden');
        resizeWavyCanvas();
        if (cardSpring) {
          cardSpring.scaleX.current = 0.86;
          cardSpring.scaleY.current = 0.86;
          cardSpring.ty.current = 16;
          cardSpring.scaleX.setTarget(1, 0.04);
          cardSpring.scaleY.setTarget(1, 0.04);
          cardSpring.ty.setTarget(0);
          wakeSpringLoop();
        }
      } else {
        musicPopoverCard.classList.add('hidden');
      }
      syncMusicUIState();
    }

    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMusicPopover();
    });

    stationPlayPauseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleStationPlayPause();
    });

    stationNextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      transitionToTrack(pickRandomNextTrackIndex());
    });

    ambientBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleAmbientOption(btn.getAttribute('data-ambient'));
      });
    });

    document.addEventListener('pointerdown', (e) => {
      if (state.musicPopoverOpen && !musicPopoverCard.contains(e.target) && !musicBtn.contains(e.target)) {
        state.musicPopoverOpen = false;
        musicPopoverCard.classList.add('hidden');
        syncMusicUIState();
      }
    });

    // =========================================================================
    // 9. TIMER & PROGRESS RING LOGIC
    // =========================================================================
    function formatTime(totalSecs) {
      const mins = Math.floor(totalSecs / 60);
      const secs = totalSecs % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateClockUI() {
      timerDisplay.textContent = formatTime(state.timeLeftSeconds);

      const ratio = state.totalSecondsForSession > 0
        ? state.timeLeftSeconds / state.totalSecondsForSession
        : 0;
      const offset = RING_CIRCUMFERENCE * (1 - ratio);
      progressRing.style.strokeDasharray = `${RING_CIRCUMFERENCE}`;
      progressRing.style.strokeDashoffset = `${offset}`;

      if (state.isRunning) {
        startBtnLabel.textContent = '暂停';
        startBtnIcon.innerHTML = `
          <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"></rect>
        `;
      } else {
        const isStarted = state.timeLeftSeconds < state.totalSecondsForSession || (state.sessionElapsedMs || 0) > 0;
        startBtnLabel.textContent = isStarted ? '继续' : '开始';
        startBtnIcon.innerHTML = `<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"></polygon>`;
      }

      updateControlRowSprings();
    }

    // =========================================================================
    // REMINDER & CONFIRMATION MODAL CONTROLLER (Requirements #1 - #6)
    // =========================================================================
    let activeReminderConfirmCallback = null;
    let activeReminderCancelCallback = null;
    let wasRunningBeforeReminderModal = false;

    function resetRestReminderCycle() {
      state.restCycleStandardSessions = 0;
      state.restCycleFocusMinutes = 0;
      state.restCycleRemainderSeconds = 0;
      state.lastFocusActiveTimestamp = 0;
      state.restCyclePausedCarryExclusionSecs = 0;
      saveDailyDataToStorage();
    }

    function getElapsedFocusSecondsForAbandon() {
      const totalElapsedMs = (state.sessionElapsedMs || 0) +
        (state.isRunning && state.lastTickStartMs ? Math.max(0, Date.now() - state.lastTickStartMs) : 0);
      const preciseElapsedSecs = Math.floor(totalElapsedMs / 1000);
      const clockElapsedSecs = Math.max(0, state.totalSecondsForSession - state.timeLeftSeconds);
      const effectiveSecs = preciseElapsedSecs > 0 ? preciseElapsedSecs : clockElapsedSecs;
      return Math.max(0, Math.min(state.totalSecondsForSession, effectiveSecs));
    }

    function recordAbandonedFocusElapsedMinutes() {
      const nowTs = Date.now();
      // First check if prior streak expired due to >= 20 min inactivity gap
      checkAndExpireStaleRestCycle(nowTs);

      const elapsedSecs = getElapsedFocusSecondsForAbandon();
      if (elapsedSecs <= 0) return;

      // 1. Daily total focus duration in 「专注概览」 always retains all focused seconds today
      const totalFocusCarrySecs = (state.completedFocusRemainderSeconds || 0) + elapsedSecs;
      const addedWholeMinutes = Math.floor(totalFocusCarrySecs / 60);
      state.completedFocusRemainderSeconds = totalFocusCarrySecs % 60;
      if (addedWholeMinutes > 0) {
        state.completedFocusMinutes += addedWholeMinutes;
      }

      // 2. Rest-reminder cycle only accumulates continuous focus seconds (excluding any pre-break segment if user left >= 20m)
      const continuousElapsedSecs = Math.max(0, elapsedSecs - (state.restCyclePausedCarryExclusionSecs || 0));
      if (continuousElapsedSecs > 0) {
        const totalRestCarrySecs = (state.restCycleRemainderSeconds || 0) + continuousElapsedSecs;
        const addedRestMinutes = Math.floor(totalRestCarrySecs / 60);
        state.restCycleRemainderSeconds = totalRestCarrySecs % 60;
        if (addedRestMinutes > 0) {
          state.restCycleFocusMinutes += addedRestMinutes;
        }
        state.lastFocusActiveTimestamp = nowTs;
      }

      state.restCyclePausedCarryExclusionSecs = 0;
      saveDailyDataToStorage();
      renderTasksAndOverview(addedWholeMinutes > 0 ? 'minutesOnly' : null);
    }

    function setReminderModalIconByType(iconType) {
      if (!reminderModalIcon) return;
      if (iconType === 'celebrate') {
        reminderModalIcon.innerHTML = `
          <path d="M12 2v4"></path>
          <path d="M12 18v4"></path>
          <path d="M4.93 4.93l2.83 2.83"></path>
          <path d="M16.24 16.24l2.83 2.83"></path>
          <path d="M2 12h4"></path>
          <path d="M18 12h4"></path>
          <circle cx="12" cy="12" r="4"></circle>
        `;
      } else {
        reminderModalIcon.innerHTML = `
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        `;
      }
    }

    function openReminderModal({ title, desc, iconType = 'alert', pauseWhileOpen = true, onConfirm = null, onCancel = null }) {
      wasRunningBeforeReminderModal = Boolean(pauseWhileOpen && state.isRunning);
      if (wasRunningBeforeReminderModal) {
        pauseTimer();
      }
      reminderModalTitle.textContent = title;
      reminderModalDesc.textContent = desc;
      setReminderModalIconByType(iconType);

      activeReminderConfirmCallback = onConfirm;
      activeReminderCancelCallback = onCancel;

      reminderConfirmModal.classList.remove('hidden');
      reminderConfirmModal.classList.add('flex');
      lockBodyScroll();

      const dSpring = springElements.get(reminderConfirmDialog);
      if (dSpring) {
        dSpring.scaleX.current = 0.88;
        dSpring.scaleY.current = 0.88;
        dSpring.scaleX.setTarget(1, 0.04);
        dSpring.scaleY.setTarget(1, 0.04);
        wakeSpringLoop();
      }
      setTimeout(() => confirmReminderBtn.focus(), 40);
    }

    function hideReminderModal({ resumeIfCanceled = false } = {}) {
      reminderConfirmModal.classList.add('hidden');
      reminderConfirmModal.classList.remove('flex');
      unlockBodyScroll();

      const cancelCb = activeReminderCancelCallback;
      activeReminderConfirmCallback = null;
      activeReminderCancelCallback = null;

      if (resumeIfCanceled) {
        if (typeof cancelCb === 'function') {
          cancelCb();
        }
        if (wasRunningBeforeReminderModal && !state.isRunning) {
          startTimer();
        }
      }
      wasRunningBeforeReminderModal = false;
    }

    function isPomodoroSessionActive() {
      const totalMs = state.totalSecondsForSession * 1000;
      const hasRemainingProgress = typeof state.remainingMs === 'number' && state.remainingMs < totalMs;
      return state.isRunning || state.timeLeftSeconds < state.totalSecondsForSession || (state.sessionElapsedMs || 0) > 0 || hasRemainingProgress;
    }

    function switchMode(newMode) {
      if (state.isRunning) {
        pauseTimer();
      }
      state.mode = newMode;
      document.body.setAttribute('data-mode', newMode);

      const mins = state.durations[newMode];
      state.totalSecondsForSession = mins * 60;
      state.timeLeftSeconds = mins * 60;
      state.remainingMs = mins * 60 * 1000;
      state.timerEndTimestamp = null;
      state.sessionElapsedMs = 0;
      state.lastTickStartMs = null;
      state.restCyclePausedCarryExclusionSecs = 0;

      const modeButtons = [
        { key: 'focus', btn: modeFocusBtn },
        { key: 'shortBreak', btn: modeShortBtn },
        { key: 'longBreak', btn: modeLongBtn }
      ];
      modeButtons.forEach(({ key, btn }) => {
        if (key === newMode) {
          btn.style.backgroundColor = 'var(--md-primary)';
          btn.style.color = 'var(--md-on-primary)';
        } else {
          btn.style.backgroundColor = 'transparent';
          btn.style.color = 'var(--md-text-muted)';
        }
      });

      pencilEditDurationBtn.style.display = newMode === 'focus' ? 'flex' : 'none';

      updateModeGroupSprings(null, null);
      updateClockUI();
    }

    function requestModeSwitch(targetMode) {
      if (targetMode === state.mode) return;

      // Only show reminder modal when the Pomodoro timer is running / active
      if (!isPomodoroSessionActive()) {
        switchMode(targetMode);
        return;
      }

      const currentMode = state.mode;

      // 1. 从「专注」切换到「短歇」或「长歇」
      if (currentMode === 'focus' && (targetMode === 'shortBreak' || targetMode === 'longBreak')) {
        openReminderModal({
          title: '放弃本次专注？',
          desc: '本次番茄钟将不计为一次专注记录，但已累计的专注时长会保留。',
          iconType: 'alert',
          pauseWhileOpen: true,
          onConfirm: () => {
            recordAbandonedFocusElapsedMinutes();
            switchMode(targetMode);
          }
        });
        return;
      }

      // 2. 从「短歇」和「长歇」切换到「专注」
      if ((currentMode === 'shortBreak' || currentMode === 'longBreak') && targetMode === 'focus') {
        openReminderModal({
          title: '跳过本次休息？',
          desc: '开始下一轮专注。',
          iconType: 'alert',
          pauseWhileOpen: true,
          onConfirm: () => {
            if (currentMode === 'longBreak') {
              resetRestReminderCycle();
            }
            switchMode('focus');
          }
        });
        return;
      }

      // 3. 从「短歇」切换到「长歇」
      if (currentMode === 'shortBreak' && targetMode === 'longBreak') {
        openReminderModal({
          title: '更改休息时长？',
          desc: '多休息一会，恢复好状态再继续专注。',
          iconType: 'alert',
          pauseWhileOpen: true,
          onConfirm: () => {
            switchMode('longBreak');
          }
        });
        return;
      }

      // 4. 从「长歇」切换到「短歇」
      if (currentMode === 'longBreak' && targetMode === 'shortBreak') {
        openReminderModal({
          title: '更改休息时长？',
          desc: '稍作休息，调整好状态再继续专注。',
          iconType: 'alert',
          pauseWhileOpen: true,
          onConfirm: () => {
            resetRestReminderCycle();
            switchMode('shortBreak');
          }
        });
        return;
      }

      switchMode(targetMode);
    }

    function requestTimerReset() {
      if (!isPomodoroSessionActive()) {
        resetTimer();
        return;
      }

      const currentMode = state.mode;

      // 1. 在「专注」运行中点击「重置」
      if (currentMode === 'focus') {
        openReminderModal({
          title: '放弃本次专注？',
          desc: '本次番茄钟将不计为一次专注记录，但已累计的专注时长会保留。',
          iconType: 'alert',
          pauseWhileOpen: true,
          onConfirm: () => {
            recordAbandonedFocusElapsedMinutes();
            resetTimer();
          }
        });
        return;
      }

      // 2. 在「短歇」或「长歇」运行中点击「重置」
      if (currentMode === 'shortBreak' || currentMode === 'longBreak') {
        openReminderModal({
          title: '跳过本次休息？',
          desc: '开始下一轮专注。',
          iconType: 'alert',
          pauseWhileOpen: true,
          onConfirm: () => {
            if (currentMode === 'longBreak') {
              resetRestReminderCycle();
            }
            switchMode('focus');
          }
        });
        return;
      }

      resetTimer();
    }

    function syncTimerFromWallClock() {
      if (!state.isRunning || !state.timerEndTimestamp) return;
      const now = Date.now();
      if (state.mode === 'focus') {
        state.lastFocusActiveTimestamp = now;
      }
      const remainingMs = state.timerEndTimestamp - now;
      state.remainingMs = Math.max(0, remainingMs);
      if (remainingMs <= 0) {
        state.timeLeftSeconds = 0;
        state.remainingMs = 0;
        updateClockUI();
        handleSessionComplete();
      } else {
        const nextSecs = Math.min(
          state.timeLeftSeconds,
          Math.max(0, Math.floor(remainingMs / 1000))
        );
        if (nextSecs !== state.timeLeftSeconds) {
          state.timeLeftSeconds = nextSecs;
          updateClockUI();
        }
      }
    }

    function startTimer() {
      if (state.isRunning) return;
      const now = Date.now();
      // Before starting/resuming, check if the user has been away from focusing for >= 20 minutes.
      // If so, expire the previous rest-reminder streak so this session starts a fresh streak!
      checkAndExpireStaleRestCycle(now);

      state.isRunning = true;
      state.lastTickStartMs = now;
      if (state.mode === 'focus') {
        state.lastFocusActiveTimestamp = now;
        saveDailyDataToStorage();
      }
      const totalMs = state.totalSecondsForSession * 1000;
      const startRemMs = (typeof state.remainingMs === 'number' && state.remainingMs > 0 && state.remainingMs <= totalMs)
        ? state.remainingMs
        : (state.timeLeftSeconds * 1000);
      state.remainingMs = startRemMs;
      state.timerEndTimestamp = now + startRemMs;

      if (state.timeLeftSeconds === state.totalSecondsForSession && state.timeLeftSeconds > 0 && startRemMs >= totalMs - 50) {
        state.timeLeftSeconds = state.totalSecondsForSession - 1;
      }

      requestWakeLockAndKeepAlive();
      updateClockUI();

      if (state.timerInterval) clearInterval(state.timerInterval);
      state.timerInterval = setInterval(syncTimerFromWallClock, 100);
    }

    function pauseTimer() {
      if (state.isRunning) {
        const now = Date.now();
        if (state.mode === 'focus') {
          state.lastFocusActiveTimestamp = now;
        }
        if (state.lastTickStartMs) {
          state.sessionElapsedMs = (state.sessionElapsedMs || 0) + Math.max(0, now - state.lastTickStartMs);
          state.lastTickStartMs = null;
        }
        if (state.timerEndTimestamp) {
          const remMs = Math.max(0, state.timerEndTimestamp - now);
          state.remainingMs = remMs;
          const frozenSecs = Math.max(0, Math.floor(remMs / 1000));
          state.timeLeftSeconds = Math.min(state.timeLeftSeconds, frozenSecs);
        }
      }
      state.isRunning = false;
      state.timerEndTimestamp = null;
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
      updateClockUI();
    }

    function resetTimer() {
      pauseTimer();
      const mins = state.durations[state.mode];
      state.totalSecondsForSession = mins * 60;
      state.timeLeftSeconds = mins * 60;
      state.remainingMs = mins * 60 * 1000;
      state.timerEndTimestamp = null;
      state.sessionElapsedMs = 0;
      state.lastTickStartMs = null;
      state.restCyclePausedCarryExclusionSecs = 0;
      updateClockUI();
    }

    function handleSessionComplete() {
      const completedMode = state.mode;
      const nowTs = Date.now();
      const excludedPreBreakSecs = state.restCyclePausedCarryExclusionSecs || 0;
      pauseTimer();
      playSessionCompletionRingtone(completedMode);

      const mins = state.durations[state.mode];
      state.totalSecondsForSession = mins * 60;
      state.timeLeftSeconds = mins * 60;
      state.remainingMs = mins * 60 * 1000;
      state.timerEndTimestamp = null;
      state.sessionElapsedMs = 0;
      state.lastTickStartMs = null;
      state.restCyclePausedCarryExclusionSecs = 0;
      updateClockUI();

      // Requirement #4 & #5 (with Continuity / Same-Period Verification):
      // - Daily overview always records +1 in 「专注次数」 and adds full duration to 「专注时长」.
      // - Rest reminder cycle ONLY counts continuous focus sessions/minutes without a long absence (>= 20 mins).
      if (completedMode === 'focus') {
        const sessionFocusMins = state.durations.focus;
        state.completedFocusSessions += 1;
        state.completedFocusMinutes += sessionFocusMins;
        state.lastFocusActiveTimestamp = nowTs;

        if (excludedPreBreakSecs > 0) {
          // User paused mid-session and left for >= 20 minutes before returning to finish the remainder:
          // Only the continuous post-return portion counts toward the new rest-reminder streak!
          const continuousSecs = Math.max(0, (sessionFocusMins * 60) - excludedPreBreakSecs);
          const totalRestCarrySecs = (state.restCycleRemainderSeconds || 0) + continuousSecs;
          state.restCycleFocusMinutes = (state.restCycleFocusMinutes || 0) + Math.floor(totalRestCarrySecs / 60);
          state.restCycleRemainderSeconds = totalRestCarrySecs % 60;
        } else {
          state.restCycleStandardSessions = (state.restCycleStandardSessions || 0) + 1;
          state.restCycleFocusMinutes = (state.restCycleFocusMinutes || 0) + sessionFocusMins;
        }

        saveDailyDataToStorage();
        renderTasksAndOverview('sessionComplete');

        // Trigger rest reminder ONLY if 4 consecutive focus rounds OR >= 100 continuous focus minutes are reached
        if (state.restCycleStandardSessions >= 4 || state.restCycleFocusMinutes >= 100) {
          openReminderModal({
            title: '辛苦了！',
            desc: '劳逸结合，该歇一歇了。',
            iconType: 'celebrate',
            pauseWhileOpen: false,
            onConfirm: () => {
              switchMode('longBreak');
              startTimer();
            },
            onCancel: () => {
              resetRestReminderCycle();
            }
          });
        }
      } else if (completedMode === 'longBreak') {
        // When Long Break countdown naturally finishes, reset the rest reminder mechanism to 0
        resetRestReminderCycle();
      }
    }

    // =========================================================================
    // 10. TASKS & OVERVIEW DYNAMIC SYNCHRONIZATION (#3, #4)
    //     - Task's `focusedMinutes` in 「今日任务」 is strictly the user's estimated
    //       completion time (预计完成时间) and is NEVER mixed into 「专注时长」 or 「专注次数」.
    //     - 「专注次数」 only counts completed Focus timer countdowns.
    //     - 「专注时长」 only counts actual minutes from completed Focus timer countdowns.
    //     - 「完成任务」 only counts tasks marked as completed by the user.
    // =========================================================================
    function renderTasksAndOverview(changedType = null) {
      if (state.tasks.length === 0) {
        taskListContainer.innerHTML = `
          <div class="h-full min-h-[120px] flex items-center justify-center text-sm font-semibold" style="color: var(--md-text-muted);">
            暂无任务
          </div>
        `;
      } else {
        taskListContainer.innerHTML = state.tasks.map(task => {
          return `
            <div class="py-3.5 px-2 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3.5 min-w-0 flex-1">
                <button type="button" data-action="toggle-complete" data-id="${task.id}"
                        class="task-check-btn w-6 h-6 flex items-center justify-center border-2 shrink-0 m3-Interactive"
                        style="border-radius: ${task.completed ? '12px' : '8px'}; border-color: var(--md-primary); background-color: ${task.completed ? 'var(--md-primary)' : 'transparent'}; color: var(--md-on-primary);">
                  ${task.completed ? `
                    <svg class="w-3.5 h-3.5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  ` : ''}
                </button>

                <span class="font-bold text-sm sm:text-base truncate ${task.completed ? 'line-through opacity-55' : ''}">
                  ${escapeHtml(task.name)}
                </span>
              </div>

              <div class="flex items-center gap-3 shrink-0">
                <span class="text-sm font-extrabold clock-digits" style="color: var(--md-primary);">
                  ${task.focusedMinutes} 分钟
                </span>

                <button type="button" data-action="delete-task" data-id="${task.id}"
                        class="task-del-btn w-8 h-8 flex items-center justify-center m3-Interactive"
                        style="border-radius: 12px; background-color: var(--md-surface); color: var(--md-text-muted);"
                        aria-label="删除任务">
                  <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              </div>
            </div>
          `;
        }).join('');

        taskListContainer.querySelectorAll('.task-check-btn').forEach(btn => {
          const isDone = btn.querySelector('svg') !== null;
          registerSpringElement(btn, {
            radii: isDone ? [12, 12, 12, 12] : [8, 8, 8, 8],
            hoverRadii: [12, 12, 12, 12],
            activeRadii: [6, 6, 6, 6],
            hoverScale: 1.12,
            activeScaleX: 1.2,
            activeScaleY: 0.85,
            magnetic: 0.08
          });
        });
        taskListContainer.querySelectorAll('.task-del-btn').forEach(btn => {
          registerSpringElement(btn, {
            radii: [12, 12, 12, 12],
            hoverRadii: [16, 16, 16, 16],
            activeRadii: [9, 9, 9, 9],
            hoverScale: 1.1,
            activeScaleX: 1.15,
            activeScaleY: 0.88,
            magnetic: 0.08
          });
        });
      }

      const completedTasksCount = state.tasks.filter(t => t.completed).length;

      statCompletedSessions.textContent = String(state.completedFocusSessions);
      statFocusMinutes.textContent = String(state.completedFocusMinutes);
      statCompletedTasks.textContent = String(completedTasksCount);

      if (changedType === 'sessionComplete') {
        pulseElementSpring(overviewCardSessions, 0.07, 0.07);
        pulseElementSpring(overviewCardMinutes, 0.07, 0.07);
      } else if (changedType === 'minutesOnly') {
        pulseElementSpring(overviewCardMinutes, 0.07, 0.07);
      } else if (changedType === 'complete' || changedType === 'delete') {
        pulseElementSpring(overviewCardTasks, 0.07, 0.07);
      } else if (changedType === 'all') {
        pulseElementSpring(overviewCardSessions, 0.06, 0.06);
        pulseElementSpring(overviewCardMinutes, 0.06, 0.06);
        pulseElementSpring(overviewCardTasks, 0.06, 0.06);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // =========================================================================
    // 11. MODAL SCROLL LOCK & SPRING DIALOG ANIMATIONS
    // =========================================================================
    registerSpringElement(customDurationDialog, { radii: [32, 32, 32, 32], autoBind: false });
    registerSpringElement(addTaskDialog, { radii: [32, 32, 32, 32], autoBind: false });
    registerSpringElement(reminderConfirmDialog, { radii: [32, 32, 32, 32], autoBind: false });

    function lockBodyScroll() {
      document.body.classList.add('modal-open');
    }

    function unlockBodyScroll() {
      document.body.classList.remove('modal-open');
    }

    function highlightPresetButtons(val) {
      presetBtns.forEach(btn => {
        const presetVal = parseInt(btn.getAttribute('data-preset-min'), 10);
        if (presetVal === val) {
          btn.style.backgroundColor = 'var(--md-primary-container)';
          btn.style.color = 'var(--md-on-primary-container)';
        } else {
          btn.style.backgroundColor = 'var(--md-surface)';
          btn.style.color = 'var(--md-text-main)';
        }
      });
      updatePresetGroupSprings(null, null);
    }

    function openCustomDurationModal() {
      customFocusInput.value = state.durations.focus;
      highlightPresetButtons(state.durations.focus);
      customDurationModal.classList.remove('hidden');
      customDurationModal.classList.add('flex');
      lockBodyScroll();

      const dSpring = springElements.get(customDurationDialog);
      if (dSpring) {
        dSpring.scaleX.current = 0.88;
        dSpring.scaleY.current = 0.88;
        dSpring.scaleX.setTarget(1, 0.04);
        dSpring.scaleY.setTarget(1, 0.04);
        wakeSpringLoop();
      }
      setTimeout(() => customFocusInput.focus(), 40);
    }

    function hideCustomDurationModal() {
      customDurationModal.classList.add('hidden');
      customDurationModal.classList.remove('flex');
      unlockBodyScroll();
    }

    function openAddTaskModal() {
      modalTaskTitle.value = '';
      modalTaskFocused.value = String(state.durations.focus);
      addTaskModal.classList.remove('hidden');
      addTaskModal.classList.add('flex');
      lockBodyScroll();

      const dSpring = springElements.get(addTaskDialog);
      if (dSpring) {
        dSpring.scaleX.current = 0.88;
        dSpring.scaleY.current = 0.88;
        dSpring.scaleX.setTarget(1, 0.04);
        dSpring.scaleY.setTarget(1, 0.04);
        wakeSpringLoop();
      }
      setTimeout(() => modalTaskTitle.focus(), 40);
    }

    function hideAddTaskModal() {
      addTaskModal.classList.add('hidden');
      addTaskModal.classList.remove('flex');
      unlockBodyScroll();
    }

    // =========================================================================
    // 12. EVENT LISTENERS & INITIALIZATION
    // =========================================================================
    modeFocusBtn.addEventListener('click', () => requestModeSwitch('focus'));
    modeShortBtn.addEventListener('click', () => requestModeSwitch('shortBreak'));
    modeLongBtn.addEventListener('click', () => requestModeSwitch('longBreak'));

    startBtn.addEventListener('click', () => {
      if (state.isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    resetBtn.addEventListener('click', requestTimerReset);

    closeReminderModalBtn.addEventListener('click', () => hideReminderModal({ resumeIfCanceled: true }));
    cancelReminderBtn.addEventListener('click', () => hideReminderModal({ resumeIfCanceled: true }));
    confirmReminderBtn.addEventListener('click', () => {
      const confirmCb = activeReminderConfirmCallback;
      hideReminderModal({ resumeIfCanceled: false });
      if (typeof confirmCb === 'function') {
        confirmCb();
      }
    });

    pencilEditDurationBtn.addEventListener('click', openCustomDurationModal);
    closeDurationModal.addEventListener('click', hideCustomDurationModal);
    cancelDurationBtn.addEventListener('click', hideCustomDurationModal);

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const minVal = parseInt(btn.getAttribute('data-preset-min'), 10);
        customFocusInput.value = minVal;
        highlightPresetButtons(minVal);
      });
    });

    customFocusInput.addEventListener('input', () => {
      highlightPresetButtons(parseInt(customFocusInput.value, 10));
    });

    saveDurationBtn.addEventListener('click', () => {
      const val = Math.min(180, Math.max(1, parseInt(customFocusInput.value, 10) || 25));
      state.durations.focus = val;
      saveDailyDataToStorage();
      hideCustomDurationModal();
      switchMode('focus');
    });

    addTaskTopBtn.addEventListener('click', openAddTaskModal);
    closeTaskModal.addEventListener('click', hideAddTaskModal);
    cancelTaskModalBtn.addEventListener('click', hideAddTaskModal);

    modalTaskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = modalTaskTitle.value.trim();
      if (!name) return;
      const focusedMinutes = Math.max(1, parseInt(modalTaskFocused.value, 10) || state.durations.focus);
      const newTask = {
        id: 'task-' + Date.now(),
        name,
        focusedMinutes,
        completed: false,
        updatedAt: Date.now()
      };
      state.tasks.unshift(newTask);
      saveDailyDataToStorage();
      hideAddTaskModal();
      renderTasksAndOverview('add');
    });

    taskListContainer.addEventListener('click', (e) => {
      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.getAttribute('data-action');
      const taskId = actionEl.getAttribute('data-id');
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;

      if (action === 'toggle-complete') {
        task.completed = !task.completed;
        task.updatedAt = Date.now();
        saveDailyDataToStorage();
        renderTasksAndOverview('complete');
      } else if (action === 'delete-task') {
        if (!Array.isArray(state.deletedTaskIds)) state.deletedTaskIds = [];
        if (!state.deletedTaskIds.includes(taskId)) {
          state.deletedTaskIds.push(taskId);
        }
        state.tasks = state.tasks.filter(t => t.id !== taskId);
        saveDailyDataToStorage();
        renderTasksAndOverview('delete');
      }
    });

    [customDurationModal, addTaskModal, reminderConfirmModal].forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          if (modal === reminderConfirmModal) {
            hideReminderModal({ resumeIfCanceled: true });
          } else {
            hideCustomDurationModal();
            hideAddTaskModal();
          }
        }
      });
      modal.addEventListener('wheel', (e) => {
        e.preventDefault();
      }, { passive: false });
      modal.addEventListener('touchmove', (e) => {
        e.preventDefault();
      }, { passive: false });
    });

    // =========================================================================
    // 13. SCREEN-OFF BACKGROUND NETWORK KEEP-ALIVE ENGINE (#5):
    //     Does NOT lock the screen on (`navigator.wakeLock` removed so screen turns off normally!).
    //     Ensures the website continues running and stays connected to campus Wi-Fi in the background
    //     when the screen turns off or the user switches tabs:
    //     1. Dedicated Background Web Worker (`keepAliveWorker`) running unthrottled on a separate OS thread
    //     2. Sub-audible Web Audio keep-alive stream (-90 dBFS) to exempt process from macOS App Nap when screen is off
    //     3. Multi-endpoint HTTP `keepalive: true` network heartbeats every 10s (both Worker & Main thread)
    //     4. Periodic IP-cloud task & overview sync across browsers
    // =========================================================================
    let keepAliveAudioStarted = false;
    let backgroundWorker = null;

    function startBackgroundNetworkWorker() {
      if (backgroundWorker) return;
      try {
        const workerCode = `
          const PING_URLS = [
            'https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg',
            'https://api.ipify.org?format=json',
            'https://www.cloudflare.com/cdn-cgi/trace'
          ];
          let pingCounter = 0;
          // 1. Unthrottled 250ms background tick for Pomodoro timer, audio progress & crossfade even when screen is off
          setInterval(() => {
            self.postMessage({ type: 'bg_tick' });
          }, 250);
          // 2. Unthrottled 10s network keep-alive ping from Worker thread so Wi-Fi stays active when screen turns off
          setInterval(() => {
            const baseUrl = PING_URLS[pingCounter % PING_URLS.length];
            pingCounter++;
            const sep = baseUrl.includes('?') ? '&' : '?';
            fetch(baseUrl + sep + '_ka=' + Date.now(), {
              method: 'GET',
              mode: 'no-cors',
              cache: 'no-store',
              keepalive: true
            }).catch(() => {});
            self.postMessage({ type: 'bg_network_keepalive' });
          }, 10000);
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        backgroundWorker = new Worker(URL.createObjectURL(blob));
        backgroundWorker.onmessage = (e) => {
          const msg = e.data;
          if (!msg) return;
          if (msg.type === 'bg_tick') {
            syncTimerFromWallClock();
            stepBackgroundSafeCrossfade();
            syncStationProgressFromActiveDeck();
          } else if (msg.type === 'bg_network_keepalive') {
            // Secondary main-thread keepalive ping (static CDN only — does NOT spam ntfy.sh every 10s)
            fetch(`https://actions.google.com/sounds/v1/household/lamp_switch_near.ogg?_ka=${Date.now()}`, {
              method: 'HEAD',
              mode: 'no-cors',
              cache: 'no-store',
              keepalive: true
            }).catch(() => {});
          }
        };
      } catch (e) {}
    }

    function requestWakeLockAndKeepAlive() {
      // NOTE: Screen Wake Lock (`navigator.wakeLock`) is intentionally NOT used here (#5),
      // so the user's screen can dim and turn off normally while the app stays online in the background!
      startBackgroundNetworkWorker();

      // Start ultra-quiet (-90 dBFS) Web Audio keep-alive oscillator so macOS/Windows grants
      // background audio & network socket priority when the screen turns off
      try {
        ensureAudioCtx();
        if (audioCtx && !keepAliveAudioStarted) {
          const osc = audioCtx.createOscillator();
          const silentGain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 30;
          silentGain.gain.value = 0.00001;
          osc.connect(silentGain);
          silentGain.connect(audioCtx.destination);
          osc.start();
          keepAliveAudioStarted = true;
        }
      } catch (e) {}
    }

    function recoverAudioAndTimerAfterWakeOrReconnect() {
      checkAndExpireStaleRestCycle(Date.now());
      syncTimerFromWallClock();
      requestWakeLockAndKeepAlive();
      pullDailyDataFromIPCloud();

      // Resume Station music if it was playing and got interrupted by a network blip
      if (state.stationPlaying && activeDeck && activeDeck.paused && !isSeekingWavy) {
        activeDeck.play().catch(() => {
          transitionToTrack(pickRandomNextTrackIndex());
        });
      }

      // Resume all active Ambient sounds if any got paused
      state.activeAmbients.forEach(type => {
        if (!ambientPlayers[type]) {
          startAmbientSound(type);
        } else if (ambientPlayers[type].resume) {
          ambientPlayers[type].resume();
        }
      });

      // Top up live music pool if needed
      if (state.onlineTracks.length < 15) {
        replenishLiveMusicPool();
      }
    }

    // Start background network worker immediately on page load
    startBackgroundNetworkWorker();

    // Fallback interval in case Worker is restricted (static CDN keep-alive every 12s)
    setInterval(() => {
      syncTimerFromWallClock();
      syncStationProgressFromActiveDeck();
      const pingUrl = `https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg?keepalive=${Date.now()}`;
      fetch(pingUrl, {
        method: 'HEAD',
        mode: 'no-cors',
        cache: 'no-store',
        keepalive: true
      }).catch(() => {});
    }, 12000);

    // Rate-limit-safe periodic cloud sync every 180s (avoids ntfy.sh HTTP 429)
    setInterval(() => {
      pullDailyDataFromIPCloud(false);
    }, 180000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        recoverAudioAndTimerAfterWakeOrReconnect();
      } else if (document.visibilityState === 'hidden') {
        // Flush latest daily progress to all local layers & cloud when leaving/closing tab
        if (payloadHasMeaningfulData(state)) {
          saveDailyDataToStorage();
        }
      }
    });

    window.addEventListener('pagehide', () => {
      if (payloadHasMeaningfulData(state)) {
        saveDailyDataToStorage();
      }
    });

    window.addEventListener('beforeunload', () => {
      if (payloadHasMeaningfulData(state)) {
        writePayloadToLocalLayers(buildDailyPayload());
      }
    });

    window.addEventListener('online', () => {
      recoverAudioAndTimerAfterWakeOrReconnect();
    });

    window.addEventListener('focus', () => {
      recoverAudioAndTimerAfterWakeOrReconnect();
    });

    ['pointerdown', 'keydown'].forEach(evt => {
      document.addEventListener(evt, () => {
        requestWakeLockAndKeepAlive();
      }, { once: false, passive: true });
    });

    // Load Today's Persisted Data (or auto-reset if past 00:00) and Render
    loadDailyDataFromStorage();
    updateThemeSwitchTargets();
    requestAnimationFrame(animateThemeSwitch);
    renderTasksAndOverview();
    updateClockUI();
  </script>
</body>
</html>
