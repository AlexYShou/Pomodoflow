<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoflow</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='11' fill='%23B3261E'/%3E%3Cpath d='M16 9.5C10.2 9.5 6.5 13.1 6.5 18.2C6.5 23.3 10.6 26.8 16 26.8C21.4 26.8 25.5 23.3 25.5 18.2C25.5 13.1 21.8 9.5 16 9.5Z' fill='%23FFFFFF'/%3E%3Cpath d='M16 9.8C13.2 6.2 9.2 6.8 8.2 9.0C11.2 10.2 13.8 10.0 16 9.8Z' fill='%23FFDDB3'/%3E%3Cpath d='M16 9.8C18.8 6.2 22.8 6.8 23.8 9.0C20.8 10.2 18.2 10.0 16 9.8Z' fill='%23FFDDB3'/%3E%3Cpath d='M16 5.2V9.8' stroke='%23FFDDB3' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='18.2' r='5.2' fill='none' stroke='%23B3261E' stroke-width='2.1' stroke-dasharray='22 12' stroke-linecap='round'/%3E%3Cpath d='M16 15.2V18.2L18.4 19.8' fill='none' stroke='%23B3261E' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
       MATERIAL 3 EXPRESSIVE DYNAMIC COLOR TOKENS (LIGHT & DARK × 3 MODES)
       ========================================================================= */
    :root {
      color-scheme: light;
      /* Focus Mode - Light (Warm Terracotta) */
      --md-bg: #FFF8F6;
      --md-surface: #FCEAE5;
      --md-surface-high: #F5DDD7;
      --md-surface-card: #FFFFFF;
      --md-primary: #B3261E;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #FFDAD4;
      --md-on-primary-container: #410001;
      --md-secondary-container: #F9DEDC;
      --md-on-secondary-container: #410E0B;
      --md-tertiary-container: #FFDDB3;
      --md-on-tertiary-container: #291800;
      --md-outline: #E0BDBA;
      --md-text-main: #231917;
      --md-text-muted: #5C403C;
      --md-ring-track: #F2D3CD;
      --md-switch-off-rgb: 216, 194, 190;
      --md-switch-on-rgb: 179, 38, 30;
      --md-shadow: rgba(179, 38, 30, 0.08);
    }

    body[data-mode="shortBreak"] {
      --md-bg: #F4FBF8;
      --md-surface: #E2F3EC;
      --md-surface-high: #D3EAE1;
      --md-surface-card: #FFFFFF;
      --md-primary: #006B58;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #A1F2DC;
      --md-on-primary-container: #002019;
      --md-secondary-container: #CFE9DF;
      --md-on-secondary-container: #072019;
      --md-tertiary-container: #C4E7FF;
      --md-on-tertiary-container: #001E2C;
      --md-outline: #B4D2C7;
      --md-text-main: #171D1B;
      --md-text-muted: #3F4945;
      --md-ring-track: #CBE6DC;
      --md-switch-off-rgb: 180, 210, 199;
      --md-switch-on-rgb: 0, 107, 88;
      --md-shadow: rgba(0, 107, 88, 0.08);
    }

    body[data-mode="longBreak"] {
      --md-bg: #FBF8FF;
      --md-surface: #EFEBF9;
      --md-surface-high: #E4DFF3;
      --md-surface-card: #FFFFFF;
      --md-primary: #5754A8;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #E2DFFF;
      --md-on-primary-container: #130E63;
      --md-secondary-container: #E3E0F9;
      --md-on-secondary-container: #19182C;
      --md-tertiary-container: #FFD8EC;
      --md-on-tertiary-container: #370726;
      --md-outline: #C8C4DC;
      --md-text-main: #1C1B22;
      --md-text-muted: #474654;
      --md-ring-track: #DCD8EE;
      --md-switch-off-rgb: 200, 196, 220;
      --md-switch-on-rgb: 87, 84, 168;
      --md-shadow: rgba(87, 84, 168, 0.08);
    }

    /* Dark Mode Overrides across all 3 modes */
    body.dark-mode {
      color-scheme: dark;
    }

    body.dark-mode[data-mode="focus"] {
      --md-bg: #16100F;
      --md-surface: #251B19;
      --md-surface-high: #322523;
      --md-surface-card: #1E1514;
      --md-primary: #FFB4A8;
      --md-on-primary: #690005;
      --md-primary-container: #7D1D16;
      --md-on-primary-container: #FFDAD4;
      --md-secondary-container: #4A3330;
      --md-on-secondary-container: #FFDAD4;
      --md-tertiary-container: #554017;
      --md-on-tertiary-container: #FFDDB3;
      --md-outline: #4E3D3A;
      --md-text-main: #F5E2DF;
      --md-text-muted: #CBB2AE;
      --md-ring-track: #362624;
      --md-switch-off-rgb: 78, 61, 58;
      --md-switch-on-rgb: 224, 102, 90;
      --md-shadow: rgba(0, 0, 0, 0.45);
    }

    body.dark-mode[data-mode="shortBreak"] {
      --md-bg: #0E1513;
      --md-surface: #182420;
      --md-surface-high: #22312C;
      --md-surface-card: #141E1B;
      --md-primary: #85D6C0;
      --md-on-primary: #00382D;
      --md-primary-container: #005142;
      --md-on-primary-container: #A1F2DC;
      --md-secondary-container: #2B423B;
      --md-on-secondary-container: #CFE9DF;
      --md-tertiary-container: #1F4456;
      --md-on-tertiary-container: #C4E7FF;
      --md-outline: #384944;
      --md-text-main: #E0EAE6;
      --md-text-muted: #B2C4BE;
      --md-ring-track: #22332E;
      --md-switch-off-rgb: 56, 73, 68;
      --md-switch-on-rgb: 46, 158, 133;
      --md-shadow: rgba(0, 0, 0, 0.45);
    }

    body.dark-mode[data-mode="longBreak"] {
      --md-bg: #121218;
      --md-surface: #1E1E28;
      --md-surface-high: #282836;
      --md-surface-card: #181821;
      --md-primary: #C3C0FF;
      --md-on-primary: #282377;
      --md-primary-container: #3F3C8F;
      --md-on-primary-container: #E2DFFF;
      --md-secondary-container: #38384C;
      --md-on-secondary-container: #E3E0F9;
      --md-tertiary-container: #543247;
      --md-on-tertiary-container: #FFD8EC;
      --md-outline: #434254;
      --md-text-main: #E6E3F0;
      --md-text-muted: #BEBBD0;
      --md-ring-track: #2A293A;
      --md-switch-off-rgb: 67, 66, 84;
      --md-switch-on-rgb: 118, 114, 212;
      --md-shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Unified Theme Transition: Eliminates full-page flash when switching Light <-> Dark (#3) */
    body,
    .m3-SurfaceTransition,
    #mode-group,
    #clock-card,
    #today-tasks-section,
    #focus-overview-section,
    #music-popover-card,
    #custom-duration-dialog,
    #add-task-dialog,
    #pixel-volume-slider,
    #pixel-volume-fill {
      transition: background-color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background-color: var(--md-bg);
      color: var(--md-text-main);
      overflow-x: hidden;
    }

    body.modal-open {
      overflow: hidden !important;
      height: 100vh;
    }

    .clock-digits {
      font-family: 'Inter', 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }

    .progress-ring-circle {
      transition: stroke-dashoffset 0.65s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    .progress-ring-track {
      transition: stroke 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Fixed GPU-Composited Ambient Blob: Uses solid background-color instead of radial-gradient
       so CSS transitions smoothly interpolate without destroying/flashing the blur texture (#3) */
    .ambient-blob {
      background-color: var(--md-primary-container);
      filter: blur(88px);
      opacity: 0.38;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      will-change: background-color, opacity;
      transition: background-color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.dark-mode .ambient-blob {
      opacity: 0.20;
    }

    /* Universal M3 Expressive Interactive Element */
    .m3-Interactive {
      will-change: transform, border-radius, flex-grow;
      user-select: none;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
      transition: background-color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .m3-Interactive::after {
      content: '';
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      pointer-events: none;
      border-radius: inherit;
      transition: opacity 0.2s ease;
    }
    .m3-Interactive:hover::after {
      opacity: 0.06;
    }
    .m3-Interactive:active::after {
      opacity: 0.12;
    }

    /* M3 Expressive Input Interactive Styling */
    .m3-Input {
      will-change: transform, border-radius;
      transition: background-color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  color 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.28s ease;
    }
    .m3-Input:focus {
      border-color: var(--md-primary) !important;
      box-shadow: 0 0 0 3px var(--md-primary-container);
    }

    /* =========================================================================
       TOP-RIGHT M3 EXPRESSIVE SWITCH (1:1 Reference from m3_expressive.html)
       ========================================================================= */
    .m3e-switch-scale-box {
      width: 68px;
      height: 39px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .m3e-switch-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      outline: none;
      transform: scale(0.607);
      transform-origin: center center;
    }

    .m3e-switch-wrapper:active {
      cursor: grabbing;
    }

    .m3e-switch-track {
      position: relative;
      width: 112px;
      height: 64px;
      border-radius: 32px;
      transition: box-shadow 0.2s ease;
      will-change: transform, background-color;
    }

    .m3e-thumb-halo {
      position: absolute;
      top: 50%;
      left: 0;
      width: 76px;
      height: 76px;
      border-radius: 26px;
      background-color: rgba(128, 128, 128, 0.18);
      pointer-events: none;
      transform: translate3d(0, -50%, 0) scale(0.5);
      opacity: 0;
      transition: opacity 0.2s ease;
      will-change: transform, opacity;
    }

    .m3e-switch-thumb {
      position: absolute;
      top: 50%;
      left: 0;
      width: 42px;
      height: 46px;
      border-radius: 14px;
      background-color: #FFFFFF;
      box-shadow: 0 4px 9px rgba(25, 20, 35, 0.20), 0 1.5px 3px rgba(25, 20, 35, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      will-change: transform, width, height, border-radius, box-shadow;
    }

    /* Music Equalizer Animation */
    @keyframes eqBar1 {
      0%, 100% { height: 5px; }
      50% { height: 15px; }
    }
    @keyframes eqBar2 {
      0%, 100% { height: 14px; }
      33% { height: 5px; }
      66% { height: 16px; }
    }
    @keyframes eqBar3 {
      0%, 100% { height: 7px; }
      40% { height: 15px; }
      80% { height: 5px; }
    }
    .eq-playing .eq-1 { animation: eqBar1 0.7s ease-in-out infinite; }
    .eq-playing .eq-2 { animation: eqBar2 0.6s ease-in-out infinite; }
    .eq-playing .eq-3 { animation: eqBar3 0.8s ease-in-out infinite; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--md-outline);
      border-radius: 9999px;
    }
  </style>
</head>
<body data-mode="focus" class="min-h-screen lg:h-screen lg:overflow-hidden relative flex flex-col">

  <!-- Expressive Ambient Background Blobs -->
  <div class="ambient-blob fixed -top-24 -left-24 w-96 h-96 rounded-full z-0"></div>
  <div class="ambient-blob fixed bottom-0 -right-28 w-[26rem] h-[26rem] rounded-full z-0"></div>

  <!-- ========================================================================= -->
  <!-- TOP NAVIGATION BAR: Left Brand + Right M3 Expressive Light/Dark Switch   -->
  <!-- ========================================================================= -->
  <header class="relative z-20 w-full max-w-[1360px] mx-auto px-5 sm:px-8 pt-4 pb-2 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <!-- Redesigned M3 Expressive Pomodoro Tomato Icon (#4) -->
      <div id="brand-logo"
           class="w-11 h-11 flex items-center justify-center shadow-sm m3-Interactive"
           style="background-color: var(--md-primary); color: var(--md-on-primary); border-radius: 16px;">
        <svg class="w-7 h-7 pointer-events-none" viewBox="0 0 32 32" fill="none">
          <!-- Plump M3 Expressive Tomato Silhouette -->
          <path d="M16 9.6C10.1 9.6 6.2 13.1 6.2 18.3C6.2 23.5 10.4 27.0 16 27.0C21.6 27.0 25.8 23.5 25.8 18.3C25.8 13.1 21.9 9.6 16 9.6Z"
                fill="currentColor" />
          <!-- Expressive Three-Leaf Tomato Crown / Calyx -->
          <path d="M16 9.8C13.0 5.8 8.6 6.4 7.6 8.8C10.8 10.2 13.6 10.1 16 9.8Z"
                fill="var(--md-tertiary-container)" />
          <path d="M16 9.8C19.0 5.8 23.4 6.4 24.4 8.8C21.2 10.2 18.4 10.1 16 9.8Z"
                fill="var(--md-tertiary-container)" />
          <path d="M16 4.6V9.8"
                stroke="var(--md-tertiary-container)" stroke-width="2.5" stroke-linecap="round" />
          <!-- Embedded Pomodoro Focus Progress Ring & 25-Min Timer Hand inside Tomato -->
          <circle cx="16" cy="18.4" r="5.3"
                  stroke="var(--md-primary)" stroke-width="2.2" stroke-dasharray="23 11" stroke-linecap="round" />
          <path d="M16 15.2V18.4L18.5 20.0"
                stroke="var(--md-primary)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight" style="color: var(--md-text-main);">Pomodoflow</h1>
    </div>

    <!-- Right: M3 Expressive Squircle Switch (Sun <-> Moon Icon Evolution) -->
    <div class="m3e-switch-scale-box">
      <div id="themeSwitch"
           role="switch"
           aria-checked="false"
           aria-label="切换浅色或深色模式"
           tabindex="0"
           class="m3e-switch-wrapper">
        <div id="themeTrack" class="m3e-switch-track">
          <div id="themeHalo" class="m3e-thumb-halo"></div>
          <div id="themeThumb" class="m3e-switch-thumb">
            <svg id="themeThumbSvg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <g id="themeSunGroup">
                <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
                <path d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56"></path>
              </g>
              <g id="themeMoonGroup" class="hidden">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"></path>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- SINGLE-PAGE SPLIT SCREEN: Left Main Area | Right Secondary Area          -->
  <!-- ========================================================================= -->
  <main class="relative z-10 flex-1 w-full max-w-[1360px] mx-auto px-5 sm:px-8 pb-5 pt-1 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-center min-h-0">

    <!-- ======================================================================= -->
    <!-- LEFT SCREEN (6 cols): MAIN POMODORO TIMER & CONTROLS                    -->
    <!-- ======================================================================= -->
    <section class="lg:col-span-6 h-full flex flex-col items-center justify-center min-h-0 py-2">

      <!-- 1. Mode Switcher Above the Clock: 「专注」、「短歇」、「长歇」 -->
      <div class="w-full max-w-md mb-5 shrink-0">
        <div id="mode-group"
             class="p-1.5 flex items-stretch gap-1.5 shadow-sm border h-13 sm:h-14"
             style="background-color: var(--md-surface); border-color: var(--md-outline); border-radius: 28px;">
          <button id="mode-focus-btn" type="button" data-mode-btn="focus"
                  class="m3-Interactive font-bold text-sm sm:text-base flex items-center justify-center px-3"
                  style="flex: 1.14 1 0%; border-radius: 22px; background-color: var(--md-primary); color: var(--md-on-primary);">
            <span>专注</span>
          </button>

          <button id="mode-short-btn" type="button" data-mode-btn="shortBreak"
                  class="m3-Interactive font-bold text-sm sm:text-base flex items-center justify-center px-3"
                  style="flex: 0.93 1 0%; border-radius: 16px; background-color: transparent; color: var(--md-text-muted);">
            <span>短歇</span>
          </button>

          <button id="mode-long-btn" type="button" data-mode-btn="longBreak"
                  class="m3-Interactive font-bold text-sm sm:text-base flex items-center justify-center px-3"
                  style="flex: 0.93 1 0%; border-radius: 16px; background-color: transparent; color: var(--md-text-muted);">
            <span>长歇</span>
          </button>
        </div>
      </div>

      <!-- 2. Center Circular Progress Pomodoro Clock -->
      <div class="relative flex items-center justify-center my-1 shrink-0">
        <div id="clock-card"
             class="relative w-[276px] h-[276px] sm:w-[316px] sm:h-[316px] flex items-center justify-center border m3-Interactive"
             style="background-color: var(--md-surface-card); border-color: var(--md-outline); border-radius: 56px; box-shadow: 0 18px 40px -12px var(--md-shadow);">

          <svg class="w-[244px] h-[244px] sm:w-[284px] sm:h-[284px] pointer-events-none" viewBox="0 0 260 260">
            <circle
              class="progress-ring-track"
              cx="130" cy="130" r="112"
              fill="none"
              stroke="var(--md-ring-track)"
              stroke-width="16"
              stroke-linecap="round"
            />
            <circle
              id="progress-ring"
              class="progress-ring-circle"
              cx="130" cy="130" r="112"
              fill="none"
              stroke="var(--md-primary)"
              stroke-width="16"
              stroke-linecap="round"
              stroke-dasharray="703.72"
              stroke-dashoffset="0"
            />
          </svg>

          <!-- Dead-Center Fixed Time Readout -->
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div id="timer-display"
                 class="clock-digits text-6xl sm:text-7xl font-extrabold tracking-tight select-none leading-none"
                 style="color: var(--md-text-main);">
              25:00
            </div>
          </div>

          <!-- Pencil Icon Positioned in the Clean Inner Space Below Time -->
          <button id="pencil-edit-duration-btn" type="button"
                  aria-label="自定义专注时间"
                  class="absolute left-1/2 -translate-x-1/2 w-9 h-9 flex items-center justify-center m3-Interactive z-10"
                  style="top: calc(50% + 44px); background-color: var(--md-surface); color: var(--md-primary); border-radius: 14px;">
            <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- 3. Control Row Below the Clock + Floating Music Card Anchor -->
      <div class="w-full max-w-xl mt-6 shrink-0 relative">

        <!-- =================================================================== -->
        <!-- FLOATING MUSIC CARD (悬浮卡片 - Pops up right above 「音乐」 button)  -->
        <!-- =================================================================== -->
        <div id="music-popover-card"
             class="hidden absolute left-0 bottom-[calc(100%+14px)] w-[332px] sm:w-[380px] p-5 border z-40 origin-bottom-left"
             style="background-color: var(--md-surface-card); border-color: var(--md-outline); border-radius: 32px; box-shadow: 0 24px 48px -12px rgba(0,0,0,0.28);">

          <!-- LAYER 1: 「站台」 (Song Title + Play/Pause + Next/Cut + Interactive M3 Wavy Seekbar) -->
          <div class="mb-4">

  <script>
    // =========================================================================
    // 1. UNIFIED MATERIAL 3 EXPRESSIVE PHYSICS SPRING ENGINE
    // =========================================================================
    class SpringValue {
      constructor(initial, stiffness = 0.22, damping = 0.72) {
        this.current = initial;
        this.target = initial;
        this.velocity = 0;
        this.stiffness = stiffness;
        this.damping = damping;
      }
      setTarget(t, impulse = 0) {
        this.target = t;
        this.velocity += impulse;
      }
      step() {
        const force = (this.target - this.current) * this.stiffness;
        this.velocity = (this.velocity + force) * this.damping;
        this.current += this.velocity;
        if (Math.abs(this.target - this.current) < 0.001 && Math.abs(this.velocity) < 0.001) {
          this.current = this.target;
          this.velocity = 0;
          return false;
        }
        return true;
      }
    }

    const springElements = new Map();
    let springLoopRunning = false;

    function registerSpringElement(el, config = {}) {
      if (!el) return null;
      if (springElements.has(el)) return springElements.get(el);
      const defaultR = config.radii || [16, 16, 16, 16];
      const item = {
        el,
        flex: new SpringValue(config.flex ?? 1, 0.22, 0.74),
        scaleX: new SpringValue(1, 0.26, 0.70),
        scaleY: new SpringValue(1, 0.26, 0.70),
        tx: new SpringValue(0, 0.22, 0.72),
        ty: new SpringValue(0, 0.22, 0.72),
        rTL: new SpringValue(defaultR[0], 0.22, 0.74),
        rTR: new SpringValue(defaultR[1], 0.22, 0.74),
        rBR: new SpringValue(defaultR[2], 0.22, 0.74),
        rBL: new SpringValue(defaultR[3], 0.22, 0.74),
        baseRadii: [...defaultR],
        hoverRadii: config.hoverRadii || defaultR.map(r => Math.min(34, r + 4)),
        activeRadii: config.activeRadii || defaultR.map(r => Math.max(10, r - 4)),
        useFlex: config.useFlex ?? false,
        preserveCenterTranslate: config.preserveCenterTranslate ?? false
      };
      springElements.set(el, item);
      applySpringStyles(item);

      if (config.autoBind !== false) {
        bindGenericM3SpringEvents(el, item, config);
      }
      return item;
    }

    function applySpringStyles(item) {
      const r0 = Math.max(8, item.rTL.current).toFixed(2);
      const r1 = Math.max(8, item.rTR.current).toFixed(2);
      const r2 = Math.max(8, item.rBR.current).toFixed(2);
      const r3 = Math.max(8, item.rBL.current).toFixed(2);
      item.el.style.borderRadius = `${r0}px ${r1}px ${r2}px ${r3}px`;

      const sx = item.scaleX.current.toFixed(4);
      const sy = item.scaleY.current.toFixed(4);
      const tx = item.tx.current.toFixed(2);
      const ty = item.ty.current.toFixed(2);
      if (item.preserveCenterTranslate) {
        item.el.style.transform = `translate3d(calc(-50% + ${tx}px), ${ty}px, 0) scale(${sx}, ${sy})`;
      } else {
        item.el.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${sx}, ${sy})`;
      }

      if (item.useFlex) {
        item.el.style.flexGrow = Math.max(0.65, item.flex.current).toFixed(4);
      }
    }

    function bindGenericM3SpringEvents(el, item, config) {
      const hoverScale = config.hoverScale ?? 1.04;
      const activeScaleX = config.activeScaleX ?? 1.06;
      const activeScaleY = config.activeScaleY ?? 0.92;
      const magStrength = config.magnetic ?? 0.08;

      el.addEventListener('pointerenter', () => {
        item.scaleX.setTarget(hoverScale);
        item.scaleY.setTarget(hoverScale);
        item.rTL.setTarget(item.hoverRadii[0]);
        item.rTR.setTarget(item.hoverRadii[1]);
        item.rBR.setTarget(item.hoverRadii[2]);
        item.rBL.setTarget(item.hoverRadii[3]);
        wakeSpringLoop();
      });

      el.addEventListener('pointerleave', () => {
        item.scaleX.setTarget(1);
        item.scaleY.setTarget(1);
        item.tx.setTarget(0);
        item.ty.setTarget(0);
        item.rTL.setTarget(item.baseRadii[0]);
        item.rTR.setTarget(item.baseRadii[1]);
        item.rBR.setTarget(item.baseRadii[2]);
        item.rBL.setTarget(item.baseRadii[3]);
        wakeSpringLoop();
      });

      el.addEventListener('pointerdown', () => {
        item.scaleX.setTarget(activeScaleX, 0.03);
        item.scaleY.setTarget(activeScaleY, -0.04);
        item.rTL.setTarget(item.activeRadii[0]);
        item.rTR.setTarget(item.activeRadii[1]);
        item.rBR.setTarget(item.activeRadii[2]);
        item.rBL.setTarget(item.activeRadii[3]);
        wakeSpringLoop();
      });

      el.addEventListener('pointerup', () => {
        item.scaleX.setTarget(hoverScale, 0.02);
        item.scaleY.setTarget(hoverScale, 0.03);
        item.rTL.setTarget(item.hoverRadii[0]);
        item.rTR.setTarget(item.hoverRadii[1]);
        item.rBR.setTarget(item.hoverRadii[2]);
        item.rBL.setTarget(item.hoverRadii[3]);
        wakeSpringLoop();
      });

      if (magStrength > 0) {
        el.addEventListener('pointermove', (e) => {
          const rect = el.getBoundingClientRect();
          const dx = (e.clientX - (rect.left + rect.width / 2)) * magStrength;
          const dy = (e.clientY - (rect.top + rect.height / 2)) * magStrength;
          item.tx.setTarget(dx);
          item.ty.setTarget(dy);
          wakeSpringLoop();
        });
      }
    }

    function pulseElementSpring(el, impulseX = 0.08, impulseY = 0.08) {
      const item = springElements.get(el);
      if (!item) return;
      item.scaleX.velocity += impulseX;
      item.scaleY.velocity += impulseY;
      wakeSpringLoop();
    }

    function wakeSpringLoop() {
      if (springLoopRunning) return;
      springLoopRunning = true;
      function tick() {
        let anyActive = false;
        springElements.forEach(item => {
          const a1 = item.flex.step();
          const a2 = item.scaleX.step();
          const a3 = item.scaleY.step();
          const a4 = item.tx.step();
          const a5 = item.ty.step();
          const a6 = item.rTL.step();
          const a7 = item.rTR.step();
          const a8 = item.rBR.step();
          const a9 = item.rBL.step();
          applySpringStyles(item);
          if (a1 || a2 || a3 || a4 || a5 || a6 || a7 || a8 || a9) {
            anyActive = true;
          }
        });
        if (anyActive) {
          requestAnimationFrame(tick);
        } else {
          springLoopRunning = false;
        }
      }
      requestAnimationFrame(tick);
    }

    // =========================================================================
    // 2. TOP-RIGHT M3 EXPRESSIVE THEME SWITCH & ZERO-FLICKER TOKEN CACHE (#3)
    // =========================================================================
    // Cached theme palette tokens so requestAnimationFrame never triggers
    // synchronous getComputedStyle(document.body) layout thrashing or mid-frame jumps
    const THEME_TOKEN_TABLE = {
      light: {
        focus:      { off: [216, 194, 190], on: [179, 38, 30],  primary: '#B3261E', track: '#F2D3CD' },
        shortBreak: { off: [180, 210, 199], on: [0, 107, 88],   primary: '#006B58', track: '#CBE6DC' },
        longBreak:  { off: [200, 196, 220], on: [87, 84, 168],  primary: '#5754A8', track: '#DCD8EE' }
      },
      dark: {
        focus:      { off: [78, 61, 58],    on: [224, 102, 90], primary: '#FFB4A8', track: '#362624' },
        shortBreak: { off: [56, 73, 68],    on: [46, 158, 133], primary: '#85D6C0', track: '#22332E' },
        longBreak:  { off: [67, 66, 84],    on: [118, 114, 212],primary: '#C3C0FF', track: '#2A293A' }
      }
    };

    const SWITCH_GEOM = {
      trackW: 112,
      trackH: 64,
      minX: 11,
      maxX: 59,
      baseW: 42,
      baseH: 46,
      baseRadius: 14,
      scaleFactor: 0.607
    };

    const themeSwitchState = {
      checked: false,
      isPressed: false,
      isDragging: false,
      dragStartX: 0,
      dragStartThumbX: SWITCH_GEOM.minX,
      pointerMoved: false,
      x: { pos: SWITCH_GEOM.minX, vel: 0, target: SWITCH_GEOM.minX },
      w: { pos: SWITCH_GEOM.baseW, vel: 0, target: SWITCH_GEOM.baseW },
      h: { pos: SWITCH_GEOM.baseH, vel: 0, target: SWITCH_GEOM.baseH },
      r: { pos: SWITCH_GEOM.baseRadius, vel: 0, target: SWITCH_GEOM.baseRadius },
      haloScale: { pos: 0.5, vel: 0, target: 0.5 }
    };

    const themeSwitchEl = document.getElementById('themeSwitch');
    const themeTrackEl = document.getElementById('themeTrack');
    const themeThumbEl = document.getElementById('themeThumb');
    const themeHaloEl = document.getElementById('themeHalo');
    const themeThumbSvg = document.getElementById('themeThumbSvg');
    const themeSunGroup = document.getElementById('themeSunGroup');
    const themeMoonGroup = document.getElementById('themeMoonGroup');

    function updateThemeSwitchTargets() {
      if (!themeSwitchState.isDragging) {
        themeSwitchState.x.target = themeSwitchState.checked ? SWITCH_GEOM.maxX : SWITCH_GEOM.minX;
      }
      if (themeSwitchState.isPressed) {
        themeSwitchState.w.target = SWITCH_GEOM.baseW + 10;
        themeSwitchState.h.target = SWITCH_GEOM.baseH + 2;
        themeSwitchState.haloScale.target = 1.05;
      } else {
        themeSwitchState.w.target = SWITCH_GEOM.baseW;
        themeSwitchState.h.target = SWITCH_GEOM.baseH;
        themeSwitchState.haloScale.target = 0.5;
      }
      themeSwitchState.r.target = themeSwitchState.checked ? 18 : 14;
      themeSwitchEl.setAttribute('aria-checked', String(themeSwitchState.checked));
      // Only mutate DOM class when state actually differs to prevent redundant style invalidation (#3)
      if (document.body.classList.contains('dark-mode') !== themeSwitchState.checked) {
        document.body.classList.toggle('dark-mode', themeSwitchState.checked);
      }
    }

    // Google Sound Library Light Switch Sound Effect — Frame-Synchronized with Switch Animation (#3)
    const GOOGLE_LIGHT_SWITCH_SOUNDS = [
      'https://actions.google.com/sounds/v1/household/lamp_switch_near.ogg',
      'https://actions.google.com/sounds/v1/household/lamp_switch_on_off.ogg',
      'https://actions.google.com/sounds/v1/office/button_push.ogg'
    ];
    let decodedSwitchBuffer = null;
    let decodedSwitchTransientOffset = 0;

    const preloadedSwitchAudios = GOOGLE_LIGHT_SWITCH_SOUNDS.map(url => {
      const a = new Audio();
      a.preload = 'auto';
      a.src = url;
      a.load();
      return a;
    });

    // Scan decoded PCM samples to find the exact millisecond where the mechanical switch click starts,
    // stripping any leading room-tone silence so the sound and thumb animation happen simultaneously!
    function detectClickTransientOffset(audioBuffer) {
      try {
        const data = audioBuffer.getChannelData(0);
        const sr = audioBuffer.sampleRate;
        let peak = 0;
        for (let i = 0; i < data.length; i++) {
          const absVal = Math.abs(data[i]);
          if (absVal > peak) peak = absVal;
        }
        if (peak <= 0) return 0;
        const threshold = peak * 0.16;
        for (let i = 0; i < data.length; i++) {
          if (Math.abs(data[i]) >= threshold) {
            return Math.max(0, (i / sr) - 0.002);
          }
        }
      } catch (e) {}
      return 0;
    }

    (async function preloadAndDecodeSwitchSound() {
      for (const url of GOOGLE_LIGHT_SWITCH_SOUNDS) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const buf = await res.arrayBuffer();
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) break;
          const tempCtx = new AudioContextClass();
          const decoded = await tempCtx.decodeAudioData(buf);
          decodedSwitchBuffer = decoded;
          decodedSwitchTransientOffset = detectClickTransientOffset(decoded);
          tempCtx.close().catch(() => {});
          break;
        } catch (e) {}
      }
    })();

    function playLightSwitchSound(isDarkModeNow) {
      const targetVol = Math.min(1, Math.max(0.50, state.masterVolume * 0.95));
      try {
        ensureAudioCtx();
        if (audioCtx && decodedSwitchBuffer) {
          const src = audioCtx.createBufferSource();
          const gainNode = audioCtx.createGain();
          src.buffer = decodedSwitchBuffer;
          src.playbackRate.value = isDarkModeNow ? 0.95 : 1.05;
          gainNode.gain.value = targetVol * 2.4;
          src.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          // Start immediately at the exact mechanical transient offset (0ms latency!)
          const maxDur = Math.max(0.18, decodedSwitchBuffer.duration - decodedSwitchTransientOffset);
          src.start(0, decodedSwitchTransientOffset, Math.min(0.38, maxDur));
          return;
        }
      } catch (e) {}

      // Fallback direct HTML5 Audio playback from Google Sound Library
      let played = false;
      function trySwitchUrl(idx) {
        if (idx >= GOOGLE_LIGHT_SWITCH_SOUNDS.length || played) return;
        const baseAudio = preloadedSwitchAudios[idx];
        const sfx = baseAudio ? baseAudio.cloneNode() : new Audio(GOOGLE_LIGHT_SWITCH_SOUNDS[idx]);
        sfx.volume = targetVol;
        sfx.playbackRate = isDarkModeNow ? 0.95 : 1.05;
        const p = sfx.play();
        if (p !== undefined) {
          p.then(() => { played = true; }).catch(() => trySwitchUrl(idx + 1));
        }
      }
      trySwitchUrl(0);
    }

    themeSwitchEl.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      // Pre-warm AudioContext on pointerdown so pointerup sound has 0ms initialization latency
      ensureAudioCtx();
      themeSwitchEl.setPointerCapture(e.pointerId);
      themeSwitchState.isPressed = true;
      themeSwitchState.isDragging = false;
      themeSwitchState.pointerMoved = false;
      themeSwitchState.dragStartX = e.clientX;
      themeSwitchState.dragStartThumbX = themeSwitchState.x.pos;
      updateThemeSwitchTargets();
    });

    themeSwitchEl.addEventListener('pointermove', (e) => {
      if (!themeSwitchState.isPressed) return;
      const dxScreen = e.clientX - themeSwitchState.dragStartX;
      const dxLocal = dxScreen / SWITCH_GEOM.scaleFactor;
      if (Math.abs(dxScreen) > 4) {
        themeSwitchState.isDragging = true;
        themeSwitchState.pointerMoved = true;
      }
      if (themeSwitchState.isDragging) {
        let rawX = themeSwitchState.dragStartThumbX + dxLocal;
        if (rawX < SWITCH_GEOM.minX) {
          rawX = SWITCH_GEOM.minX - Math.pow(SWITCH_GEOM.minX - rawX, 0.65) * 0.8;
        } else if (rawX > SWITCH_GEOM.maxX) {
          rawX = SWITCH_GEOM.maxX + Math.pow(rawX - SWITCH_GEOM.maxX, 0.65) * 0.8;
        }
        themeSwitchState.x.target = rawX;
        updateThemeSwitchTargets();
      }
    });

    function handleThemeSwitchRelease() {
      if (!themeSwitchState.isPressed) return;
      themeSwitchState.isPressed = false;
      const prevChecked = themeSwitchState.checked;
      if (themeSwitchState.pointerMoved) {
        const midPoint = (SWITCH_GEOM.minX + SWITCH_GEOM.maxX) / 2;
        const projectedX = themeSwitchState.x.pos + themeSwitchState.x.vel * 0.04;
        themeSwitchState.checked = projectedX >= midPoint;
      } else {
        themeSwitchState.checked = !themeSwitchState.checked;
        themeSwitchState.w.vel += 140;
      }
      themeSwitchState.isDragging = false;
      themeSwitchState.pointerMoved = false;
      if (themeSwitchState.checked !== prevChecked || !themeSwitchState.pointerMoved) {
        playLightSwitchSound(themeSwitchState.checked);
      }
      updateThemeSwitchTargets();
      saveDailyDataToStorage();
    }

    themeSwitchEl.addEventListener('pointerup', handleThemeSwitchRelease);
    themeSwitchEl.addEventListener('pointercancel', handleThemeSwitchRelease);
    themeSwitchEl.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        themeSwitchState.checked = !themeSwitchState.checked;
        themeSwitchState.w.vel += 140;
        playLightSwitchSound(themeSwitchState.checked);
        updateThemeSwitchTargets();
        saveDailyDataToStorage();
      }
    });

    function stepChannel(ch, k, c, dt) {
      const displacement = ch.pos - ch.target;
      const accel = (-k * displacement) - (c * ch.vel);
      ch.vel += accel * dt;
      ch.pos += ch.vel * dt;
    }

    function lerpRgb(a, b, t) {
      const c = Math.max(0, Math.min(1, t));
      return `rgb(${Math.round(a[0] + (b[0] - a[0]) * c)}, ${Math.round(a[1] + (b[1] - a[1]) * c)}, ${Math.round(a[2] + (b[2] - a[2]) * c)})`;
    }

    // =========================================================================
    // 3. POMODORO APP STATE, PIXABAY MUSIC RANDOM POOL & DAILY PERSISTENCE
    // =========================================================================
    const RING_CIRCUMFERENCE = 2 * Math.PI * 112;
    const DAILY_STORAGE_KEY = 'pomodoflow_daily_tasks_v3';

    function getTodayDateString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // Cryptographically-seeded random integer helper
    function randomInt(maxExclusive) {
      if (maxExclusive <= 1) return 0;
      if (window.crypto && window.crypto.getRandomValues) {
        const arr = new Uint32Array(1);
        window.crypto.getRandomValues(arr);
        return arr[0] % maxExclusive;
      }
      return Math.floor(Math.random() * maxExclusive);
    }

    function shuffleArrayInPlace(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const state = {
      currentDateKey: getTodayDateString(),
      mode: 'focus', // 'focus' | 'shortBreak' | 'longBreak'
      durations: {
        focus: 25,
        shortBreak: 5,
        longBreak: 15
      },
      timeLeftSeconds: 25 * 60,
      totalSecondsForSession: 25 * 60,
      timerEndTimestamp: null,
      isRunning: false,
      timerInterval: null,

      completedFocusSessions: 0,
      completedFocusMinutes: 0,
      tasks: [],

      // Music & Ambient State (100% Real-Time Open Network Discovery — No Built-in Fixed Playlist)
      musicPopoverOpen: false,
      stationPlaying: false,
      stationProgress: 0, // 0..1
      wavyPhase: 0,
      wavyAmp: 0,
      masterVolume: 0.75, // 0..1
      activeAmbients: new Set(),
      onlineTracks: [],
      currentTrackIndex: 0,
      unplayedShuffleBag: [],
      playedTrackUrls: new Set(),
      discoveredTrackUrls: new Set(),
      isFetchingLiveMusic: false
    };

    function getThemeTokens() {
      const scheme = themeSwitchState.checked ? THEME_TOKEN_TABLE.dark : THEME_TOKEN_TABLE.light;
      return scheme[state.mode] || scheme.focus;
    }

    let lastSwitchFrameTime = performance.now();
    function animateThemeSwitch(now) {
      let dt = (now - lastSwitchFrameTime) / 1000;
      lastSwitchFrameTime = now;
      if (dt > 0.05) dt = 0.016;

      const steps = 3;
      const subDt = dt / steps;
      const k = 380;
      const c = 18;

      for (let i = 0; i < steps; i++) {
        if (themeSwitchState.isDragging) {
          stepChannel(themeSwitchState.x, 900, 48, subDt);
        } else {
          stepChannel(themeSwitchState.x, k, c, subDt);
        }
        stepChannel(themeSwitchState.w, k * 1.15, c * 1.05, subDt);
        stepChannel(themeSwitchState.h, k * 1.15, c * 1.05, subDt);
        stepChannel(themeSwitchState.r, k * 0.9, c * 1.1, subDt);
        stepChannel(themeSwitchState.haloScale, 420, 26, subDt);
      }

      const velocityStretch = Math.min(18, Math.abs(themeSwitchState.x.vel) * 0.022);
      const effectiveW = themeSwitchState.w.pos + velocityStretch;
      const effectiveH = Math.max(38, themeSwitchState.h.pos - velocityStretch * 0.18);

      const widthDelta = effectiveW - SWITCH_GEOM.baseW;
      const progress = (themeSwitchState.x.pos - SWITCH_GEOM.minX) / (SWITCH_GEOM.maxX - SWITCH_GEOM.minX);
      const clampedProg = Math.max(0, Math.min(1, progress));
      const visualX = themeSwitchState.x.pos - widthDelta * clampedProg;

      // Interpolate switch track smoothly between light-off RGB and dark-on RGB without sudden jumps
      const lightTokens = THEME_TOKEN_TABLE.light[state.mode] || THEME_TOKEN_TABLE.light.focus;
      const darkTokens = THEME_TOKEN_TABLE.dark[state.mode] || THEME_TOKEN_TABLE.dark.focus;
      themeTrackEl.style.backgroundColor = lerpRgb(lightTokens.off, darkTokens.on, clampedProg);

      themeThumbEl.style.width = `${effectiveW.toFixed(2)}px`;
      themeThumbEl.style.height = `${effectiveH.toFixed(2)}px`;
      themeThumbEl.style.borderRadius = `${Math.max(10, themeSwitchState.r.pos).toFixed(2)}px`;
      themeThumbEl.style.transform = `translate3d(${visualX.toFixed(2)}px, -50%, 0)`;

      const thumbCenterX = visualX + effectiveW / 2 - 38;
      themeHaloEl.style.transform = `translate3d(${thumbCenterX.toFixed(2)}px, -50%, 0) scale(${themeSwitchState.haloScale.pos.toFixed(3)})`;
      themeHaloEl.style.opacity = themeSwitchState.isPressed ? '1' : '0';

      const rot = (1 - clampedProg) * -90;
      const sc = 0.72 + 0.28 * Math.abs(clampedProg - 0.5) * 2;
      themeThumbSvg.style.transform = `rotate(${rot.toFixed(1)}deg) scale(${sc.toFixed(2)})`;
      if (clampedProg > 0.5) {
        themeSunGroup.classList.add('hidden');
        themeMoonGroup.classList.remove('hidden');
        themeThumbSvg.style.color = lerpRgb(lightTokens.off, darkTokens.on, 0.9);
      } else {
        themeSunGroup.classList.remove('hidden');
        themeMoonGroup.classList.add('hidden');
        themeThumbSvg.style.color = '#D97706';
      }

      requestAnimationFrame(animateThemeSwitch);
    }

    // Save current day's tasks & actual completed focus stats to localStorage (#4)
    function saveDailyDataToStorage() {
      try {
        const payload = {
          dateKey: state.currentDateKey,
          tasks: state.tasks,
          completedFocusSessions: state.completedFocusSessions,
          completedFocusMinutes: state.completedFocusMinutes,
          focusDuration: state.durations.focus,
          darkMode: themeSwitchState.checked
        };
        localStorage.setItem(DAILY_STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {}
    }

    // Load today's tasks & stats from localStorage; auto-resets at 00:00 (#4)
    function loadDailyDataFromStorage() {
      const todayKey = getTodayDateString();
      state.currentDateKey = todayKey;
      try {
        const raw = localStorage.getItem(DAILY_STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.dateKey === todayKey) {
          if (Array.isArray(parsed.tasks)) {
            state.tasks = parsed.tasks;
          }
          if (typeof parsed.completedFocusSessions === 'number' && parsed.completedFocusSessions >= 0) {
            state.completedFocusSessions = parsed.completedFocusSessions;
          }
          if (typeof parsed.completedFocusMinutes === 'number' && parsed.completedFocusMinutes >= 0) {
            state.completedFocusMinutes = parsed.completedFocusMinutes;
          }
          if (typeof parsed.focusDuration === 'number' && parsed.focusDuration >= 1 && parsed.focusDuration <= 180) {
            state.durations.focus = parsed.focusDuration;
            state.totalSecondsForSession = parsed.focusDuration * 60;
            state.timeLeftSeconds = parsed.focusDuration * 60;
          }
          if (typeof parsed.darkMode === 'boolean') {
            themeSwitchState.checked = parsed.darkMode;
            themeSwitchState.x.pos = parsed.darkMode ? SWITCH_GEOM.maxX : SWITCH_GEOM.minX;
            themeSwitchState.x.target = themeSwitchState.x.pos;
          }
        } else {
          state.tasks = [];
          state.completedFocusSessions = 0;
          state.completedFocusMinutes = 0;
          saveDailyDataToStorage();
        }
      } catch (e) {}
    }

    // Live Midnight (00:00) Watcher: automatically clears tasks if 00:00 is reached while app is open
    setInterval(() => {
      const nowKey = getTodayDateString();

    // =========================================================================

    // 5. PIXABAY MUSIC RANDOM STATION ENGINE (#1):
    //    - Zero AI / local synthesized music!

    // =========================================================================
    let audioCtx = null;

    function ensureAudioCtx() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AudioContextClass) {

    // =========================================================================
    // GOOGLE SOUND LIBRARY COUNTDOWN COMPLETION RINGTONES (#5):
    //   - 「专注」 (focus) mode ends: Plays a short classical mechanical twin-bell
    //     alarm clock sound from Google Sound Library (`mechanical_clock_ring.ogg` / `alarm_clock.ogg`).
    //   - 「短歇」 (shortBreak) & 「长歇」 (longBreak) mode ends: Plays a short
    //     typical school class bell sound from Google Sound Library (`medium_bell_ringing_near.ogg`).
    // =========================================================================
    const GOOGLE_RINGTONE_LIBRARY = {
      focus: [
        'https://actions.google.com/sounds/v1/alarms/mechanical_clock_ring.ogg',
        'https://actions.google.com/sounds/v1/cartoon/mechanical_clock_ring.ogg',
        'https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg'
      ],
      breakBell: [
        'https://actions.google.com/sounds/v1/alarms/medium_bell_ringing_near.ogg',
        'https://actions.google.com/sounds/v1/alarms/dinner_bell_triangle.ogg'
      ]
    };

    const preloadedRingtones = { focus: [], breakBell: [] };
    function preloadGoogleRingtones() {
      ['focus', 'breakBell'].forEach(key => {
        GOOGLE_RINGTONE_LIBRARY[key].forEach(url => {
          const a = new Audio();
          a.preload = 'auto';
          a.src = url;
          a.load();
          preloadedRingtones[key].push(a);
        });
      });
    }
    setTimeout(preloadGoogleRingtones, 100);

    function playSessionCompletionRingtone(completedMode) {
      const isFocus = completedMode === 'focus';
      const urls = isFocus ? GOOGLE_RINGTONE_LIBRARY.focus : GOOGLE_RINGTONE_LIBRARY.breakBell;
      const ringDurationMs = isFocus ? 3200 : 3400;
      const targetVol = Math.min(1, Math.max(0.35, state.masterVolume * 0.90));

      let played = false;
      function tryPlayUrl(idx) {
        if (idx >= urls.length || played) return;
        const ringAudio = new Audio(urls[idx]);
        ringAudio.preload = 'auto';
        ringAudio.volume = targetVol;
        // For school bell / classical clock, start right at the active ringing transient
        ringAudio.currentTime = 0.05;

        const playPromise = ringAudio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            played = true;
            // Smooth fade-out after ~2.7s so it's a crisp, brief ringtone (#5)
            const fadeStartMs = ringDurationMs - 600;
            setTimeout(() => {
              const fadeSteps = 12;
              let step = 0;
              const fadeTimer = setInterval(() => {
                step++;
                ringAudio.volume = Math.max(0, targetVol * (1 - step / fadeSteps));
                if (step >= fadeSteps) {
                  clearInterval(fadeTimer);
                  try {
                    ringAudio.pause();
                    ringAudio.src = '';
                  } catch (e) {}
                }
              }, 45);
            }, fadeStartMs);
          }).catch(() => {
            tryPlayUrl(idx + 1);
          });
        }
      }
      tryPlayUrl(0);
    }

    // Station Headroom Gain: Calibrated to 0.28 (plus per-track gain & warm 0.95x tape speed)
    // so station Lo-Fi music is soft, gentle, library-appropriate, and never overpowers ambient sounds (#1, #5).
    const STATION_HEADROOM_GAIN = 0.28;

    let activeDeck = deckA;
    let inactiveDeck = deckB;
    let isCrossfading = false;
    let crossfadeStartPerf = 0;
    const CROSSFADE_DURATION_MS = 3200;
    let activeDeckFadeMultiplier = 1.0;
    let inactiveDeckFadeMultiplier = 0.0;
    let seekLockUntil = 0;
    let pendingSeekRatio = null;

    function applyTrackTuningToDeck(deck, track) {
      if (!deck || !track) return;
      const rate = track.rate || 0.95;
      deck.dataset.trackGain = String(track.gain || 0.80);
      deck.dataset.trackRate = String(rate);
      try {
        deck.preservesPitch = false;
        deck.playbackRate = rate;
      } catch (e) {}
    }

    function computeDeckVolume(deck, masterVol, fadeMult = 1.0) {
      const trackGain = parseFloat(deck && deck.dataset && deck.dataset.trackGain) || 0.80;
      return Math.min(1, Math.max(0, masterVol * STATION_HEADROOM_GAIN * trackGain * fadeMult));
    }

    // =========================================================================
    // REAL-TIME OPEN NETWORK MUSIC DISCOVERY ENGINE (#1):
    //   - ZERO hardcoded local playlist! Dynamically queries open-web audio APIs
    //     in real time via CORS `fetch()`:
    //     1. Openverse Creative Commons Audio API (`api.openverse.org/v1/audio/`)
    //     2. Internet Archive Open Audio Search & Metadata API (`archive.org/advancedsearch.php` & `archive.org/metadata/`)
    //     3. Wikimedia Commons Open Audio Search API (`commons.wikimedia.org/w/api.php`)
    //   - Parses both "MM:SS" and numeric durations so 100% of full-length (60s-480s)
    //     Lo-Fi, Focus, Self-Study, Chillhop, and Library Piano tracks are discovered.
    //   - Tracks played URLs in `state.playedTrackUrls` so songs NEVER repeat.
    // =========================================================================
    const LIVE_ARCHIVE_STUDY_ALBUMS = [
      'jamendo-612992', // Slxt Sync - LoFi Beats to Study and Focus (5 VBR MP3 tracks)
      'jamendo-498615', // Janevo - LoFi Chill Hip Hop (10+ VBR MP3 tracks)

    function parseDurationToSeconds(val) {
      if (!val) return 0;
      if (typeof val === 'number') return val;
      const str = String(val).trim();
      if (str.includes(':')) {
        const parts = str.split(':').map(Number);
        if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
          return parts[0] * 60 + parts[1];
        }
        if (parts.length === 3 && !isNaN(parts[0]) && !isNaN(parts[1]) && !isNaN(parts[2])) {
          return parts[0] * 3600 + parts[1] * 60 + parts[2];
        }
      }
      return parseFloat(str) || 0;
    }

    function cleanTrackDisplayTitle(rawTitle, creator = '') {
      let cleaned = String(rawTitle || '')
        .replace(/^File:/i, '')
        .replace(/\.(mp3|ogg|oga|flac|wav)$/i, '')
        .replace(/^[0-9]{1,3}\s*[-_.]\s*/, '')
        .replace(/[_]+/g, ' ')
        .trim();
      if (!cleaned || cleaned.length < 2) cleaned = 'Lo-Fi Study Instrumental';
      if (cleaned.length > 26) cleaned = cleaned.slice(0, 26).trim();
      const mood = MOOD_TAG_LABELS[randomInt(MOOD_TAG_LABELS.length)];
      if (creator && creator.length <= 14 && !cleaned.toLowerCase().includes(creator.toLowerCase())) {
        return `${cleaned} · ${creator}`;
      }
      return `${cleaned} · ${mood}`;
    }

    function registerDiscoveredTrack(rawTitle, url, creator = '') {
      if (!url || typeof url !== 'string' || !url.startsWith('https://')) return false;
      if (state.discoveredTrackUrls.has(url)) return false;
      if (NOISY_EXCLUDE_REGEX.test(rawTitle) || NOISY_EXCLUDE_REGEX.test(url)) return false;

      state.discoveredTrackUrls.add(url);
      const newTrack = {
        title: cleanTrackDisplayTitle(rawTitle, creator),
        url,
        gain: 0.78,
        rate: 0.95
      };

      state.onlineTracks.push(newTrack);
      const newIdx = state.onlineTracks.length - 1;
      const insertPos = randomInt(state.unplayedShuffleBag.length + 1);
      state.unplayedShuffleBag.splice(insertPos, 0, newIdx);

      // As soon as the very first live online track arrives, bind it to deckA if nothing is playing yet
      if (state.onlineTracks.length === 1 && !state.stationPlaying) {
        state.currentTrackIndex = 0;
        stationTrackTitle.textContent = newTrack.title;
        deckA.src = newTrack.url;
        applyTrackTuningToDeck(deckA, newTrack);
        deckA.load();
      }
      return true;
    }

    async function fetchArchiveItemTracks(identifier, fallbackCreator = '') {
      try {
        const res = await fetch(`https://archive.org/metadata/${encodeURIComponent(identifier)}`);
        if (!res.ok) return 0;
        const data = await res.json();
        if (!data || !Array.isArray(data.files)) return 0;
        const meta = data.metadata || {};
        const creator = Array.isArray(meta.creator) ? meta.creator[0] : (meta.creator || fallbackCreator || '');
        const albumTitle = String(meta.title || identifier);
        if (NOISY_EXCLUDE_REGEX.test(albumTitle)) return 0;

        let added = 0;
        const shuffledFiles = shuffleArrayInPlace([...data.files]);
        for (const f of shuffledFiles) {
          if (!f || !f.name) continue;
          const fname = String(f.name);
          const lower = fname.toLowerCase();
          if (!lower.endsWith('.mp3') && !lower.endsWith('.ogg')) continue;
          const size = parseInt(f.size, 10) || 0;
          const lengthSec = parseDurationToSeconds(f.length);
          // Accept full-length songs (50s to 540s, or 800KB to 20MB)
          if (lengthSec > 0 && (lengthSec < 50 || lengthSec > 540)) continue;
          if (lengthSec === 0 && size > 0 && (size < 800000 || size > 20000000)) continue;

          const trackTitle = f.title || fname.replace(/\.(mp3|ogg)$/i, '');
          const streamUrl = `https://archive.org/download/${encodeURIComponent(identifier)}/${encodeURIComponent(fname).replace(/%2F/g, '/')}`;
          if (registerDiscoveredTrack(trackTitle, streamUrl, creator)) {
            added++;
          }
        }
        return added;
      } catch (e) {
        return 0;
      }
    }

        const res = await fetch(searchUrl);
        if (!res.ok) return 0;
        const data = await res.json();
        const docs = (data && data.response && Array.isArray(data.response.docs)) ? data.response.docs : [];
        if (docs.length === 0) return 0;

        const pickedDocs = shuffleArrayInPlace([...docs]).slice(0, 4);
        const counts = await Promise.all(

    // Live Pixabay Music Search Playlist Crawler:
    // Connects directly to https://pixabay.com/music/search/lofi/?pagi={1..920} (900+ pages)
    // via multi-gateway CORS proxies and extracts full-length cdn.pixabay.com/audio/*.mp3 streams (#1)
    async function fetchPixabayLofiPlaylistPage() {
      const randomPage = 1 + randomInt(920);
      const targetPlaylistUrl = `https://pixabay.com/music/search/lofi/?pagi=${randomPage}`;
      const proxyGateways = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetPlaylistUrl)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetPlaylistUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetPlaylistUrl)}`
      ];

      for (const gatewayUrl of proxyGateways) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5500);
          const res = await fetch(gatewayUrl, { signal: controller.signal });
          clearTimeout(timeoutId);
          if (!res.ok) continue;
          const text = await res.text();
          if (!text || text.length < 500) continue;

          // Extract all direct Pixabay audio CDN MP3 URLs from the fetched page
          const mp3Regex = /https:\/\/cdn\.pixabay\.com\/(?:download\/)?audio\/\d{4}\/\d{2}\/\d{2}\/audio_[a-zA-Z0-9_]+\.mp3(?:\?filename=([a-zA-Z0-9_-]+)\.mp3)?/g;
          let match;
          let added = 0;
          const foundMatches = [];
          while ((match = mp3Regex.exec(text)) !== null) {
            foundMatches.push({
              url: match[0].split('?')[0],
              slug: match[1] || ''
            });
          }
          shuffleArrayInPlace(foundMatches);
          for (const item of foundMatches) {
            const rawName = item.slug
              ? item.slug.replace(/-[0-9]+$/, '').replace(/-/g, ' ')
              : `Pixabay Lofi #${randomPage}`;
            if (registerDiscoveredTrack(rawName, item.url, 'Pixabay Lofi')) {
              added++;
            }
          }
          if (added > 0) return added;
        } catch (e) {
          // Try next gateway
        }
      }
      return 0;
    }

    // Draw next track from the live-discovered random shuffle bag, never repeating (#1)
    function pickRandomNextTrackIndex() {
      const len = state.onlineTracks.length;
      if (len <= 1) return 0;

      if (state.unplayedShuffleBag.length < 14) {
        replenishLiveMusicPool();
      }

      while (state.unplayedShuffleBag.length > 0) {
        const candidateIdx = state.unplayedShuffleBag.pop();
        const candidate = state.onlineTracks[candidateIdx];
        if (candidate && candidateIdx !== state.currentTrackIndex && !state.playedTrackUrls.has(candidate.url)) {
          return candidateIdx;
        }
      }

      const unplayedIndices = [];
      for (let i = 0; i < len; i++) {
        if (i !== state.currentTrackIndex && !state.playedTrackUrls.has(state.onlineTracks[i].url)) {
          unplayedIndices.push(i);
        }
      }

      if (unplayedIndices.length === 0) {
        state.playedTrackUrls.clear();
        replenishLiveMusicPool();
        for (let i = 0; i < len; i++) {
          if (i !== state.currentTrackIndex) unplayedIndices.push(i);
        }
      }

      shuffleArrayInPlace(unplayedIndices);
      state.unplayedShuffleBag = unplayedIndices;
      const nextIdx = state.unplayedShuffleBag.pop();
      return nextIdx !== undefined ? nextIdx : ((state.currentTrackIndex + 1) % len);
    }

    async function transitionToTrack(nextIndex, initialSeekRatio = null) {
      if (state.onlineTracks.length === 0) {
        stationTrackTitle.textContent = '正在实时检索网络纯音乐...';
        await replenishLiveMusicPool();
      }
      const pool = state.onlineTracks;
      if (pool.length === 0) return;

      state.currentTrackIndex = ((nextIndex % pool.length) + pool.length) % pool.length;
      const track = pool[state.currentTrackIndex];
      if (track && track.url) {
        state.playedTrackUrls.add(track.url);
      }

      stationTrackTitle.textContent = track.title;
      const startRatio = initialSeekRatio !== null ? initialSeekRatio : 0;
      state.stationProgress = startRatio;
      pendingSeekRatio = initialSeekRatio;
      state.stationPlaying = true;
      syncMusicUIState();

      const outgoingDeck = activeDeck;
      const incomingDeck = inactiveDeck;
      const wasOutgoingPlaying = !outgoingDeck.paused && outgoingDeck.currentTime > 0;

      activeDeck = incomingDeck;
      inactiveDeck = outgoingDeck;

      incomingDeck.src = track.url;
      applyTrackTuningToDeck(incomingDeck, track);
      incomingDeck.volume = 0;
      incomingDeck.load();

      const applyStartSeekAndPlay = () => {
        applyTrackTuningToDeck(incomingDeck, track);
        if (pendingSeekRatio !== null && incomingDeck.duration && isFinite(incomingDeck.duration)) {
          try {
            incomingDeck.currentTime = pendingSeekRatio * incomingDeck.duration;
            pendingSeekRatio = null;
            seekLockUntil = performance.now() + 500;
          } catch (e) {}
        }
        const p = incomingDeck.play();
        if (p !== undefined) {
          p.catch(() => {
            if (state.stationPlaying && activeDeck === incomingDeck) {
              setTimeout(() => {
                if (state.stationPlaying && activeDeck === incomingDeck && incomingDeck.paused) {
                  transitionToTrack(pickRandomNextTrackIndex());
                }
              }, 400);
            }
          });
        }
      };

      if (incomingDeck.readyState >= 1) {
        applyStartSeekAndPlay();
      } else {
        incomingDeck.addEventListener('loadedmetadata', function onMeta() {
          incomingDeck.removeEventListener('loadedmetadata', onMeta);
          applyStartSeekAndPlay();
        });
      }

      if (wasOutgoingPlaying) {
        isCrossfading = true;
        crossfadeStartPerf = performance.now();
        activeDeckFadeMultiplier = 0.0;
        inactiveDeckFadeMultiplier = 1.0;
      } else {
        isCrossfading = true;
        crossfadeStartPerf = performance.now() - (CROSSFADE_DURATION_MS * 0.55);
        activeDeckFadeMultiplier = 0.0;
        inactiveDeckFadeMultiplier = 0.0;
        try { outgoingDeck.pause(); } catch (e) {}
      }
    }

    async function toggleStationPlayPause() {
      if (state.stationPlaying) {
        state.stationPlaying = false;
        isCrossfading = false;
        activeDeck.pause();
        inactiveDeck.pause();
        syncMusicUIState();
      } else {
        if (state.onlineTracks.length === 0) {
          stationTrackTitle.textContent = '正在实时检索网络纯音乐...';
          await replenishLiveMusicPool();
        }
        if (!activeDeck.src && state.onlineTracks.length > 0) {
          transitionToTrack(pickRandomNextTrackIndex(), state.stationProgress > 0 ? state.stationProgress : null);
        } else if (activeDeck.src) {
          state.stationPlaying = true;
          const currentTrack = state.onlineTracks[state.currentTrackIndex];
          if (currentTrack && currentTrack.url) {
            state.playedTrackUrls.add(currentTrack.url);
          }
          syncMusicUIState();
          isCrossfading = false;
          activeDeckFadeMultiplier = 1.0;
          applyTrackTuningToDeck(activeDeck, currentTrack);
          activeDeck.volume = computeDeckVolume(activeDeck, state.masterVolume, 1.0);
          if (pendingSeekRatio !== null && activeDeck.duration && isFinite(activeDeck.duration)) {
            try {
              activeDeck.currentTime = pendingSeekRatio * activeDeck.duration;
              pendingSeekRatio = null;
            } catch (e) {}
          }
          activeDeck.play().catch(() => {
            transitionToTrack(pickRandomNextTrackIndex());
          });
        }
      }
    }

    [deckA, deckB].forEach(deck => {
      deck.addEventListener('ended', () => {
        if (isSeekingWavy) return;
        if (deck === activeDeck && state.stationPlaying && !isCrossfading) {

        if (deck === activeDeck && state.stationPlaying) {
          setTimeout(() => {
            if (deck === activeDeck && state.stationPlaying) {
              transitionToTrack(pickRandomNextTrackIndex());
            }
          }, 350);
        }
      });
    });

    // Preload Google Sound Library audio files into the built-in browser cache on startup
    const preloadedGoogleSounds = new Map();
    function preloadGoogleSoundLibrary() {
      Object.values(BUILTIN_GOOGLE_AMBIENT_LIBRARY).forEach(group => {
        group.voices.forEach(v => {
          if (!preloadedGoogleSounds.has(v.url)) {
            const a = new Audio();
            a.preload = 'auto';
            a.src = v.url;
            a.load();
            preloadedGoogleSounds.set(v.url, a);
          }
        });
      });
    }
    setTimeout(preloadGoogleSoundLibrary, 150);

    const ambientPlayers = {};

    function startAmbientSound(type) {
      if (ambientPlayers[type]) return;
      const spec = BUILTIN_GOOGLE_AMBIENT_LIBRARY[type];
      if (!spec) return;

      let stopped = false;
      const activeElements = [];
      const webAudioNodes = [];

      // Hardware Web Audio API GainNode Pre-Amp Booster across all 4 ambient sounds ('rain', 'fireplace', 'waves', 'forest')
      // Ensures 'rain' and 'fireplace' are boosted to match the exact same rich, full loudness as 'waves' and 'forest' (#1)
      const PREAMP_BOOST_MAP = {
        rain: [
          { url: 'https://actions.google.com/sounds/v1/weather/light_rain.ogg', boost: 1.35, offset: 0.0 },
          { url: 'https://actions.google.com/sounds/v1/weather/light_rain.ogg', boost: 1.05, offset: 4.5 },
          { url: 'https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg', boost: 0.25, offset: 1.8 }
        ],
        fireplace: [
          { url: 'https://actions.google.com/sounds/v1/ambiences/fire.ogg', boost: 8.5, offset: 0.0 },
          { url: 'https://actions.google.com/sounds/v1/ambiences/fire.ogg', boost: 7.5, offset: 3.5 },
          { url: 'https://actions.google.com/sounds/v1/household/wind_drawn_into_fire.ogg', boost: 4.5, offset: 1.2 }
        ],
        waves: [
          { url: 'https://actions.google.com/sounds/v1/water/waves_crashing_on_rock_beach.ogg', boost: 2.6, offset: 0.0 },
          { url: 'https://actions.google.com/sounds/v1/water/water_lapping_wind.ogg', boost: 4.2, offset: 1.5 }
        ],
        forest: [
          { url: 'https://actions.google.com/sounds/v1/animals/june_songbirds.ogg', boost: 7.5, offset: 0.0 },
          { url: 'https://actions.google.com/sounds/v1/water/small_stream_flowing.ogg', boost: 4.5, offset: 1.2 },
          { url: 'https://actions.google.com/sounds/v1/weather/wind_in_leaves_on_porch.ogg', boost: 5.5, offset: 2.4 },
          { url: 'https://actions.google.com/sounds/v1/ambiences/spring_day_forest.ogg', boost: 9.5, offset: 0.5 }
        ]
      };
      if (PREAMP_BOOST_MAP[type]) {
        const boostUrlList = PREAMP_BOOST_MAP[type];

        boostUrlList.forEach(item => {
          fetch(item.url)
            .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
            .then(buf => {
              ensureAudioCtx();
              if (!audioCtx || stopped) return null;
              return audioCtx.decodeAudioData(buf);
            })
            .then(decoded => {
              if (!decoded || stopped || !audioCtx) return;
              const srcNode = audioCtx.createBufferSource();
              const gainNode = audioCtx.createGain();
              srcNode.buffer = decoded;
              srcNode.loop = true;
              gainNode.gain.value = state.masterVolume * item.boost;
              srcNode.connect(gainNode);
              gainNode.connect(audioCtx.destination);
              const startOffset = (item.offset || 0) % Math.max(0.5, decoded.duration - 0.2);
              srcNode.start(0, startOffset);
              webAudioNodes.push({ srcNode, gainNode, boost: item.boost });
            })
            .catch(() => {});
        });
      }

      spec.voices.forEach((vCfg) => {
        const audio = new Audio(vCfg.url);
        audio.preload = 'auto';
        audio.loop = true;
        audio.playbackRate = vCfg.rate || 1.0;
        audio.preservesPitch = false;

        const voiceObj = {
          audio,
          cfg: vCfg,
          envelope: 1.0
        };
        activeElements.push(voiceObj);

        audio.addEventListener('loadedmetadata', () => {
          if (stopped) return;
          const dur = audio.duration;
          if (dur && isFinite(dur) && dur > 1) {
            const maxEnd = vCfg.activeEnd ? Math.min(dur - 0.1, vCfg.activeEnd) : (dur - 0.2);
            const targetStart = (vCfg.startOffset || 0) % Math.max(0.5, maxEnd);
            try {
              audio.currentTime = Math.max(vCfg.activeStart || 0, targetStart);
            } catch (e) {}
            if (!stopped && audio.paused) {
              audio.play().catch(() => {});
            }
          }
        }, { once: true });

        const targetVol = Math.min(1, Math.max(0, state.masterVolume * vCfg.gain));
        audio.volume = targetVol;
        audio.play().catch(() => {});
      });

      // Seamless Active-Window & Boundary Crossfade Loop Monitor (runs every 60ms)
      // Prevents dead silent tails (e.g. in wind_chimes_of_shells.ogg) and smooths loop boundaries
      // so the user can NEVER tell a clip is looping (#2)
      const loopWatchTimer = setInterval(() => {
        if (stopped) return;
        activeElements.forEach(v => {
          const { audio, cfg } = v;
          if (audio.paused) return;
          const dur = audio.duration;
          if (!dur || !isFinite(dur) || dur <= 0.5) return;

          const startBound = cfg.activeStart || 0.08;
          const endBound = cfg.activeEnd ? Math.min(dur - 0.12, cfg.activeEnd) : (dur - 0.25);
          const span = Math.max(0.6, endBound - startBound);
          const cur = audio.currentTime;

          // Smooth cosine fade window near loop boundaries so wrapping back to startBound is 100% click-free
          const fadeWindow = Math.min(0.45, span * 0.22);
          let env = 1.0;
          if (cur < startBound + fadeWindow) {
            const p = Math.max(0, (cur - startBound) / fadeWindow);
            env = 0.35 + 0.65 * Math.sin(p * Math.PI * 0.5);
          } else if (cur > endBound - fadeWindow) {
            const p = Math.max(0, (endBound - cur) / fadeWindow);
            env = 0.35 + 0.65 * Math.sin(p * Math.PI * 0.5);
          }
          v.envelope = env;
          audio.volume = Math.min(1, Math.max(0, state.masterVolume * cfg.gain * env));

          if (cur >= endBound) {
            try {
              audio.currentTime = startBound + Math.random() * 0.12;
            } catch (e) {}
          }
        });
      }, 60);

      ambientPlayers[type] = {
        updateVolume(masterV) {
          activeElements.forEach(v => {
            v.audio.volume = Math.min(1, Math.max(0, masterV * v.cfg.gain * v.envelope));
          });
          webAudioNodes.forEach(n => {
            try { n.gainNode.gain.value = masterV * n.boost; } catch (e) {}
          });
        },
        resume() {
          ensureAudioCtx();
          activeElements.forEach(v => {
            if (!stopped && v.audio.paused) {
              v.audio.play().catch(() => {});
            }
          });
        },
        stop() {
          stopped = true;
          clearInterval(loopWatchTimer);
          activeElements.forEach(v => {
            try {
              v.audio.pause();
              v.audio.src = '';
            } catch (e) {}
          });
          webAudioNodes.forEach(n => {
            try {
              n.srcNode.stop();
              n.srcNode.disconnect();
              n.gainNode.disconnect();
            } catch (e) {}
          });
        }
      };
    }

    function stopAmbientSound(type) {
      if (ambientPlayers[type]) {
        ambientPlayers[type].stop();
        delete ambientPlayers[type];
      }
    }

    function toggleAmbientOption(type) {
      if (state.activeAmbients.has(type)) {
        state.activeAmbients.delete(type);
        stopAmbientSound(type);
      } else {
        state.activeAmbients.add(type);
        startAmbientSound(type);
      }
      syncMusicUIState();
      updateAmbientGroupSprings(null, null);

    function syncMusicUIState() {

        if (playBtnSpring) {
          playBtnSpring.baseRadii = [18, 18, 18, 18];

      ambientBtns.forEach(btn => {

          btn.style.color = 'var(--md-text-main)';
          btn.style.borderColor = 'var(--md-outline)';

      });

      updateControlRowSprings();
      wakeSpringLoop();
