               style="background-color: var(--md-primary-container); color: var(--md-on-primary-container);">
            <svg id="reminder-modal-icon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
          <h3 id="reminder-modal-title" class="text-xl font-extrabold tracking-tight" style="color: var(--md-text-main);">
            放弃本次专注？
          </h3>
        </div>
        <button id="close-reminder-modal" type="button"
                class="w-9 h-9 rounded-2xl flex items-center justify-center shrink-0 m3-Interactive"
                style="background-color: var(--md-surface); color: var(--md-text-main);"
                aria-label="关闭提醒弹窗">
          ✕
        </button>
      </div>

      <p id="reminder-modal-desc"
         class="text-sm font-semibold leading-relaxed mb-6 pl-[52px]"
         style="color: var(--md-text-muted);">
        本次番茄钟将不计为一次专注记录，但已累计的专注时长会保留。
      </p>

      <div class="flex items-center justify-end gap-2.5">
        <button id="cancel-reminder-btn" type="button"
                class="px-5 py-2.5 rounded-2xl text-xs font-bold m3-Interactive"
                style="background-color: var(--md-surface); color: var(--md-text-muted);">
          取消
        </button>
        <button id="confirm-reminder-btn" type="button"
                class="px-6 py-2.5 rounded-2xl text-xs font-bold shadow-sm m3-Interactive"
                style="background-color: var(--md-primary); color: var(--md-on-primary);">
          确定
        </button>
      </div>
    </div>
  </div>

  <!-- Dual Audio Decks for Smooth Crossfading Between Full-Length Pixabay Music Streams -->
  <audio id="lofi-online-audio" preload="auto" referrerpolicy="no-referrer"></audio>
  <audio id="station-deck-b" preload="auto" referrerpolicy="no-referrer"></audio>

  <script>
    // =========================================================================
    // 1. UNIFIED MATERIAL 3 EXPRESSIVE PHYSICS SPRING ENGINE
    // =========================================================================
    class SpringValue {
      constructor(initial, stiffness = 0.22, damping = 0.72) {
        this.current = initial;
        this.target = initial;
        this.velocity = 0;
        this.stiffness = stiffness;
        this.damping = damping;
      }
      setTarget(t, impulse = 0) {
        this.target = t;
        this.velocity += impulse;
      }
      step() {
        const force = (this.target - this.current) * this.stiffness;
        this.velocity = (this.velocity + force) * this.damping;
        this.current += this.velocity;
        if (Math.abs(this.target - this.current) < 0.001 && Math.abs(this.velocity) < 0.001) {
          this.current = this.target;
          this.velocity = 0;
          return false;
        }
        return true;
      }
    }

    const springElements = new Map();
    let springLoopRunning = false;

    function registerSpringElement(el, config = {}) {
      if (!el) return null;
      if (springElements.has(el)) return springElements.get(el);
      const defaultR = config.radii || [16, 16, 16, 16];
      const item = {
        el,
        flex: new SpringValue(config.flex ?? 1, 0.22, 0.74),
        scaleX: new SpringValue(1, 0.26, 0.70),
        scaleY: new SpringValue(1, 0.26, 0.70),
        tx: new SpringValue(0, 0.22, 0.72),
        ty: new SpringValue(0, 0.22, 0.72),
        rTL: new SpringValue(defaultR[0], 0.22, 0.74),
        rTR: new SpringValue(defaultR[1], 0.22, 0.74),
        rBR: new SpringValue(defaultR[2], 0.22, 0.74),
        rBL: new SpringValue(defaultR[3], 0.22, 0.74),
        baseRadii: [...defaultR],
        hoverRadii: config.hoverRadii || defaultR.map(r => Math.min(34, r + 4)),
        activeRadii: config.activeRadii || defaultR.map(r => Math.max(10, r - 4)),
        useFlex: config.useFlex ?? false,
        preserveCenterTranslate: config.preserveCenterTranslate ?? false
      };
      springElements.set(el, item);
      applySpringStyles(item);

      if (config.autoBind !== false) {
        bindGenericM3SpringEvents(el, item, config);
      }
      return item;
    }

    function applySpringStyles(item) {
      const r0 = Math.max(8, item.rTL.current).toFixed(2);
      const r1 = Math.max(8, item.rTR.current).toFixed(2);
      const r2 = Math.max(8, item.rBR.current).toFixed(2);
      const r3 = Math.max(8, item.rBL.current).toFixed(2);
      item.el.style.borderRadius = `${r0}px ${r1}px ${r2}px ${r3}px`;

      const sx = item.scaleX.current.toFixed(4);
      const sy = item.scaleY.current.toFixed(4);
      const tx = item.tx.current.toFixed(2);
      const ty = item.ty.current.toFixed(2);
      if (item.preserveCenterTranslate) {
        item.el.style.transform = `translate3d(calc(-50% + ${tx}px), ${ty}px, 0) scale(${sx}, ${sy})`;
      } else {
        item.el.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${sx}, ${sy})`;
      }

      if (item.useFlex) {
        item.el.style.flexGrow = Math.max(0.65, item.flex.current).toFixed(4);
      }
    }

    function bindGenericM3SpringEvents(el, item, config) {
      const hoverScale = config.hoverScale ?? 1.04;
      const activeScaleX = config.activeScaleX ?? 1.06;
      const activeScaleY = config.activeScaleY ?? 0.92;
      const magStrength = config.magnetic ?? 0.08;

      el.addEventListener('pointerenter', () => {
        item.scaleX.setTarget(hoverScale);
        item.scaleY.setTarget(hoverScale);
        item.rTL.setTarget(item.hoverRadii[0]);
        item.rTR.setTarget(item.hoverRadii[1]);
        item.rBR.setTarget(item.hoverRadii[2]);
        item.rBL.setTarget(item.hoverRadii[3]);
        wakeSpringLoop();
      });

      el.addEventListener('pointerleave', () => {
        item.scaleX.setTarget(1);
        item.scaleY.setTarget(1);
        item.tx.setTarget(0);
        item.ty.setTarget(0);
        item.rTL.setTarget(item.baseRadii[0]);
        item.rTR.setTarget(item.baseRadii[1]);
        item.rBR.setTarget(item.baseRadii[2]);
        item.rBL.setTarget(item.baseRadii[3]);
        wakeSpringLoop();
      });

      el.addEventListener('pointerdown', () => {
        item.scaleX.setTarget(activeScaleX, 0.03);
        item.scaleY.setTarget(activeScaleY, -0.04);
        item.rTL.setTarget(item.activeRadii[0]);
        item.rTR.setTarget(item.activeRadii[1]);
        item.rBR.setTarget(item.activeRadii[2]);
        item.rBL.setTarget(item.activeRadii[3]);
        wakeSpringLoop();
      });

      el.addEventListener('pointerup', () => {
        item.scaleX.setTarget(hoverScale, 0.02);
        item.scaleY.setTarget(hoverScale, 0.03);
        item.rTL.setTarget(item.hoverRadii[0]);
        item.rTR.setTarget(item.hoverRadii[1]);
        item.rBR.setTarget(item.hoverRadii[2]);
        item.rBL.setTarget(item.hoverRadii[3]);
        wakeSpringLoop();
      });

      if (magStrength > 0) {
        el.addEventListener('pointermove', (e) => {
          const rect = el.getBoundingClientRect();
          const dx = (e.clientX - (rect.left + rect.width / 2)) * magStrength;
          const dy = (e.clientY - (rect.top + rect.height / 2)) * magStrength;
          item.tx.setTarget(dx);
          item.ty.setTarget(dy);
          wakeSpringLoop();
        });
      }
    }

    function pulseElementSpring(el, impulseX = 0.08, impulseY = 0.08) {
      const item = springElements.get(el);
      if (!item) return;
      item.scaleX.velocity += impulseX;
      item.scaleY.velocity += impulseY;
      wakeSpringLoop();
    }

    function wakeSpringLoop() {
      if (springLoopRunning) return;
      springLoopRunning = true;
      function tick() {
        let anyActive = false;
        springElements.forEach(item => {
          const a1 = item.flex.step();
          const a2 = item.scaleX.step();
          const a3 = item.scaleY.step();
          const a4 = item.tx.step();
          const a5 = item.ty.step();
          const a6 = item.rTL.step();
          const a7 = item.rTR.step();
          const a8 = item.rBR.step();
          const a9 = item.rBL.step();
          applySpringStyles(item);
          if (a1 || a2 || a3 || a4 || a5 || a6 || a7 || a8 || a9) {
            anyActive = true;
          }
        });
        if (anyActive) {
          requestAnimationFrame(tick);
        } else {
          springLoopRunning = false;
        }
      }
      requestAnimationFrame(tick);
    }

    // =========================================================================
    // 2. TOP-RIGHT M3 EXPRESSIVE THEME SWITCH & ZERO-FLICKER TOKEN CACHE (#3)
    // =========================================================================
    // Cached theme palette tokens so requestAnimationFrame never triggers
    // synchronous getComputedStyle(document.body) layout thrashing or mid-frame jumps
    const THEME_TOKEN_TABLE = {
      light: {
        focus:      { off: [216, 194, 190], on: [179, 38, 30],  primary: '#B3261E', track: '#F2D3CD' },
        shortBreak: { off: [180, 210, 199], on: [0, 107, 88],   primary: '#006B58', track: '#CBE6DC' },
        longBreak:  { off: [200, 196, 220], on: [87, 84, 168],  primary: '#5754A8', track: '#DCD8EE' }
      },
      dark: {
        focus:      { off: [78, 61, 58],    on: [224, 102, 90], primary: '#FFB4A8', track: '#362624' },
        shortBreak: { off: [56, 73, 68],    on: [46, 158, 133], primary: '#85D6C0', track: '#22332E' },
        longBreak:  { off: [67, 66, 84],    on: [118, 114, 212],primary: '#C3C0FF', track: '#2A293A' }
      }
    };

    const SWITCH_GEOM = {
      trackW: 112,
      trackH: 64,
      minX: 11,
      maxX: 59,
      baseW: 42,
      baseH: 46,
      baseRadius: 14,
      scaleFactor: 0.607
    };

    const themeSwitchState = {
      checked: false,
      isPressed: false,
      isDragging: false,
      dragStartX: 0,
      dragStartThumbX: SWITCH_GEOM.minX,
      pointerMoved: false,
      x: { pos: SWITCH_GEOM.minX, vel: 0, target: SWITCH_GEOM.minX },
      w: { pos: SWITCH_GEOM.baseW, vel: 0, target: SWITCH_GEOM.baseW },
      h: { pos: SWITCH_GEOM.baseH, vel: 0, target: SWITCH_GEOM.baseH },
      r: { pos: SWITCH_GEOM.baseRadius, vel: 0, target: SWITCH_GEOM.baseRadius },
      haloScale: { pos: 0.5, vel: 0, target: 0.5 }
    };

    const themeSwitchEl = document.getElementById('themeSwitch');
    const themeTrackEl = document.getElementById('themeTrack');
    const themeThumbEl = document.getElementById('themeThumb');
    const themeHaloEl = document.getElementById('themeHalo');
    const themeThumbSvg = document.getElementById('themeThumbSvg');
    const themeSunGroup = document.getElementById('themeSunGroup');
    const themeMoonGroup = document.getElementById('themeMoonGroup');

    function updateThemeSwitchTargets() {
      if (!themeSwitchState.isDragging) {
        themeSwitchState.x.target = themeSwitchState.checked ? SWITCH_GEOM.maxX : SWITCH_GEOM.minX;
      }
      if (themeSwitchState.isPressed) {
        themeSwitchState.w.target = SWITCH_GEOM.baseW + 10;
        themeSwitchState.h.target = SWITCH_GEOM.baseH + 2;
        themeSwitchState.haloScale.target = 1.05;
      } else {
        themeSwitchState.w.target = SWITCH_GEOM.baseW;
        themeSwitchState.h.target = SWITCH_GEOM.baseH;
        themeSwitchState.haloScale.target = 0.5;
      }
      themeSwitchState.r.target = themeSwitchState.checked ? 18 : 14;
      themeSwitchEl.setAttribute('aria-checked', String(themeSwitchState.checked));
      // Only mutate DOM class when state actually differs to prevent redundant style invalidation (#3)
      if (document.body.classList.contains('dark-mode') !== themeSwitchState.checked) {
        document.body.classList.toggle('dark-mode', themeSwitchState.checked);
      }
    }

    // Google Sound Library Light Switch Sound Effect — Frame-Synchronized with Switch Animation (#3)
    const GOOGLE_LIGHT_SWITCH_SOUNDS = [
      'https://actions.google.com/sounds/v1/household/lamp_switch_near.ogg',
      'https://actions.google.com/sounds/v1/household/lamp_switch_on_off.ogg',
      'https://actions.google.com/sounds/v1/office/button_push.ogg'
    ];
    let decodedSwitchBuffer = null;
    let decodedSwitchTransientOffset = 0;

    const preloadedSwitchAudios = GOOGLE_LIGHT_SWITCH_SOUNDS.map(url => {
      const a = new Audio();
      a.preload = 'auto';
      a.src = url;
      a.load();
      return a;
    });

    // Scan decoded PCM samples to find the exact millisecond where the mechanical switch click starts,
    // stripping any leading room-tone silence so the sound and thumb animation happen simultaneously!
    function detectClickTransientOffset(audioBuffer) {
      try {
        const data = audioBuffer.getChannelData(0);
        const sr = audioBuffer.sampleRate;
        let peak = 0;
        for (let i = 0; i < data.length; i++) {
          const absVal = Math.abs(data[i]);
          if (absVal > peak) peak = absVal;
        }
        if (peak <= 0) return 0;
        const threshold = peak * 0.16;
        for (let i = 0; i < data.length; i++) {
          if (Math.abs(data[i]) >= threshold) {
            return Math.max(0, (i / sr) - 0.002);
          }
        }
      } catch (e) {}
      return 0;
    }

    (async function preloadAndDecodeSwitchSound() {
      for (const url of GOOGLE_LIGHT_SWITCH_SOUNDS) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const buf = await res.arrayBuffer();
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) break;
          const tempCtx = new AudioContextClass();
          const decoded = await tempCtx.decodeAudioData(buf);
          decodedSwitchBuffer = decoded;
          decodedSwitchTransientOffset = detectClickTransientOffset(decoded);
          tempCtx.close().catch(() => {});
          break;
        } catch (e) {}
      }
    })();

    function playLightSwitchSound(isDarkModeNow) {
      const targetVol = Math.min(1, Math.max(0.50, state.masterVolume * 0.95));
      try {
        ensureAudioCtx();
        if (audioCtx && decodedSwitchBuffer) {
          const src = audioCtx.createBufferSource();
          const gainNode = audioCtx.createGain();
          src.buffer = decodedSwitchBuffer;
          src.playbackRate.value = isDarkModeNow ? 0.95 : 1.05;
          gainNode.gain.value = targetVol * 2.4;
          src.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          // Start immediately at the exact mechanical transient offset (0ms latency!)
          const maxDur = Math.max(0.18, decodedSwitchBuffer.duration - decodedSwitchTransientOffset);
          src.start(0, decodedSwitchTransientOffset, Math.min(0.38, maxDur));
          return;
        }
      } catch (e) {}

      // Fallback direct HTML5 Audio playback from Google Sound Library
      let played = false;
      function trySwitchUrl(idx) {
        if (idx >= GOOGLE_LIGHT_SWITCH_SOUNDS.length || played) return;
        const baseAudio = preloadedSwitchAudios[idx];
        const sfx = baseAudio ? baseAudio.cloneNode() : new Audio(GOOGLE_LIGHT_SWITCH_SOUNDS[idx]);
        sfx.volume = targetVol;
        sfx.playbackRate = isDarkModeNow ? 0.95 : 1.05;
        const p = sfx.play();
        if (p !== undefined) {
          p.then(() => { played = true; }).catch(() => trySwitchUrl(idx + 1));
        }
      }
      trySwitchUrl(0);
    }

    themeSwitchEl.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      // Pre-warm AudioContext on pointerdown so pointerup sound has 0ms initialization latency
      ensureAudioCtx();
      themeSwitchEl.setPointerCapture(e.pointerId);
      themeSwitchState.isPressed = true;
      themeSwitchState.isDragging = false;
      themeSwitchState.pointerMoved = false;
      themeSwitchState.dragStartX = e.clientX;
      themeSwitchState.dragStartThumbX = themeSwitchState.x.pos;
      updateThemeSwitchTargets();
    });

    themeSwitchEl.addEventListener('pointermove', (e) => {
      if (!themeSwitchState.isPressed) return;
      const dxScreen = e.clientX - themeSwitchState.dragStartX;
      const dxLocal = dxScreen / SWITCH_GEOM.scaleFactor;
      if (Math.abs(dxScreen) > 4) {
        themeSwitchState.isDragging = true;
        themeSwitchState.pointerMoved = true;
      }
      if (themeSwitchState.isDragging) {
        let rawX = themeSwitchState.dragStartThumbX + dxLocal;
        if (rawX < SWITCH_GEOM.minX) {
          rawX = SWITCH_GEOM.minX - Math.pow(SWITCH_GEOM.minX - rawX, 0.65) * 0.8;
        } else if (rawX > SWITCH_GEOM.maxX) {
          rawX = SWITCH_GEOM.maxX + Math.pow(rawX - SWITCH_GEOM.maxX, 0.65) * 0.8;
        }
        themeSwitchState.x.target = rawX;
        updateThemeSwitchTargets();
      }
    });

    function handleThemeSwitchRelease() {
      if (!themeSwitchState.isPressed) return;
      themeSwitchState.isPressed = false;
      const prevChecked = themeSwitchState.checked;
      if (themeSwitchState.pointerMoved) {
        const midPoint = (SWITCH_GEOM.minX + SWITCH_GEOM.maxX) / 2;
        const projectedX = themeSwitchState.x.pos + themeSwitchState.x.vel * 0.04;
        themeSwitchState.checked = projectedX >= midPoint;
      } else {
        themeSwitchState.checked = !themeSwitchState.checked;
        themeSwitchState.w.vel += 140;
      }
      themeSwitchState.isDragging = false;
      themeSwitchState.pointerMoved = false;
      if (themeSwitchState.checked !== prevChecked || !themeSwitchState.pointerMoved) {
        playLightSwitchSound(themeSwitchState.checked);
      }
      updateThemeSwitchTargets();
      saveDailyDataToStorage();
    }

    themeSwitchEl.addEventListener('pointerup', handleThemeSwitchRelease);
    themeSwitchEl.addEventListener('pointercancel', handleThemeSwitchRelease);
    themeSwitchEl.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        themeSwitchState.checked = !themeSwitchState.checked;
        themeSwitchState.w.vel += 140;
        playLightSwitchSound(themeSwitchState.checked);
        updateThemeSwitchTargets();
        saveDailyDataToStorage();
      }
    });

    function stepChannel(ch, k, c, dt) {
      const displacement = ch.pos - ch.target;
      const accel = (-k * displacement) - (c * ch.vel);
      ch.vel += accel * dt;
      ch.pos += ch.vel * dt;
    }

    function lerpRgb(a, b, t) {
      const c = Math.max(0, Math.min(1, t));
      return `rgb(${Math.round(a[0] + (b[0] - a[0]) * c)}, ${Math.round(a[1] + (b[1] - a[1]) * c)}, ${Math.round(a[2] + (b[2] - a[2]) * c)})`;
    }

    // =========================================================================
    // 3. POMODORO APP STATE, PIXABAY MUSIC RANDOM POOL & DAILY PERSISTENCE
    // =========================================================================
    const RING_CIRCUMFERENCE = 2 * Math.PI * 112;
    const DAILY_STORAGE_KEY = 'pomodoflow_daily_tasks_v3';

    function getTodayDateString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // Cryptographically-seeded random integer helper
    function randomInt(maxExclusive) {
      if (maxExclusive <= 1) return 0;
      if (window.crypto && window.crypto.getRandomValues) {
        const arr = new Uint32Array(1);
        window.crypto.getRandomValues(arr);
        return arr[0] % maxExclusive;
      }
      return Math.floor(Math.random() * maxExclusive);
    }

    function shuffleArrayInPlace(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const state = {
      currentDateKey: getTodayDateString(),
      mode: 'focus', // 'focus' | 'shortBreak' | 'longBreak'
      durations: {
        focus: 25,
        shortBreak: 5,
        longBreak: 15
      },
      timeLeftSeconds: 25 * 60,
      totalSecondsForSession: 25 * 60,
      remainingMs: 25 * 60 * 1000,
      timerEndTimestamp: null,
      isRunning: false,
      timerInterval: null,

      completedFocusSessions: 0,
      completedFocusMinutes: 0,
      completedFocusRemainderSeconds: 0,
      restCycleStandardSessions: 0,
      restCycleFocusMinutes: 0,
      restCycleRemainderSeconds: 0,
      lastFocusActiveTimestamp: 0,
      restCyclePausedCarryExclusionSecs: 0,
      sessionElapsedMs: 0,
      lastTickStartMs: null,
      tasks: [],
      deletedTaskIds: [],

      // Music & Ambient State (100% Real-Time Open Network Discovery — No Built-in Fixed Playlist)
      musicPopoverOpen: false,
      stationPlaying: false,
      stationProgress: 0, // 0..1
      wavyPhase: 0,
      wavyAmp: 0,
      masterVolume: 0.75, // 0..1
      activeAmbients: new Set(),
      onlineTracks: [],
      currentTrackIndex: 0,
      unplayedShuffleBag: [],
      playedTrackUrls: new Set(),
      discoveredTrackUrls: new Set(),
      isFetchingLiveMusic: false
    };

    function getThemeTokens() {
      const scheme = themeSwitchState.checked ? THEME_TOKEN_TABLE.dark : THEME_TOKEN_TABLE.light;
      return scheme[state.mode] || scheme.focus;
    }

    let lastSwitchFrameTime = performance.now();
    function animateThemeSwitch(now) {
      let dt = (now - lastSwitchFrameTime) / 1000;
      lastSwitchFrameTime = now;
      if (dt > 0.05) dt = 0.016;

      const steps = 3;
      const subDt = dt / steps;
      const k = 380;
      const c = 18;

      for (let i = 0; i < steps; i++) {
        if (themeSwitchState.isDragging) {
          stepChannel(themeSwitchState.x, 900, 48, subDt);
        } else {
          stepChannel(themeSwitchState.x, k, c, subDt);
        }
        stepChannel(themeSwitchState.w, k * 1.15, c * 1.05, subDt);
        stepChannel(themeSwitchState.h, k * 1.15, c * 1.05, subDt);
        stepChannel(themeSwitchState.r, k * 0.9, c * 1.1, subDt);
        stepChannel(themeSwitchState.haloScale, 420, 26, subDt);
      }

      const velocityStretch = Math.min(18, Math.abs(themeSwitchState.x.vel) * 0.022);
      const effectiveW = themeSwitchState.w.pos + velocityStretch;
      const effectiveH = Math.max(38, themeSwitchState.h.pos - velocityStretch * 0.18);

      const widthDelta = effectiveW - SWITCH_GEOM.baseW;
      const progress = (themeSwitchState.x.pos - SWITCH_GEOM.minX) / (SWITCH_GEOM.maxX - SWITCH_GEOM.minX);
      const clampedProg = Math.max(0, Math.min(1, progress));
      const visualX = themeSwitchState.x.pos - widthDelta * clampedProg;

      // Interpolate switch track smoothly between light-off RGB and dark-on RGB without sudden jumps
      const lightTokens = THEME_TOKEN_TABLE.light[state.mode] || THEME_TOKEN_TABLE.light.focus;
      const darkTokens = THEME_TOKEN_TABLE.dark[state.mode] || THEME_TOKEN_TABLE.dark.focus;
      themeTrackEl.style.backgroundColor = lerpRgb(lightTokens.off, darkTokens.on, clampedProg);

      themeThumbEl.style.width = `${effectiveW.toFixed(2)}px`;
      themeThumbEl.style.height = `${effectiveH.toFixed(2)}px`;
      themeThumbEl.style.borderRadius = `${Math.max(10, themeSwitchState.r.pos).toFixed(2)}px`;
      themeThumbEl.style.transform = `translate3d(${visualX.toFixed(2)}px, -50%, 0)`;

      const thumbCenterX = visualX + effectiveW / 2 - 38;
      themeHaloEl.style.transform = `translate3d(${thumbCenterX.toFixed(2)}px, -50%, 0) scale(${themeSwitchState.haloScale.pos.toFixed(3)})`;
      themeHaloEl.style.opacity = themeSwitchState.isPressed ? '1' : '0';

      const rot = (1 - clampedProg) * -90;
      const sc = 0.72 + 0.28 * Math.abs(clampedProg - 0.5) * 2;
      themeThumbSvg.style.transform = `rotate(${rot.toFixed(1)}deg) scale(${sc.toFixed(2)})`;
      if (clampedProg > 0.5) {
        themeSunGroup.classList.add('hidden');
        themeMoonGroup.classList.remove('hidden');
        themeThumbSvg.style.color = lerpRgb(lightTokens.off, darkTokens.on, 0.9);
      } else {
        themeSunGroup.classList.remove('hidden');
        themeMoonGroup.classList.add('hidden');
        themeThumbSvg.style.color = '#D97706';
      }

      requestAnimationFrame(animateThemeSwitch);
    }

    // =========================================================================
    // IP-BASED CROSS-BROWSER & MULTI-LAYER DAILY STORAGE ENGINE (#4 - v12 Fixed):
    //   Fixes morning-to-noon data loss via:
    //   1. Monotonic High-Water-Mark CRDT Merge: Within the same dateKey (YYYY-MM-DD),
    //      completedFocusSessions and total focus seconds NEVER get overwritten by a
    //      newly opened zero-state tab (`Math.max` high-water mark + union task merge).
    //   2. 4-Layer Local Persistence: Synchronously persists across `localStorage`,
    //      `IndexedDB`, `document.cookie`, and `window.name` so iframe/container reloads
    //      never lose local state.
    //   3. Deterministic IPv4-First Public IP Resolution (+ /64 prefix normalization for IPv6)
    //      so dual-stack networks never switch topic keys between morning and noon.
    //   4. Rate-Limit-Safe Cloud Sync: Eliminates the 10s/12s ntfy.sh polling that caused
    //      HTTP 429 rate limiting, and merges across ALL of today's cloud snapshots.
    // =========================================================================
    const DAILY_BACKUP_STORAGE_KEY = 'pomodoflow_daily_backup_v12';
    const DAILY_COOKIE_NAME = 'pf_daily_v12';
    const IDB_DB_NAME = 'pomodoflow_daily_db_v12';
    const IDB_STORE_NAME = 'daily_state';
    const MIN_CLOUD_PULL_INTERVAL_MS = 45 * 1000;

    let cachedClientIPHash = localStorage.getItem('pomodoflow_cached_ip_hash_v12') || localStorage.getItem('pomodoflow_cached_ip_hash') || null;
    let lastAppliedCloudTimestamp = 0;
    let ipResolutionPromise = null;
    let initialCloudSyncCompleted = false;
    let isPullingFromCloud = false;
    let lastCloudPullTimeMs = 0;
    let pendingCloudPushAfterInit = false;

    function normalizeIPForDeterministicHash(rawIp) {
      const trimmed = String(rawIp || '').trim().toLowerCase();
      if (!trimmed) return null;
      // If IPv6 address (contains ':'), normalize to the /64 network prefix (first 4 hextets)
      // so macOS/Windows/iOS temporary privacy IPv6 rotation between morning and noon never changes the hash!
      if (trimmed.includes(':')) {
        const parts = trimmed.split(':').filter(Boolean);
        return 'v6_' + parts.slice(0, 4).join('_');
      }
      return 'v4_' + trimmed.replace(/[^0-9.]/g, '_');
    }

    function sanitizeIPToHash(ipStr) {
      const normalized = normalizeIPForDeterministicHash(ipStr);
      if (!normalized) return null;
      const clean = normalized.replace(/[^a-z0-9]/g, '_');
      let h = 0x811c9dc5;
      for (let i = 0; i < clean.length; i++) {
        h ^= clean.charCodeAt(i);
        h = Math.imul(h, 0x01000193) >>> 0;
      }
      return 'ip_' + clean.slice(0, 16) + '_' + h.toString(16);
    }

    async function resolveClientPublicIPHash() {
      if (cachedClientIPHash && cachedClientIPHash.startsWith('ip_v4_')) {
        return cachedClientIPHash;
      }
      if (ipResolutionPromise) return ipResolutionPromise;

      ipResolutionPromise = (async () => {
        // Tier 1: Strictly IPv4-first endpoints so dual-stack networks always resolve to the exact same IPv4 address
        const ipv4Fetchers = [
          fetch('https://api.ipify.org?format=json', { cache: 'no-store' })
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(d => d && d.ip && !d.ip.includes(':') ? sanitizeIPToHash(d.ip) : Promise.reject()),
          fetch('https://api4.my-ip.io/v2/ip.json', { cache: 'no-store' })
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(d => d && d.ip && !d.ip.includes(':') ? sanitizeIPToHash(d.ip) : Promise.reject()),
          fetch('https://ipinfo.io/json', { cache: 'no-store' })
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(d => d && d.ip && !d.ip.includes(':') ? sanitizeIPToHash(d.ip) : Promise.reject())
        ];

        try {
          const v4Hash = await Promise.any(ipv4Fetchers);
          if (v4Hash) {
            cachedClientIPHash = v4Hash;
            try {
              localStorage.setItem('pomodoflow_cached_ip_hash_v12', v4Hash);
              localStorage.setItem('pomodoflow_cached_ip_hash', v4Hash);
            } catch (e) {}
            return cachedClientIPHash;
          }
        } catch (e) {}

        // Tier 2: Fallback to dual-stack (normalized to /64 prefix if IPv6)
        const fallbackFetchers = [
          fetch('https://api64.ipify.org?format=json', { cache: 'no-store' })
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(d => d && d.ip ? sanitizeIPToHash(d.ip) : Promise.reject()),
          fetch('https://www.cloudflare.com/cdn-cgi/trace', { cache: 'no-store' })
            .then(r => r.ok ? r.text() : Promise.reject())
            .then(txt => {
              const m = /ip=([^\s]+)/.exec(txt);
              return m && m[1] ? sanitizeIPToHash(m[1]) : Promise.reject();
            })
        ];

        try {
          const fbHash = await Promise.any(fallbackFetchers);
          if (fbHash) {
            cachedClientIPHash = fbHash;
            try {
              localStorage.setItem('pomodoflow_cached_ip_hash_v12', fbHash);
              localStorage.setItem('pomodoflow_cached_ip_hash', fbHash);
            } catch (e) {}
          }
        } catch (e) {}

        return cachedClientIPHash;
      })().finally(() => {
        ipResolutionPromise = null;
      });

      return ipResolutionPromise;
    }

    function getIPDailyCloudTopicKeys() {
      const todayKey = getTodayDateString().replace(/[^0-9]/g, '');
      const keys = [];
      if (cachedClientIPHash) {
        keys.push(`pf_daily_${cachedClientIPHash}_${todayKey}`);
      }
      const legacyHash = localStorage.getItem('pomodoflow_cached_ip_hash');
      if (legacyHash && legacyHash !== cachedClientIPHash) {
        keys.push(`pf_daily_${legacyHash}_${todayKey}`);
      }
      keys.push(`pf_daily_default_lan_${todayKey}`);
      return Array.from(new Set(keys));
    }

    function getTotalFocusSecondsFromPayload(p) {
      if (!p) return 0;
      let mins = typeof p.completedFocusMinutes === 'number' && p.completedFocusMinutes >= 0 ? p.completedFocusMinutes : 0;
      const sess = typeof p.completedFocusSessions === 'number' && p.completedFocusSessions >= 0 ? p.completedFocusSessions : 0;
      // Clean up legacy 1-min rounding artifact from older schema
      if (typeof p.completedFocusRemainderSeconds !== 'number' && sess === 0 && mins <= 2) {
        mins = 0;
      }
      const rem = typeof p.completedFocusRemainderSeconds === 'number' && p.completedFocusRemainderSeconds >= 0
        ? (Math.floor(p.completedFocusRemainderSeconds) % 60)
        : 0;
      return (mins * 60) + rem;
    }

    function payloadHasMeaningfulData(p) {
      if (!p) return false;
      return (p.completedFocusSessions || 0) > 0 ||
        getTotalFocusSecondsFromPayload(p) > 0 ||
        (Array.isArray(p.tasks) && p.tasks.length > 0) ||
        (Array.isArray(p.deletedTaskIds) && p.deletedTaskIds.length > 0);
    }

    function buildDailyPayload() {
      const nowTs = Date.now();
      lastAppliedCloudTimestamp = Math.max(lastAppliedCloudTimestamp + 1, nowTs);
      return {
        dateKey: state.currentDateKey,
        updatedAt: lastAppliedCloudTimestamp,
        tasks: state.tasks,
        deletedTaskIds: Array.isArray(state.deletedTaskIds) ? state.deletedTaskIds : [],
        completedFocusSessions: state.completedFocusSessions,
        completedFocusMinutes: state.completedFocusMinutes,
        completedFocusRemainderSeconds: state.completedFocusRemainderSeconds,
        restCycleStandardSessions: state.restCycleStandardSessions,
        restCycleFocusMinutes: state.restCycleFocusMinutes,
        restCycleRemainderSeconds: state.restCycleRemainderSeconds,
        lastFocusActiveTimestamp: state.lastFocusActiveTimestamp || 0,
        focusDuration: state.durations.focus,
        darkMode: themeSwitchState.checked
      };
    }

    // Multi-Layer Local Storage Helpers (localStorage + Cookie + window.name + IndexedDB)
    function writePayloadToLocalLayers(payload) {
      if (!payload || payload.dateKey !== getTodayDateString()) return;
      const jsonStr = JSON.stringify(payload);
      // 1. Primary & Backup localStorage
      try {
        localStorage.setItem(DAILY_STORAGE_KEY, jsonStr);
        localStorage.setItem(DAILY_BACKUP_STORAGE_KEY, jsonStr);
        localStorage.setItem(`${DAILY_BACKUP_STORAGE_KEY}_${payload.dateKey}`, jsonStr);
      } catch (e) {}

      // 2. Cookie (compact backup for same-origin/webview reloads)
      try {
        const compactPayload = {
          dateKey: payload.dateKey,
          updatedAt: payload.updatedAt,
          completedFocusSessions: payload.completedFocusSessions,
          completedFocusMinutes: payload.completedFocusMinutes,
          completedFocusRemainderSeconds: payload.completedFocusRemainderSeconds,
          restCycleStandardSessions: payload.restCycleStandardSessions,
          restCycleFocusMinutes: payload.restCycleFocusMinutes,
          restCycleRemainderSeconds: payload.restCycleRemainderSeconds,
          lastFocusActiveTimestamp: payload.lastFocusActiveTimestamp,
          focusDuration: payload.focusDuration,
          darkMode: payload.darkMode,
          tasks: Array.isArray(payload.tasks) ? payload.tasks.slice(0, 30) : [],
          deletedTaskIds: Array.isArray(payload.deletedTaskIds) ? payload.deletedTaskIds.slice(0, 50) : []
        };
        const encoded = encodeURIComponent(JSON.stringify(compactPayload));
        document.cookie = `${DAILY_COOKIE_NAME}=${encoded}; max-age=86400; path=/; SameSite=Lax`;
      } catch (e) {}

      // 3. window.name backup (survives iframe reloads even if storage is partitioned)
      try {
        window.name = 'PF_DAILY_CACHE:' + jsonStr;
      } catch (e) {}

      // 4. IndexedDB asynchronous durable store
      writePayloadToIndexedDB(payload);
    }

    function readPayloadsFromSyncLocalLayers(todayKey) {
      const candidates = [];
      const tryParse = (raw) => {
        if (!raw || typeof raw !== 'string') return;
        try {
          const obj = JSON.parse(raw);
          if (obj && obj.dateKey === todayKey) candidates.push(obj);
        } catch (e) {}
      };

      try {
        tryParse(localStorage.getItem(DAILY_STORAGE_KEY));
        tryParse(localStorage.getItem(DAILY_BACKUP_STORAGE_KEY));
        tryParse(localStorage.getItem(`${DAILY_BACKUP_STORAGE_KEY}_${todayKey}`));
      } catch (e) {}

      try {
        const match = document.cookie.split('; ').find(row => row.startsWith(`${DAILY_COOKIE_NAME}=`));
        if (match) {
          const val = decodeURIComponent(match.split('=').slice(1).join('='));
          tryParse(val);
        }
      } catch (e) {}

      try {
        if (typeof window.name === 'string' && window.name.startsWith('PF_DAILY_CACHE:')) {
          tryParse(window.name.slice('PF_DAILY_CACHE:'.length));
        }
      } catch (e) {}

      return candidates;
    }

    function openDailyIndexedDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('No IndexedDB'));
        const req = window.indexedDB.open(IDB_DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE_NAME)) {
            db.createObjectStore(IDB_STORE_NAME, { keyPath: 'dateKey' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function writePayloadToIndexedDB(payload) {
      openDailyIndexedDB()
        .then(db => {
          const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
          tx.objectStore(IDB_STORE_NAME).put(payload);
        })
        .catch(() => {});
    }

    function readPayloadFromIndexedDB(todayKey) {
      return openDailyIndexedDB()
        .then(db => new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE_NAME, 'readonly');
          const req = tx.objectStore(IDB_STORE_NAME).get(todayKey);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        }))
        .catch(() => null);
    }

    // CRDT High-Water-Mark Merge:
    // Guarantees that opening a new tab/session at noon with 0 sessions NEVER overwrites
    // morning Pomodoro sessions or focus minutes from the same day!
    function mergeTasksCRDT(localTasks, incomingTasks, deletedIdsSet) {
      const byId = new Map();
      const orderedIds = [];
      const addList = (list) => {
        if (!Array.isArray(list)) return;
        for (const t of list) {
          if (!t || !t.id || deletedIdsSet.has(t.id)) continue;
          if (!byId.has(t.id)) {
            orderedIds.push(t.id);
            byId.set(t.id, { ...t });
          } else {
            const existing = byId.get(t.id);
            const existingTs = existing.updatedAt || 0;
            const incomingTs = t.updatedAt || 0;
            byId.set(t.id, {
              ...existing,
              ...t,
              completed: Boolean(existing.completed || t.completed),
              focusedMinutes: Math.max(existing.focusedMinutes || 0, t.focusedMinutes || 0),
              updatedAt: Math.max(existingTs, incomingTs)
            });
          }
        }
      };
      // Preserve newest ordering first
      addList(incomingTasks);
      addList(localTasks);
      return orderedIds.map(id => byId.get(id));
    }

    function applyDailyPayloadToState(parsed, fromCloud = false) {
      const todayKey = getTodayDateString();
      if (!parsed || parsed.dateKey !== todayKey) return false;

      const incomingTs = typeof parsed.updatedAt === 'number' ? parsed.updatedAt : 1;
      const incomingTotalSecs = getTotalFocusSecondsFromPayload(parsed);
      const localTotalSecs = (state.completedFocusMinutes * 60) + (state.completedFocusRemainderSeconds || 0);
      const incomingSessions = typeof parsed.completedFocusSessions === 'number' && parsed.completedFocusSessions >= 0
        ? parsed.completedFocusSessions
        : 0;

      // Track whether incoming payload has strictly higher cumulative focus data that local state lacked
      // (e.g., when a noon tab had 0 sessions and cloud returned morning's 2 sessions!)
      const incomingHasHigherStats = incomingSessions > state.completedFocusSessions ||
        incomingTotalSecs > localTotalSecs ||
        (Array.isArray(parsed.tasks) && parsed.tasks.length > state.tasks.length);

      lastAppliedCloudTimestamp = Math.max(lastAppliedCloudTimestamp, incomingTs);

      // 1. Merge deletedTaskIds
      const mergedDeletedSet = new Set([
        ...(Array.isArray(state.deletedTaskIds) ? state.deletedTaskIds : []),
        ...(Array.isArray(parsed.deletedTaskIds) ? parsed.deletedTaskIds : [])
      ]);
      state.deletedTaskIds = Array.from(mergedDeletedSet);

      // 2. Merge tasks by ID (union minus deletedTaskIds)
      if (Array.isArray(parsed.tasks)) {
        state.tasks = mergeTasksCRDT(state.tasks, parsed.tasks, mergedDeletedSet);
      }

      // 3. Monotonic High-Water-Mark for Today's Completed Focus Sessions & Focus Duration:
      //    Within the same dateKey, completed sessions and focus duration can ONLY increase!
      state.completedFocusSessions = Math.max(state.completedFocusSessions, incomingSessions);

      const bestTotalSecs = Math.max(localTotalSecs, incomingTotalSecs);
      state.completedFocusMinutes = Math.floor(bestTotalSecs / 60);
      state.completedFocusRemainderSeconds = bestTotalSecs % 60;

      // 4. Merge continuous rest-cycle streak state (choosing whichever has the more recent activity timestamp)
      const incomingLastAct = typeof parsed.lastFocusActiveTimestamp === 'number' ? parsed.lastFocusActiveTimestamp : 0;
      const localLastAct = state.lastFocusActiveTimestamp || 0;
      if (incomingLastAct >= localLastAct) {
        if (typeof parsed.restCycleStandardSessions === 'number' && parsed.restCycleStandardSessions >= 0) {
          state.restCycleStandardSessions = Math.max(state.restCycleStandardSessions, parsed.restCycleStandardSessions);
        }
        if (typeof parsed.restCycleFocusMinutes === 'number' && parsed.restCycleFocusMinutes >= 0) {
          const incStreakSecs = (parsed.restCycleFocusMinutes * 60) + (Math.floor(parsed.restCycleRemainderSeconds || 0) % 60);
          const locStreakSecs = (state.restCycleFocusMinutes * 60) + (state.restCycleRemainderSeconds || 0);
          const bestStreakSecs = Math.max(locStreakSecs, incStreakSecs);
          state.restCycleFocusMinutes = Math.floor(bestStreakSecs / 60);
          state.restCycleRemainderSeconds = bestStreakSecs % 60;
        }
        state.lastFocusActiveTimestamp = Math.max(localLastAct, incomingLastAct);
      }

      // If user returned after a long absence (>= 20 mins since last focus activity), expire ONLY the continuous rest-reminder streak,
      // NEVER today's completedFocusSessions or completedFocusMinutes!
      if (!(state.isRunning && state.mode === 'focus')) {
        const lastAct = state.lastFocusActiveTimestamp || 0;
        const hasStreak = (state.restCycleStandardSessions || 0) > 0 ||
          (state.restCycleFocusMinutes || 0) > 0 ||
          (state.restCycleRemainderSeconds || 0) > 0;
        if (hasStreak && (!lastAct || (Date.now() - lastAct) >= 20 * 60 * 1000)) {
          state.restCycleStandardSessions = 0;
          state.restCycleFocusMinutes = 0;
          state.restCycleRemainderSeconds = 0;
          state.lastFocusActiveTimestamp = 0;
        }
      }

      // 5. Apply preferences (focusDuration & darkMode) only if incoming payload is newer or initial load
      if (!fromCloud || incomingTs >= lastAppliedCloudTimestamp) {
        if (typeof parsed.focusDuration === 'number' && parsed.focusDuration >= 1 && parsed.focusDuration <= 180) {
          const prevFocusDuration = state.durations.focus;
          state.durations.focus = parsed.focusDuration;
          const isModalOpen = typeof reminderConfirmModal !== 'undefined' && reminderConfirmModal && !reminderConfirmModal.classList.contains('hidden');
          const isSessionActiveOrPaused = state.isRunning ||
            state.timeLeftSeconds < state.totalSecondsForSession ||
            (state.sessionElapsedMs || 0) > 0 ||
            (typeof state.remainingMs === 'number' && state.remainingMs < state.totalSecondsForSession * 1000) ||
            isModalOpen;
          if (!isSessionActiveOrPaused && state.mode === 'focus' && prevFocusDuration !== parsed.focusDuration) {
            state.totalSecondsForSession = parsed.focusDuration * 60;
            state.timeLeftSeconds = parsed.focusDuration * 60;
            state.remainingMs = parsed.focusDuration * 60 * 1000;
          }
        }
        if (typeof parsed.darkMode === 'boolean' && !themeSwitchState.isPressed) {
          themeSwitchState.checked = parsed.darkMode;
          themeSwitchState.x.pos = parsed.darkMode ? SWITCH_GEOM.maxX : SWITCH_GEOM.minX;
          themeSwitchState.x.target = themeSwitchState.x.pos;
          updateThemeSwitchTargets();
        }
      }

      // Persist the merged state across all 4 local storage layers
      const mergedSnapshot = buildDailyPayload();
      writePayloadToLocalLayers(mergedSnapshot);

      // If cloud had morning data that had been overwritten by a newer zero-state payload, push repaired merged snapshot back to cloud
      if (fromCloud && incomingHasHigherStats) {
        pushDailyDataToIPCloud(mergedSnapshot);
      }

      renderTasksAndOverview();
      updateClockUI();
      return true;
    }

    async function pushDailyDataToIPCloud(payload) {
      // Guard: Never push an empty zero-state payload to the cloud before the initial cloud pull finishes!
      if (!initialCloudSyncCompleted && !payloadHasMeaningfulData(payload)) {
        pendingCloudPushAfterInit = true;
        return;
      }
      await resolveClientPublicIPHash();
      const topicKeys = getIPDailyCloudTopicKeys();
      const jsonStr = JSON.stringify(payload);
      const b64Str = btoa(unescape(encodeURIComponent(jsonStr)));

      // Push to primary IP topic key (and default_lan fallback topic key) across both cloud stores
      for (const topicKey of topicKeys.slice(0, 2)) {
        // 1. ntfy.sh CORS-simple pub/sub cache
        fetch(`https://ntfy.sh/${topicKey}`, {
          method: 'POST',
          body: jsonStr,
          keepalive: true
        }).catch(() => {});

        // 2. keyvalue.immanuel.co REST KV store
        fetch(`https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/pomodoflow99/${topicKey}/${encodeURIComponent(b64Str)}`, {
          method: 'POST',
          keepalive: true
        }).catch(() => {});
      }
    }

    async function pullDailyDataFromIPCloud(force = false) {
      const todayKey = getTodayDateString();
      if (state.currentDateKey !== todayKey) return;
      const nowMs = Date.now();
      if (isPullingFromCloud) return;
      if (!force && initialCloudSyncCompleted && (nowMs - lastCloudPullTimeMs) < MIN_CLOUD_PULL_INTERVAL_MS) {
        return;
      }
      isPullingFromCloud = true;
      lastCloudPullTimeMs = nowMs;

      try {
        await resolveClientPublicIPHash();
        const topicKeys = getIPDailyCloudTopicKeys();
        const primaryTopicKey = topicKeys[0];

        const fetchPromises = [];
        for (const tKey of topicKeys.slice(0, 2)) {
          // 1. ntfy.sh history scan: Merge ALL messages from today so even if a zero-state was pushed earlier,
          //    the morning Pomodoro records in the topic history are still recovered!
          fetchPromises.push(
            fetch(`https://ntfy.sh/${tKey}/raw?poll=1&since=24h`, { cache: 'no-store' })
              .then(r => r.ok ? r.text() : '')
              .then(text => {
                const lines = String(text || '').trim().split('\n').filter(Boolean);
                const validObjs = [];
                for (const line of lines) {
                  try {
                    const obj = JSON.parse(line);
                    if (obj && obj.dateKey === todayKey) {
                      validObjs.push(obj);
                    }
                  } catch (e) {}
                }
                return validObjs;
              })
          );

          // 2. keyvalue.immanuel.co REST KV store
          fetchPromises.push(
            fetch(`https://keyvalue.immanuel.co/api/KeyVal/GetValue/pomodoflow99/${tKey}`, { cache: 'no-store' })
              .then(r => r.ok ? r.json() : '')
              .then(val => {
                if (!val || typeof val !== 'string') return [];
                const decoded = decodeURIComponent(escape(atob(val)));
                const obj = JSON.parse(decoded);
                return (obj && obj.dateKey === todayKey) ? [obj] : [];
              })
          );
        }

        const results = await Promise.allSettled(fetchPromises);
        const allCloudPayloads = [];
        for (const res of results) {
          if (res.status === 'fulfilled' && Array.isArray(res.value)) {
            allCloudPayloads.push(...res.value);
          }
        }

        if (allCloudPayloads.length > 0) {
          // Sort chronologically and apply every valid snapshot through our monotonic CRDT merger
          allCloudPayloads.sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0));
          for (const snap of allCloudPayloads) {
            applyDailyPayloadToState(snap, true);
          }
        }

        initialCloudSyncCompleted = true;

        // If local state has meaningful data (or had a pending push queued during init), sync full payload back to cloud
        if (
          pendingCloudPushAfterInit ||
          (allCloudPayloads.length === 0 && (state.tasks.length > 0 || state.completedFocusSessions > 0 || state.completedFocusMinutes > 0 || state.completedFocusRemainderSeconds > 0))
        ) {
          pendingCloudPushAfterInit = false;
          pushDailyDataToIPCloud(buildDailyPayload());
        }
      } catch (e) {
        initialCloudSyncCompleted = true;
      } finally {
        isPullingFromCloud = false;
      }
    }

    function saveDailyDataToStorage() {
      const payload = buildDailyPayload();
      writePayloadToLocalLayers(payload);
      pushDailyDataToIPCloud(payload);
    }

    function loadDailyDataFromStorage() {
      const todayKey = getTodayDateString();
      state.currentDateKey = todayKey;

      // 1. Read and merge all synchronous local layers (localStorage primary, backup, cookie, window.name)
      const syncPayloads = readPayloadsFromSyncLocalLayers(todayKey);
      if (syncPayloads.length > 0) {
        syncPayloads.sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0));
        for (const p of syncPayloads) {
          applyDailyPayloadToState(p, false);
        }
      } else {
        // Check if stale previous-day data is in localStorage and clean it up
        try {
          const raw = localStorage.getItem(DAILY_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (!parsed || parsed.dateKey !== todayKey) {
              localStorage.removeItem(DAILY_STORAGE_KEY);
            }
          }
        } catch (e) {}
      }

      // 2. Read and merge from IndexedDB asynchronously (0-5ms)
      readPayloadFromIndexedDB(todayKey).then(idbPayload => {
        if (idbPayload && idbPayload.dateKey === todayKey) {
          applyDailyPayloadToState(idbPayload, false);
        }
      });

    const MAX_CONTINUOUS_FOCUS_GAP_MS = 20 * 60 * 1000; // 20 minutes max gap for continuous focus streak

    function checkAndExpireStaleRestCycle(nowTs = Date.now()) {
      if (state.isRunning && state.mode === 'focus') {
        state.lastFocusActiveTimestamp = nowTs;
        return false;
      }
      const hasStreakData = (state.restCycleStandardSessions || 0) > 0 ||
        (state.restCycleFocusMinutes || 0) > 0 ||
        (state.restCycleRemainderSeconds || 0) > 0;
      const lastActive = state.lastFocusActiveTimestamp || 0;
      const isGapTooLong = !lastActive || (nowTs - lastActive) >= MAX_CONTINUOUS_FOCUS_GAP_MS;

      if (isGapTooLong) {
        // If paused mid-focus and away for >= 20 mins, exclude pre-break elapsed seconds from future continuous streak
        if (state.mode === 'focus' && !state.isRunning && (state.sessionElapsedMs || 0) > 0) {

    // 5. PIXABAY MUSIC RANDOM STATION ENGINE (#1):

    let audioCtx = null;

    function ensureAudioCtx() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {

    // =========================================================================
    // GOOGLE SOUND LIBRARY COUNTDOWN COMPLETION RINGTONES (#5):
    //   - 「专注」 (focus) mode ends: Plays a short classical mechanical twin-bell
    //     alarm clock sound from Google Sound Library (`mechanical_clock_ring.ogg` / `alarm_clock.ogg`).
    //   - 「短歇」 (shortBreak) & 「长歇」 (longBreak) mode ends: Plays a short
    //     typical school class bell sound from Google Sound Library (`medium_bell_ringing_near.ogg`).
    // =========================================================================
    const GOOGLE_RINGTONE_LIBRARY = {
      focus: [
        'https://actions.google.com/sounds/v1/alarms/mechanical_clock_ring.ogg',
        'https://actions.google.com/sounds/v1/cartoon/mechanical_clock_ring.ogg',
        'https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg'
      ],
      breakBell: [
        'https://actions.google.com/sounds/v1/alarms/medium_bell_ringing_near.ogg',
        'https://actions.google.com/sounds/v1/alarms/dinner_bell_triangle.ogg'
      ]
    };

    const preloadedRingtones = { focus: [], breakBell: [] };
    const decodedRingtoneBufferCache = new Map();
    const pendingRingtoneDecodePromises = new Map();

    function fetchAndDecodeRingtoneUrl(url) {
      if (decodedRingtoneBufferCache.has(url)) {
        return Promise.resolve(decodedRingtoneBufferCache.get(url));
      }
      if (pendingRingtoneDecodePromises.has(url)) {
        return pendingRingtoneDecodePromises.get(url);
      }
      const p = fetch(url)
        .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
        .then(buf => {
          ensureAudioCtx();
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          const ctxToUse = audioCtx || (AudioContextClass ? new AudioContextClass() : null);
          if (!ctxToUse) return null;
          return ctxToUse.decodeAudioData(buf);
        })
        .then(decoded => {
          if (decoded) decodedRingtoneBufferCache.set(url, decoded);
          return decoded;
        })
        .catch(() => null)
        .finally(() => {
          pendingRingtoneDecodePromises.delete(url);
        });
      pendingRingtoneDecodePromises.set(url, p);
      return p;
    }

    function preloadGoogleRingtones() {
      ['focus', 'breakBell'].forEach(key => {
        GOOGLE_RINGTONE_LIBRARY[key].forEach(url => {
          const a = new Audio();
          a.preload = 'auto';
          a.src = url;
          a.load();
          preloadedRingtones[key].push(a);
          fetchAndDecodeRingtoneUrl(url);
        });
      });
    }
    setTimeout(preloadGoogleRingtones, 100);

    function playWebAudioBoostedRingtone(decodedBuf, isFocus, ringDurationMs) {
      if (!decodedBuf) return false;
      try {
        ensureAudioCtx();
        if (!audioCtx) return false;
        const now = audioCtx.currentTime;
        const durationSec = ringDurationMs / 1000;
        const fadeStartSec = Math.max(0.5, durationSec - 0.55);

        // High-headroom Web Audio pre-amp boost (4.2x for Focus clock ring, 4.6x for Break bell)
        // with DynamicsCompressorNode so the ringtone is loud, full, and crisp without harsh clipping
        const volScale = Math.max(0.65, state.masterVolume);
        const primaryGainVal = volScale * (isFocus ? 4.2 : 4.6);

        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-5, now);
        compressor.knee.setValueAtTime(6, now);
        compressor.ratio.setValueAtTime(3.5, now);
        compressor.attack.setValueAtTime(0.002, now);
        compressor.release.setValueAtTime(0.12, now);
        compressor.connect(audioCtx.destination);

        // Primary boosted buffer voice + subtle 18ms stereo/harmonic reinforcement voice
        const voiceConfigs = [
          { delaySec: 0.0, gainMult: 1.0, rate: 1.0 },
          { delaySec: 0.018, gainMult: 0.55, rate: 1.002 }
        ];

        voiceConfigs.forEach(cfg => {
          const src = audioCtx.createBufferSource();
          const gainNode = audioCtx.createGain();
          src.buffer = decodedBuf;
          src.playbackRate.value = cfg.rate;

          const voicePeakGain = primaryGainVal * cfg.gainMult;
          gainNode.gain.setValueAtTime(voicePeakGain, now + cfg.delaySec);
          gainNode.gain.setValueAtTime(voicePeakGain, now + cfg.delaySec + fadeStartSec);
          gainNode.gain.linearRampToValueAtTime(0.0001, now + cfg.delaySec + durationSec);

          src.connect(gainNode);
          gainNode.connect(compressor);

          const startOffset = Math.min(0.05, Math.max(0, decodedBuf.duration * 0.02));
          src.start(now + cfg.delaySec, startOffset);
          src.stop(now + cfg.delaySec + durationSec + 0.05);
        });
        return true;
      } catch (e) {
        return false;
      }
    }

    function playSessionCompletionRingtone(completedMode) {
      const isFocus = completedMode === 'focus';
      const urls = isFocus ? GOOGLE_RINGTONE_LIBRARY.focus : GOOGLE_RINGTONE_LIBRARY.breakBell;
      const ringDurationMs = isFocus ? 3300 : 3500;
      // Full-scale HTML5 Audio volume (1.0 ceiling with high floor) to reinforce Web Audio pre-amp
      const targetVol = Math.min(1.0, Math.max(0.88, state.masterVolume));

      // 1. Trigger Web Audio pre-amplified (4.2x - 4.6x GainNode boost) buffer playback immediately if cached
      let webAudioPlayed = false;
      for (let i = 0; i < urls.length; i++) {
        const cachedBuf = decodedRingtoneBufferCache.get(urls[i]);
        if (cachedBuf) {
          webAudioPlayed = playWebAudioBoostedRingtone(cachedBuf, isFocus, ringDurationMs);
          if (webAudioPlayed) break;

      if (!webAudioPlayed) {
        fetchAndDecodeRingtoneUrl(urls[0]).then(dec => {

      // 2. Simultaneously play dual-layered full-volume HTML5 <audio> voices (ensures loud playback
      //    even when browser tab is in background or AudioContext is warming up)
      let played = false;
      function tryPlayUrl(idx) {
        if (idx >= urls.length || played) return;
        const layerDelays = [0, 22];
        layerDelays.forEach((delayMs, layerIdx) => {
          setTimeout(() => {
            const ringAudio = new Audio(urls[idx]);
            ringAudio.preload = 'auto';
            ringAudio.volume = layerIdx === 0 ? targetVol : Math.min(1.0, targetVol * 0.92);
            // Start right at the active ringing transient
            ringAudio.currentTime = 0.05;

            const playPromise = ringAudio.play();
            if (playPromise !== undefined) {
              playPromise.then(() => {
                played = true;
                const fadeStartMs = ringDurationMs - 550;
                setTimeout(() => {
                  const fadeSteps = 12;
                  let step = 0;
                  const startVol = ringAudio.volume;
                  const fadeTimer = setInterval(() => {
                    step++;
                    ringAudio.volume = Math.max(0, startVol * (1 - step / fadeSteps));
                    if (step >= fadeSteps) {
                      clearInterval(fadeTimer);
                      try {
                        ringAudio.pause();
                        ringAudio.src = '';
                      } catch (e) {}
                    }
                  }, 45);
                }, fadeStartMs);
              }).catch(() => {
                if (layerIdx === 0) {
                  tryPlayUrl(idx + 1);
                }
              });
            }
          }, delayMs);
        });
      }
      tryPlayUrl(0);
    }

    // Station Headroom Gain: Calibrated to 0.28 (plus per-track gain & warm 0.95x tape speed)
    // so station Lo-Fi music is soft, gentle, library-appropriate, and never overpowers ambient sounds (#1, #5).

      if (!deck || !track) return;

    }

    function parseDurationToSeconds(val) {
      if (!val) return 0;
      if (typeof val === 'number') return val;
      const str = String(val).trim();
      if (str.includes(':')) {
        const parts = str.split(':').map(Number);
        if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
          return parts[0] * 60 + parts[1];
        }
        if (parts.length === 3 && !isNaN(parts[0]) && !isNaN(parts[1]) && !isNaN(parts[2])) {
          return parts[0] * 3600 + parts[1] * 60 + parts[2];
        }
      }
      return parseFloat(str) || 0;
    }

    function cleanTrackDisplayTitle(rawTitle, creator = '') {

        .replace(/^File:/i, '')
        .replace(/\.(mp3|ogg|oga|flac|wav|m4a)$/i, '')
        .replace(/^[0-9]{1,3}\s*[-_.]\s*/, '')
        .replace(/[_]+/g, ' ')
        .trim();
      if (!cleaned || cleaned.length < 2) cleaned = 'Lo-Fi Instrumental';
      const cleanCreator = String(creator || '').trim();
      if (cleanCreator && !cleaned.toLowerCase().includes(cleanCreator.toLowerCase())) {
        return `${cleaned} - ${cleanCreator}`;
      }
      return cleaned;

    function registerDiscoveredTrack(rawTitle, url, creator = '', durationSec = 0, prioritize = false) {

        if (!data || !Array.isArray(data.files)) return 0;

        const albumTitle = String(meta.title || identifier);
        if (NOISY_EXCLUDE_REGEX.test(albumTitle)) return 0;

        for (const f of shuffledFiles) {

          const fname = String(f.name);

          if (!lower.endsWith('.mp3') && !lower.endsWith('.ogg')) continue;
          const size = parseInt(f.size, 10) || 0;
          const lengthSec = parseDurationToSeconds(f.length);
          if (lengthSec > 0 && (lengthSec < 50 || lengthSec > 540)) continue;
          if (lengthSec === 0 && size > 0 && (size < 800000 || size > 20000000)) continue;

          const trackTitle = f.title || fname.replace(/\.(mp3|ogg)$/i, '');
          const streamUrl = `https://archive.org/download/${encodeURIComponent(identifier)}/${encodeURIComponent(fname).replace(/%2F/g, '/')}`;
          if (registerDiscoveredTrack(trackTitle, streamUrl, creator, lengthSec, true)) {

          let match;
          let added = 0;
          const foundMatches = [];
          while ((match = mp3Regex.exec(text)) !== null) {
            foundMatches.push({
              url: match[0].split('?')[0],
              slug: match[1] || ''
            });
          }
          shuffleArrayInPlace(foundMatches);
          for (const item of foundMatches) {
            const rawName = item.slug
              ? item.slug.replace(/-[0-9]+$/, '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())
              : `Pixabay Lofi Track`;
            if (registerDiscoveredTrack(rawName, item.url, 'Pixabay Music', 0, false)) {
              added++;
            }
          }
          if (added > 0) return added;
        } catch (e) {}
      }
      return 0;
    }

    async function fetchLiveWikimediaAudioBatch() {
      try {
        const q = LIVE_WIKIMEDIA_QUERIES[randomInt(LIVE_WIKIMEDIA_QUERIES.length)];
        const offset = randomInt(15);
        const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=15&gsroffset=${offset}&prop=imageinfo&iiprop=url|size|mime&format=json&origin=*`;
        const res = await fetch(url);
        if (!res.ok) return 0;
        const data = await res.json();
        const pages = (data && data.query && data.query.pages) ? Object.values(data.query.pages) : [];
        let added = 0;
        const shuffled = shuffleArrayInPlace(pages);
        for (const p of shuffled) {
          const info = p && Array.isArray(p.imageinfo) ? p.imageinfo[0] : null;
          if (!info || !info.url) continue;
          const mime = String(info.mime || '').toLowerCase();
          if (!mime.includes('audio') && !mime.includes('ogg') && !mime.includes('mpeg')) continue;
          const size = parseInt(info.size, 10) || 0;
          if (size < 700000 || size > 22000000) continue;
          if (registerDiscoveredTrack(p.title || 'Calm Piano', info.url, 'Classical Piano', 0, true)) {
            added++;
          }
        }
        return added;
      } catch (e) {
        return 0;
      }

    shuffleArrayInPlace([...VERIFIED_DIRECT_LOFI_SEEDS]).forEach(seed => {

    async function replenishLiveMusicPool() {
      if (state.isFetchingLiveMusic) return;
      state.isFetchingLiveMusic = true;
      try {
        const randomAlbums = shuffleArrayInPlace([...LIVE_ARCHIVE_STUDY_ALBUMS]).slice(0, 3);
        await Promise.allSettled([
          fetchLiveItunesLofiBatch(),
          fetchLiveItunesLofiBatch(),
          ...randomAlbums.map(id => fetchArchiveItemTracks(id)),
          fetchLiveArchiveSearchBatch(),
          fetchLiveWikimediaAudioBatch(),
          fetchPixabayLofiPlaylistPage()
        ]);
      } catch (e) {
      } finally {
        state.isFetchingLiveMusic = false;
      }

    replenishLiveMusicPool();

    // Draw next track from the live-discovered random shuffle bag, never repeating (#1)
    function pickRandomNextTrackIndex() {
      const len = state.onlineTracks.length;
      if (len <= 1) return 0;

      if (state.unplayedShuffleBag.length < 14) {
        replenishLiveMusicPool();
      }

      while (state.unplayedShuffleBag.length > 0) {
        const candidateIdx = state.unplayedShuffleBag.pop();
        const candidate = state.onlineTracks[candidateIdx];
        if (candidate && candidateIdx !== state.currentTrackIndex && !state.playedTrackUrls.has(candidate.url)) {
          return candidateIdx;
        }
      }

      const unplayedIndices = [];
      for (let i = 0; i < len; i++) {
        if (i !== state.currentTrackIndex && !state.playedTrackUrls.has(state.onlineTracks[i].url)) {
          unplayedIndices.push(i);
        }
      }

      if (unplayedIndices.length === 0) {
        state.playedTrackUrls.clear();
        replenishLiveMusicPool();
        for (let i = 0; i < len; i++) {
          if (i !== state.currentTrackIndex) unplayedIndices.push(i);
        }
      }

      shuffleArrayInPlace(unplayedIndices);
      state.unplayedShuffleBag = unplayedIndices;
      const nextIdx = state.unplayedShuffleBag.pop();
      return nextIdx !== undefined ? nextIdx : ((state.currentTrackIndex + 1) % len);
    }

    // Unlock AudioContext on first user gesture WITHOUT calling .play().then(() => d.pause())
    // on the active deck (which previously raced with transitionToTrack and paused the song!)
    let decksUnlockedByGesture = false;
    function unlockBothAudioDecksOnGesture() {
      ensureAudioCtx();
      if (decksUnlockedByGesture) return;
      decksUnlockedByGesture = true;
    }

    let crossfadeIntervalId = null;
    let currentTransitionToken = 0;
    let trackFailureRecoveryTimer = null;

    function clearTrackFailureRecoveryTimer() {
      if (trackFailureRecoveryTimer) {
        clearTimeout(trackFailureRecoveryTimer);
        trackFailureRecoveryTimer = null;
      }
    }

    function scheduleNextTrackOnFailure(expectedToken, failedDeck, delayMs = 700) {
      if (!state.stationPlaying || expectedToken !== currentTransitionToken || failedDeck !== activeDeck) return;
      clearTrackFailureRecoveryTimer();
      trackFailureRecoveryTimer = setTimeout(() => {
        trackFailureRecoveryTimer = null;
        if (!state.stationPlaying || expectedToken !== currentTransitionToken || failedDeck !== activeDeck) return;
        // Only switch if the deck actually failed or is still not outputting audio
        if (failedDeck.error || (failedDeck.paused && failedDeck.readyState < 2)) {
          transitionToTrack(pickRandomNextTrackIndex());
        }
      }, delayMs);
    }

    function stopCrossfadeLoop() {
      if (crossfadeIntervalId) {
        clearInterval(crossfadeIntervalId);
        crossfadeIntervalId = null;
      }
      isCrossfading = false;
      activeDeckFadeMultiplier = 1.0;
      inactiveDeckFadeMultiplier = 0.0;
    }

    function stepBackgroundSafeCrossfade() {
      if (!isCrossfading || !state.stationPlaying) return;
      const now = performance.now();
      const elapsed = now - crossfadeStartPerf;
      const p = Math.max(0, Math.min(1, elapsed / CROSSFADE_DURATION_MS));
      activeDeckFadeMultiplier = Math.sin(p * Math.PI * 0.5);
      inactiveDeckFadeMultiplier = Math.cos(p * Math.PI * 0.5);

      activeDeck.volume = computeDeckVolume(activeDeck, state.masterVolume, activeDeckFadeMultiplier);
      if (inactiveDeck !== activeDeck && !inactiveDeck.paused) {
        inactiveDeck.volume = computeDeckVolume(inactiveDeck, state.masterVolume, inactiveDeckFadeMultiplier);
      }

      if (p >= 1) {
        stopCrossfadeLoop();
        activeDeck.volume = computeDeckVolume(activeDeck, state.masterVolume, 1.0);
        if (inactiveDeck !== activeDeck) {
          try {
            inactiveDeck.pause();
            inactiveDeck.currentTime = 0;
          } catch (e) {}
        }
      }
    }

    function isStationAudioActuallyOutputting() {
      if (!state.stationPlaying || !activeDeck) return false;
      if (activeDeck.paused || activeDeck.ended || activeDeck.seeking) return false;
      return activeDeck.readyState >= 2 && activeDeck.currentTime > 0;
    }

    function getEffectiveTrackDuration(deck) {
      if (!deck) return 0;
      const rawDur = deck.duration;
      if (rawDur && isFinite(rawDur) && rawDur > 1 && rawDur < 7200) {
        return rawDur;
      }
      const metaDur = parseFloat(deck.dataset && deck.dataset.trackDuration) || 0;
      if (metaDur > 1) {
        return Math.max(metaDur, (deck.currentTime || 0) + 1);
      }
      if (deck.readyState >= 2 && deck.currentTime > 0) {
        try {
          if (deck.buffered && deck.buffered.length > 0) {
            const bufEnd = deck.buffered.end(deck.buffered.length - 1);
            if (bufEnd > deck.currentTime) return bufEnd;
          }
        } catch (e) {}
      }
      return 0;
    }

    let isGlidingToTrackEnd = false;
    let glideEndTimer = null;

    function cancelTrackEndGlide() {
      isGlidingToTrackEnd = false;
      if (glideEndTimer) {
        clearInterval(glideEndTimer);
        glideEndTimer = null;
      }
    }

    function finishTrackAt100AndAdvance() {
      if (isGlidingToTrackEnd) return;
      isGlidingToTrackEnd = true;
      stopCrossfadeLoop();

      const startProg = state.stationProgress;
      const startPerf = performance.now();
      const glideMs = Math.max(120, Math.min(360, (1 - startProg) * 3500));
      const holdAtEndMs = 220;

      if (glideEndTimer) clearInterval(glideEndTimer);
      glideEndTimer = setInterval(() => {
        if (!state.stationPlaying || isSeekingWavy) {
          cancelTrackEndGlide();
          return;
        }
        const elapsed = performance.now() - startPerf;
        if (elapsed < glideMs) {
          const t = elapsed / glideMs;
          state.stationProgress = Math.min(1, startProg + (1 - startProg) * t);
        } else if (elapsed < glideMs + holdAtEndMs) {
          state.stationProgress = 1;
        } else {
          cancelTrackEndGlide();
          if (state.stationPlaying && !isSeekingWavy) {
            transitionToTrack(pickRandomNextTrackIndex());
          }
        }
      }, 16);
    }

    function syncStationProgressFromActiveDeck() {
      if (isSeekingWavy || isGlidingToTrackEnd || performance.now() <= seekLockUntil) return;
      if (!state.stationPlaying || !activeDeck) return;

      if (!isStationAudioActuallyOutputting()) {
        if (activeDeck.currentTime === 0 && pendingSeekRatio === null) {
          state.stationProgress = 0;
        }
        return;
      }

      const realDur = getEffectiveTrackDuration(activeDeck);
      if (realDur > 0) {
        const effectiveSpan = Math.max(1, realDur - 0.25);
        state.stationProgress = Math.max(0, Math.min(1, activeDeck.currentTime / effectiveSpan));
      }
    }

    async function transitionToTrack(nextIndex, initialSeekRatio = null) {
      cancelTrackEndGlide();
      clearTrackFailureRecoveryTimer();
      const myToken = ++currentTransitionToken;

      if (state.onlineTracks.length === 0) {
        setStationTrackTitle('正在实时检索网络纯音乐...');
        await replenishLiveMusicPool();
        if (myToken !== currentTransitionToken) return;
      }
      const pool = state.onlineTracks;
      if (pool.length === 0) return;

      state.currentTrackIndex = ((nextIndex % pool.length) + pool.length) % pool.length;
      const track = pool[state.currentTrackIndex];
      if (track && track.url) {
        state.playedTrackUrls.add(track.url);
      }

      setStationTrackTitle(track.title);
      const startRatio = initialSeekRatio !== null ? initialSeekRatio : 0;
      state.stationProgress = startRatio;
      pendingSeekRatio = initialSeekRatio;
      state.stationPlaying = true;
      syncMusicUIState();

      const isBackgroundTab = document.hidden || document.visibilityState === 'hidden';
      const outgoingDeck = activeDeck;
      const wasOutgoingPlaying = !outgoingDeck.paused && outgoingDeck.currentTime > 0;

      if (isBackgroundTab || !wasOutgoingPlaying) {
        stopCrossfadeLoop();
        if (inactiveDeck !== activeDeck) {
          try { inactiveDeck.pause(); } catch (e) {}
        }
        const targetDeck = activeDeck;
        targetDeck.muted = false;
        targetDeck.src = track.url;
        applyTrackTuningToDeck(targetDeck, track);
        activeDeckFadeMultiplier = 1.0;
        targetDeck.volume = computeDeckVolume(targetDeck, state.masterVolume, 1.0);

        if (pendingSeekRatio !== null) {
          targetDeck.addEventListener('loadedmetadata', function onSeekMeta() {
            targetDeck.removeEventListener('loadedmetadata', onSeekMeta);
            if (myToken !== currentTransitionToken) return;
            applyTrackTuningToDeck(targetDeck, track);
            const effDur = getEffectiveTrackDuration(targetDeck);
            if (pendingSeekRatio !== null && effDur > 1) {
              try {
                targetDeck.currentTime = pendingSeekRatio * effDur;
                pendingSeekRatio = null;
                seekLockUntil = performance.now() + 500;
              } catch (e) {}
            }
          });
        }

        const playPromise = targetDeck.play();
        if (playPromise !== undefined) {
          playPromise.catch((err) => {
            // Ignore AbortError (load superseded) or NotAllowedError
            if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) return;
            scheduleNextTrackOnFailure(myToken, targetDeck, 700);
          });
        }
        return;
      }

      // Foreground tab with outgoing track playing: smooth dual-deck crossfade
      const incomingDeck = inactiveDeck;
      activeDeck = incomingDeck;
      inactiveDeck = outgoingDeck;

      incomingDeck.muted = false;
      incomingDeck.src = track.url;
      applyTrackTuningToDeck(incomingDeck, track);
      incomingDeck.volume = computeDeckVolume(incomingDeck, state.masterVolume, 0.08);

      if (pendingSeekRatio !== null) {
        incomingDeck.addEventListener('loadedmetadata', function onMeta() {
          incomingDeck.removeEventListener('loadedmetadata', onMeta);
          if (myToken !== currentTransitionToken) return;
          applyTrackTuningToDeck(incomingDeck, track);
          const effDur = getEffectiveTrackDuration(incomingDeck);
          if (pendingSeekRatio !== null && effDur > 1) {
            try {
              incomingDeck.currentTime = pendingSeekRatio * effDur;
              pendingSeekRatio = null;
              seekLockUntil = performance.now() + 500;
            } catch (e) {}
          }
        });
      }

      const p = incomingDeck.play();
      if (p !== undefined) {
        p.catch((err) => {
          if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) return;
          scheduleNextTrackOnFailure(myToken, incomingDeck, 700);
        });
      }

      stopCrossfadeLoop();
      isCrossfading = true;
      crossfadeStartPerf = performance.now();
      activeDeckFadeMultiplier = 0.08;
      inactiveDeckFadeMultiplier = 1.0;
      crossfadeIntervalId = setInterval(stepBackgroundSafeCrossfade, 50);
    }

    async function toggleStationPlayPause() {
      unlockBothAudioDecksOnGesture();
      if (state.stationPlaying) {
        state.stationPlaying = false;
        currentTransitionToken++;
        clearTrackFailureRecoveryTimer();
        stopCrossfadeLoop();
        activeDeck.pause();
        inactiveDeck.pause();
        syncMusicUIState();
      } else {

        if (!activeDeck.src && state.onlineTracks.length > 0) {

          if (currentTrack && currentTrack.url) {

          { url: 'https://actions.google.com/sounds/v1/ambiences/outdoor_summer_ambience.ogg', gain: 1.00, rate: 1.00, startOffset: 1.0, activeStart: 0.2, activeEnd: null },
          { url: 'https://actions.google.com/sounds/v1/ambiences/spring_day_forest.ogg', gain: 1.00, rate: 1.00, startOffset: 0.0, activeStart: 0.2, activeEnd: null }
        ]
